<!--
  ============================================================================
  Daily Read · 单文件英语阅读站点
  ----------------------------------------------------------------------------
  纯前端，无后端、无框架、无外部依赖，双击本文件即可运行。
  所有学习记录（已读、生词掌握、主题、字号）都存在浏览器 localStorage，
  换浏览器或清理缓存会丢失，属于预期行为。

  【日常使用】
  1) 每天在下面的 ARTICLES 数组最前面加一篇新文章（复制一份旧的结构改内容）
  2) 正文里用 {{单词}} 标记重点词（会自动加粗+下划线，可点击查词）
  3) 同一个单词必须在 words 里有一条词条，否则点击无内容
  4) 保存刷新即可，历史归档、单词本会自动收录

  【目录】
  §0  CSS 变量与主题
  §1  页面骨架样式
  §2  阅读区样式
  §3  单词本 / 归档 / 设置样式
  §4  底部液态玻璃导航
  §5  数据区（文章 + 词库）
  §6  状态与工具函数
  §7  视图渲染
  §8  事件绑定
  ============================================================================
-->
<style>
/* ==========================================================================
   §0  CSS 变量与主题
   ========================================================================== */
:root{
  --bg:#faf9f6;
  --surface:#ffffff;
  --surface-2:#f5f3ed;
  --ink:#17181a;
  --ink-2:#4b4d52;
  --ink-3:#8b8c90;
  --line:#e7e4db;
  --line-soft:#f0eee7;
  --accent:#0d6e66;
  --accent-ink:#0a5a53;
  --accent-soft:#e2f0ed;
  --hover:rgba(20,20,20,.028);
  --shadow-sm:0 1px 2px rgba(24,20,12,.05);
  --shadow-md:0 10px 30px -12px rgba(24,20,12,.18);
  --fs:19px;                 /* 英文正文字号，由设置页控制 */
  --dock-h:74px;             /* 底部导航高度，正文避让用 */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  /* 插图配色（SVG 里用 class 引用，深浅色各一套） */
  --fig-ink:#3c3e42;
  --fig-line:#ddd8ce;
  --fig-accent:#0d6e66;
  --fig-accent-2:#b0662c;
  --fig-soft:#f1ede4;
  /* 缓动曲线：进场用 ease-out 系，位移用 Apple 的减速曲线 */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.32,.42,1);
}
[data-theme="dark"]{
  --bg:#0e0f11;
  --surface:#17191c;
  --surface-2:#1e2126;
  --ink:#eae8e3;
  --ink-2:#b7b5af;
  --ink-3:#797872;
  --line:#2b2e33;
  --line-soft:#212429;
  --accent:#5ec8ba;
  --accent-ink:#7fd9cd;
  --accent-soft:#153a37;
  --hover:rgba(255,255,255,.038);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 12px 34px -14px rgba(0,0,0,.7);
  --fig-ink:#c9c7c2;
  --fig-line:#33373d;
  --fig-accent:#5ec8ba;
  --fig-accent-2:#d9975a;
  --fig-soft:#1e2126;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:auto;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background .3s ease,color .3s ease;
}
[hidden]{display:none !important;}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;}
::selection{background:var(--accent-soft);color:var(--accent-ink);}

/* ==========================================================================
   §1  页面骨架
   ========================================================================== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);                 /* 老浏览器回退 */
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{
  max-width:820px;margin:0 auto;
  height:58px;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.brand-mark{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:var(--accent);color:#fff;
  display:grid;place-items:center;
  font-family:var(--serif);font-size:15px;font-weight:600;
  box-shadow:var(--shadow-sm);
}
[data-theme="dark"] .brand-mark{color:#08211f;}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;}
.brand-txt b{font-size:14.5px;letter-spacing:.01em;}
.brand-txt i{font-style:normal;font-size:11px;color:var(--ink-3);letter-spacing:.03em;}
.icon-btn{
  width:34px;height:34px;border-radius:10px;
  border:1px solid transparent;background:transparent;
  display:grid;place-items:center;color:var(--ink-2);
  transition:background .18s,color .18s,transform .18s;
}
.icon-btn:hover{background:var(--hover);color:var(--ink);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

/* 环境色层：几乎没有存在感，但玻璃要"透"出点什么才像玻璃 */
.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 420px at 6% 12%, rgba(13,110,102,.06), transparent 68%),
    radial-gradient(560px 420px at 98% 64%, rgba(176,102,44,.05), transparent 68%),
    radial-gradient(760px 480px at 46% 106%, rgba(13,110,102,.07), transparent 66%);
}
[data-theme="dark"] .ambient{
  background:
    radial-gradient(620px 420px at 6% 12%, rgba(94,200,186,.075), transparent 68%),
    radial-gradient(560px 420px at 98% 64%, rgba(217,151,90,.05), transparent 68%),
    radial-gradient(760px 480px at 46% 106%, rgba(94,200,186,.09), transparent 66%);
}

.wrap{
  position:relative;z-index:1;
  max-width:820px;margin:0 auto;
  padding:0 20px;
  /* 自动避开底部导航：dock 高度 + 安全区 */
  padding-bottom:calc(var(--dock-h) + 46px + env(safe-area-inset-bottom,0px));
}
/* 横向页面舞台：四页并排放在一条滑轨上，靠 transform 平移 */
.stage{position:relative;overflow-x:hidden;overflow-x:clip;overflow-y:visible;}
.view{
  position:absolute;top:0;left:0;width:100%;
  /* 这里千万不要加 will-change / backface-visibility：
     四页都是整页高度，会各自生成一张巨大的合成层，手机上直接卡死 */
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}

/* ==========================================================================
   §2  阅读区
   ========================================================================== */
.art-head{padding:34px 0 0;}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.tag{
  font-size:11.5px;letter-spacing:.02em;
  padding:3px 9px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent-ink);
  font-weight:600;
}
.meta time{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;}
.art-title{
  font-family:var(--serif);
  font-size:31px;line-height:1.24;font-weight:600;
  letter-spacing:-.012em;margin:0 0 8px;
}
.art-sub{
  font-family:var(--serif);font-style:italic;
  font-size:15px;color:var(--ink-3);
  margin:0 0 20px;line-height:1.5;
}
.statbar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:11px 0;margin-bottom:4px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3);
  letter-spacing:.02em;
}
.statbar span{display:inline-flex;align-items:center;gap:5px;}
.statbar .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.5;}
.statbar b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums;}

.toolbar{
  position:sticky;top:58px;z-index:30;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 0;
  background:var(--bg);
}
/* 工具条下方做一层淡出，避免正文滚动时出现生硬的切边 */
.toolbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;
  background:linear-gradient(var(--bg),transparent);
  pointer-events:none;
}
.seg{
  display:inline-flex;padding:3px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line-soft);
}
.seg button{
  border:0;background:transparent;border-radius:7px;
  padding:5px 12px;font-size:12.5px;color:var(--ink-3);
  transition:.18s;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:600;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;color:var(--ink-2);
  transition:.18s;
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink);}
.btn:active{transform:scale(.98);}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
[data-theme="dark"] .btn.on{color:#08211f;}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

/* --- 句子行 --- */
.reading{padding:8px 0 0;}
.sent{
  position:relative;
  padding:9px 34px 9px 10px;
  margin:0 -10px 6px;
  border-radius:10px;
  transition:background .18s;
}
.sent:hover{background:var(--hover);}
.sent.now{background:var(--accent-soft);}
.sent .en{
  font-family:var(--serif);
  font-size:var(--fs);
  line-height:1.78;
  color:var(--ink);
  letter-spacing:.002em;
}
.sent .zh{
  font-size:14.5px;
  line-height:1.85;
  color:var(--ink-3);
  margin-top:5px;
  letter-spacing:.01em;
}
.reading.only-en .zh{display:none;}
.reading.only-en .sent{padding-bottom:10px;}

/* 重点词：加粗 + 下划线 */
.w{
  font-weight:700;
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-underline-offset:3.5px;
  text-decoration-color:var(--accent);
  cursor:pointer;
  border-radius:3px;
  transition:background .16s,color .16s,text-decoration-color .16s;
}
.w:hover,.w:focus-visible{
  background:var(--accent-soft);
  color:var(--accent-ink);
  outline:none;
}

/* 单句朗读按钮 */
.spk{
  position:absolute;right:2px;top:12px;
  width:24px;height:24px;padding:0;
  border:0;background:transparent;border-radius:7px;
  color:var(--ink-3);opacity:0;
  display:grid;place-items:center;
  transition:opacity .18s,background .18s,color .18s;
}
.sent:hover .spk,.sent.now .spk{opacity:1;}
.spk:hover{background:var(--surface-2);color:var(--accent-ink);}
.spk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round;}
@media (hover:none){.spk{opacity:.42;}}

/* --- 本篇重点词条带 --- */
.wordstrip{margin:34px 0 6px;padding-top:18px;border-top:1px solid var(--line);}
.strip-label{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin:0 0 12px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  border:1px solid var(--line);background:var(--surface);
  border-radius:7px;padding:4px 10px;
  font-family:var(--serif);font-size:13.5px;color:var(--ink-2);
  transition:.16s;
}
.chip:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}

/* --- 理解题 --- */
.quiz{margin:36px 0 0;padding-top:22px;border-top:1px solid var(--line);}
.quiz-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
.quiz-head h3{
  font-family:var(--serif);font-size:18px;font-weight:600;margin:0;letter-spacing:-.005em;
}
.quiz-head span{font-size:12px;color:var(--ink-3);}
.q{margin:20px 0 0;}
.q p.qtext{margin:0 0 10px;font-size:14.5px;color:var(--ink);line-height:1.6;}
.q p.qtext b{color:var(--accent-ink);margin-right:6px;}
.opts{display:flex;flex-direction:column;gap:6px;}
.opt{
  text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;padding:9px 13px;
  font-size:13.5px;color:var(--ink-2);line-height:1.5;
  transition:.16s;
}
.opt:hover{border-color:var(--ink-3);}
.opt.right{border-color:#1f9d5a;background:rgba(31,157,90,.09);color:#177a45;}
.opt.wrong{border-color:#cf5b4a;background:rgba(207,91,74,.08);color:#a8402f;}
[data-theme="dark"] .opt.right{color:#6fd39a;border-color:#3f8f68;background:rgba(60,150,105,.14);}
[data-theme="dark"] .opt.wrong{color:#e78d7e;border-color:#8f4f45;background:rgba(160,70,58,.16);}
.opt .k{font-weight:700;margin-right:7px;opacity:.6;}
.answer{
  margin:10px 0 0;padding:10px 13px;border-radius:9px;
  background:var(--surface-2);border-left:2px solid var(--accent);
  font-size:13px;color:var(--ink-2);line-height:1.65;
}
.answer b{color:var(--accent-ink);}

/* --- 文章插图 --- */
.fig{
  margin:34px 0 8px;
  padding:20px 22px 16px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.fig-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 16px;}
.fig-head b{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:700;white-space:nowrap;
}
.fig-head span{font-size:11.5px;color:var(--ink-3);}
.fig svg{display:block;width:100%;height:auto;}
/* 窄屏时图里文字会缩到看不清，改成可横向滑动，字号保持不变 */
.fig-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
.fig-scroll::-webkit-scrollbar{height:6px;}
.fig-scroll::-webkit-scrollbar-track{background:transparent;}
.fig-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.fig-cap{
  margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--ink-3);line-height:1.68;
}
.fig-cap b{color:var(--ink-2);font-weight:600;}

/* SVG 内部样式统一走 class，深浅色靠 CSS 变量切换 */
.fig svg text{font-family:var(--sans);fill:var(--fig-ink);}
.fig svg .t{font-size:13px;font-weight:600;}
.fig svg .s{font-size:11.5px;opacity:.72;}
.fig svg .xs{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;}
.fig svg .mono{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:12.5px;}
.fig svg .b{font-size:15px;font-weight:700;font-family:var(--serif);}
.fig svg .pad{fill:none;stroke:var(--fig-accent-2);stroke-width:2;stroke-linecap:round;}
.fig svg .ln{stroke:var(--fig-line);stroke-width:1;fill:none;}
.fig svg .dash{stroke-dasharray:3 4;}
.fig svg .acc{fill:var(--fig-accent);}
.fig svg .acc2{fill:var(--fig-accent-2);}
.fig svg .accs{fill:var(--fig-accent);opacity:.15;}
.fig svg .acc2s{fill:var(--fig-accent-2);opacity:.15;}
.fig svg .box{fill:var(--fig-soft);stroke:var(--fig-line);}
.fig svg .mk{fill:var(--fig-line);}

/* --- WHY IT MATTERS 说明卡 --- */
.callout{
  margin:32px 0;
  padding:16px 18px 17px;
  border-radius:13px;
  background:var(--accent-soft);
  border:1px solid var(--line);
  border-color:color-mix(in srgb, var(--accent) 20%, transparent);
}
.callout p{margin:0;}
.callout .cl{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:700;margin-bottom:8px;
}
.callout .ce{
  font-family:var(--serif);font-size:15px;line-height:1.62;color:var(--ink);
}
.callout .cz{font-size:12.5px;line-height:1.72;color:var(--ink-2);opacity:.88;margin-top:6px;}

/* --- 上下篇 --- */
.pager{
  display:flex;gap:10px;margin:38px 0 0;padding-top:20px;
  border-top:1px solid var(--line);
}
.pager a{
  flex:1;min-width:0;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:11px;
  padding:12px 15px;background:var(--surface);
  transition:.18s;
}
.pager a:hover{border-color:var(--accent);text-decoration:none;}
.pager .lbl{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:3px;}
.pager .tt{display:block;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pager a.next{text-align:right;}
.pager a.dis{opacity:.4;pointer-events:none;}

/* --- 查词弹窗 --- */
.tip{
  position:fixed;left:0;top:0;z-index:120;
  width:min(320px,calc(100vw - 24px));
  padding:14px 16px 15px;
  border-radius:13px;
  background:var(--surface);            /* 老浏览器回退 */
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  backdrop-filter:blur(18px) saturate(180%);
  border:1px solid var(--line);
  box-shadow:0 18px 44px -16px rgba(20,18,12,.32),0 2px 8px rgba(20,18,12,.06);
  animation:tipIn .16s ease both;
}
@keyframes tipIn{from{opacity:0;transform:translateY(5px) scale(.985);}to{opacity:1;transform:none;}}
.tip .tw{
  font-family:var(--serif);font-size:17px;font-weight:700;
  letter-spacing:-.01em;margin-bottom:2px;
}
.tip .ipa{
  font-family:"Segoe UI",var(--sans);font-size:12.5px;
  color:var(--accent-ink);letter-spacing:.02em;margin-bottom:7px;
}

/* ==========================================================================
   §3  单词本 / 归档 / 设置
   ========================================================================== */
.page-head{padding:36px 0 20px;}

.wb-bar{

.wb-count{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}

.wb-row{

.wb-list.hide .wb-cn{filter:blur(5px);opacity:.55;cursor:pointer;user-select:none;}
.wb-list.hide .wb-row.reveal .wb-cn{filter:none;opacity:1;}

.wb-done{

/* 归档 */
.hist-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.hist-card{

/* 设置 */
.set-group{

/* ==========================================================================
   §4  底部液态玻璃导航（iOS 风格 liquid glass dock）
   --------------------------------------------------------------------------
   分层结构（自下而上）：
     .dock          定位容器：圆角、外阴影、拖拽位移
     .dock-glass    磨砂层：backdrop-filter 模糊 + 低透明度染色 + 内高光
     .dock-lens     折射层：SVG feDisplacementMap（Chromium 专有；
                    其他浏览器会丢弃整条声明，该层自动透明，不影响磨砂兜底）
     .dock-sheen    镜面层：跟随指针的柔光
     .dock-rim      边缘渐变描边（遮罩挖空做出 1px 渐变环）
     .dock-ind      选中项滑块
     .dock-item     图标 + 文字
   参考实现：liquid-glass-react 的三通道色散架构；
   rxing365 WebGL 仓库 README 里"固定形状改用预计算法线图 + SVG 滤镜"的建议。
   ========================================================================== */
.dock{
  position:fixed;left:50%;z-index:80;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:2px;
  padding:7px 9px;
  border-radius:999px;
  transform:translateX(-50%);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;         /* 允许页面滚动，只禁掉双击缩放 */
  isolation:isolate;
  /* 外阴影三层：近处实、远处虚，做出"悬着一片玻璃"的层次 */
  box-shadow:
    0 1px 2px rgba(18,20,26,.05),
    0 12px 28px -10px rgba(18,20,26,.28),
    0 34px 64px -30px rgba(18,20,26,.40);
}
/* 拎起玻璃球时：球加重投影，其余图标自动让位 */
.dock.balling .dock-ind{
  transition:none;                      /* 跟手阶段不要缓动 */
  box-shadow:
    0 8px 22px -8px rgba(18,20,26,.45),
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 2px rgba(255,255,255,.40);
}
.dock.balling .dock-item{opacity:.45;}
.dock.balling .dock-item.on{opacity:1;}

/* ---------- 玻璃本体：不做磨砂，靠折射出效果 ---------- */
.dock-glass{
  position:absolute;inset:0;border-radius:inherit;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(255,255,255,.13) 0%,
    rgba(255,255,255,.03) 42%,
    rgba(255,255,255,.09) 100%);                    /* 极淡的上下渐变，交代厚度 */
  -webkit-backdrop-filter:blur(9px) saturate(150%) brightness(1.04);
  backdrop-filter:blur(9px) saturate(150%) brightness(1.04);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.92),             /* 顶部 1px 高光 */
    inset 0 -1px 0 rgba(255,255,255,.26),
    inset 0 0 0 .5px rgba(255,255,255,.42);
}

/* 不支持折射的浏览器（Safari / Firefox）退回一层轻磨砂，否则文字会和图标糊在一起 */
.dock.no-lens .dock-glass{
  background:rgba(252,252,250,.30);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  backdrop-filter:blur(14px) saturate(180%);
}

/* ---------- 折射层：Chromium 才有肉眼可见的边缘透镜 ---------- */
.dock-lens{
  position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;
  backdrop-filter:url(#lgRefract);
  -webkit-backdrop-filter:url(#lgRefract);
}

/* ---------- 镜面高光：跟随指针，拖动时最明显 ---------- */
.dock-sheen{
  position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;
  background:
    radial-gradient(150px 72px at var(--sx,50%) var(--sy,-12%),
      rgba(255,255,255,.42), rgba(255,255,255,0) 72%),
    linear-gradient(152deg, rgba(255,255,255,.18), rgba(255,255,255,0) 44%, rgba(255,255,255,.07) 100%);
  opacity:.8;
}

/* ---------- 边缘渐变描边：中间薄、两头亮，像玻璃被光擦过 ---------- */
.dock-rim{
  position:absolute;inset:0;border-radius:inherit;z-index:3;pointer-events:none;
  padding:1px;
  background:linear-gradient(168deg,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.30) 38%,
    rgba(255,255,255,.14) 62%,
    rgba(255,255,255,.75) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
}

/* ---------- 选中项滑块 ---------- */
.dock-ind{
  position:absolute;top:7px;bottom:7px;left:0;width:0;z-index:4;
  border-radius:999px;
  background:rgba(226,240,237,.55);
  -webkit-backdrop-filter:blur(4px) saturate(160%);
  backdrop-filter:blur(4px) saturate(160%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 2px rgba(255,255,255,.35),
    inset 0 0 12px rgba(255,255,255,.35),
    0 1px 3px rgba(18,20,26,.06);
  transition:width .2s ease;
}

.dock-item{
  position:relative;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:74px;padding:8px 0 6px;
  border:0;background:transparent;border-radius:999px;
  color:var(--ink-3);
  touch-action:pan-y;                /* 竖向交给页面滚动，横向手势留给拖玻璃球 */
  -webkit-touch-callout:none;        /* iOS 长按不要弹菜单 */
  /* 玻璃变薄以后，图标和文字需要一层很淡的光晕才能和下面的正文分开 */
  filter:drop-shadow(0 0 2px rgba(255,255,255,.92)) drop-shadow(0 0 7px rgba(255,255,255,.5));
  transition:color .25s ease,transform .22s var(--ease-spring),opacity .2s ease;
}
.dock-item svg{
  width:20px;height:20px;
  stroke:currentColor;fill:none;
  stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .34s var(--ease-spring),stroke-width .25s ease;
}
.dock-item span{
  font-size:10.5px;letter-spacing:.02em;
  transition:font-weight .2s,opacity .2s;
}
.dock-item.on{color:var(--accent-ink);}
.dock-item.on svg{transform:scale(1.08);stroke-width:1.9;}
.dock-item.on span{font-weight:600;}
/* 按下的反馈必须在 pointerdown 时就出现 */
.dock-item.press{transform:scale(.93);}

/* ---------- 深色模式 ---------- */
[data-theme="dark"] .dock{
  box-shadow:
    0 1px 2px rgba(0,0,0,.45),
    0 14px 34px -12px rgba(0,0,0,.7),
    0 42px 74px -34px rgba(0,0,0,.9);
}
[data-theme="dark"] .dock.no-lens .dock-glass{
  background:rgba(24,26,31,.34);
  -webkit-backdrop-filter:blur(14px) saturate(170%);
  backdrop-filter:blur(14px) saturate(170%);
}
[data-theme="dark"] .dock-item{
  filter:drop-shadow(0 0 2px rgba(0,0,0,.9)) drop-shadow(0 0 7px rgba(0,0,0,.55));
}
[data-theme="dark"] .dock.balling .dock-ind{
  box-shadow:
    0 8px 24px -8px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.2);
}
[data-theme="dark"] .dock-glass{
  background:rgba(20,22,26,.16);
  -webkit-backdrop-filter:saturate(120%) brightness(1.10);
  backdrop-filter:saturate(120%) brightness(1.10);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -1px 0 rgba(255,255,255,.04),
    inset 0 0 0 .5px rgba(255,255,255,.07);
}
[data-theme="dark"] .dock-rim{
  background:linear-gradient(168deg,
    rgba(255,255,255,.34) 0%,
    rgba(255,255,255,.06) 40%,
    rgba(255,255,255,.03) 64%,
    rgba(255,255,255,.16) 100%);
}
[data-theme="dark"] .dock-sheen{
  background:
    radial-gradient(150px 72px at var(--sx,50%) var(--sy,-12%),
      rgba(255,255,255,.16), rgba(255,255,255,0) 72%),
    linear-gradient(152deg, rgba(255,255,255,.05), rgba(255,255,255,0) 46%, rgba(255,255,255,.02) 100%);
}
[data-theme="dark"] .dock-ind{
  background:rgba(94,200,186,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 3px rgba(0,0,0,.3);
}

/* 不支持 backdrop-filter 的老浏览器：退化成不透明面板 */
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .dock-glass{background:var(--surface);}
  [data-theme="dark"] .dock-glass{background:#202328;}
}

/* 系统开启"降低透明度"时，直接给实心面板 */
@media (prefers-reduced-transparency:reduce){
  .dock-glass{
    background:var(--surface);
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  .dock-lens{display:none;}
  .dock-sheen{opacity:.3;}
}

/* 触屏设备：SVG 折射滤镜每帧重算，手机上代价太高，直接关掉换成更厚的磨砂 */
@media (pointer:coarse),(max-width:820px){
  .dock-lens{display:none;}
  .dock-glass{
    background:rgba(252,252,250,.34);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    backdrop-filter:blur(18px) saturate(180%);
  }
  .dock-item,
  [data-theme="dark"] .dock-item{filter:none;}   /* 光环在厚磨砂上不需要，还省一次离屏合成 */
  [data-theme="dark"] .dock-glass{
    background:rgba(24,26,31,.42);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    backdrop-filter:blur(18px) saturate(160%);
  }
}

@media (max-width:380px){
  .dock-item{width:64px;}
}

/* ==========================================================================
   小屏适配
   ========================================================================== */
@media (max-width:640px){
  .wrap{padding-left:16px;padding-right:16px;}
  .art-title{font-size:25px;}
  .art-head{padding-top:24px;}
  .toolbar{top:58px;}
  .sent{padding-right:30px;}
  .sent .en{font-size:calc(var(--fs) - 1px);line-height:1.72;}
  .wb-word{flex:0 0 118px;}
  .wb-word i{font-size:15px;}
  .wb-date{display:none;}
  .pager{flex-direction:column;}
  .pager a.next{text-align:left;}
  .stat-cell b{font-size:22px;}
  .fig{padding:16px 14px 12px;border-radius:13px;}
  .fig-scroll > svg{min-width:520px;}
}
@media (max-width:400px){
  .wb-word{flex:0 0 92px;}
  .wb-cn{font-size:12.5px;}
}
</style>
</head>
<body>

<!-- 极淡的环境色，给玻璃提供"可以透出来的东西" -->
<div class="ambient" aria-hidden="true"></div>

<!-- ============================ 顶部栏 ============================ -->

  <div class="topbar-inner">
    <a class="brand" href="#" data-go="read">
      <span class="brand-mark">R</span>

    </a>

      <button class="icon-btn" id="btnTheme" title="切换深浅色" aria-label="切换深浅色">

      </button>
    </div>
  </div>
</header>

<!-- ============================ 主体视图 ============================ -->
<main class="wrap">
  <!-- 四个页面并排在同一条滑轨上，由底部玻璃球的位置实时驱动 -->
  <div class="stage" id="stage">

<!-- ============================ 底部液态玻璃导航 ============================ -->
<nav class="dock" id="dock" aria-label="主导航">
  <!-- 玻璃分四层叠出来：磨砂 → 折射 → 镜面 → 描边 -->
  <span class="dock-glass" aria-hidden="true"></span>
  <span class="dock-lens" id="dockLens" aria-hidden="true"></span>
  <span class="dock-sheen" id="dockSheen" aria-hidden="true"></span>
  <span class="dock-rim" aria-hidden="true"></span>
  <span class="dock-ind" id="dockInd" aria-hidden="true"></span>

  <button class="dock-item on" data-view="read" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M12 6.5C10.6 5.2 8.6 4.6 6 4.6H3.5v13H6c2.6 0 4.6.6 6 1.9 1.4-1.3 3.4-1.9 6-1.9h2.5v-13H18c-2.6 0-4.6.6-6 1.9Z"/><path d="M12 6.5v13"/></svg>

  <button class="dock-item" data-view="words">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.6"/><path d="M7.5 9.2h6.2M7.5 12.6h9M7.5 16h4.4"/></svg>

    <span>历史</span>

  <button class="dock-item" data-view="settings">
    <svg viewBox="0 0 24 24"><path d="M4 8.2h16M4 15.8h16"/><circle cx="9.2" cy="8.2" r="2.1"/><circle cx="14.8" cy="15.8" r="2.1"/></svg>
    <span>设置</span>

<!-- ============================ 查词弹窗 ============================ -->
<div class="tip" id="tip" role="dialog" aria-live="polite" hidden></div>

<script>
/* ============================================================================
   §5  数据区 —— 想换文章只改这里
   ----------------------------------------------------------------------------
   字段说明：
   id      唯一标识，建议用日期
   date    发布日 YYYY-MM-DD（历史归档、单词本按天筛选都用它）
   topic   领域标签，显示在标题上方
   title   英文标题
   subtitle 英文副标题（可留空）
   level   难度标注
   body    [{en, zh}] 逐句数组，en 里用 {{word}} 标记重点词
   words   { 重点词: {ipa, cn, ex, exZh} }
   quiz    [{q, options:[...], answer:索引, why:解析}]
   ========================================================================== */

const CONFIG = {
  wordsPerMinute: 52,   // 估算阅读时长的速度（含看中文翻译），觉得偏慢可改成 60
};

/* ----------------------------------------------------------------------------
   FIGURES —— 文章配图库
   ----------------------------------------------------------------------------
   正文里用 { fig: 'xxx' } 引用，会插到对应句子之间。
   所有颜色都走 CSS 变量（--fig-*），深浅色自动切换；
   viewBox 固定为 640 宽，容器宽度变化时等比缩放。
   ---------------------------------------------------------------------------- */
const FIGURES = {


  /* ⑤ 先进封装剖面 */
  package: {
    head: 'Figure 5',
    note: 'a cross section of one AI accelerator',
    svg: `<svg viewBox="0 0 640 260" role="img" aria-label="Cross section of an advanced package">

    { en: `Most mobile robots {{navigate}} by matching what the camera sees against a map built earlier.`,

    { en: `Engineers call this drift, and it is the central problem of visual navigation.`,
      zh: `工程师把这种现象叫漂移，它是视觉导航的核心难题。` },
    { en: `The standard fix is to {{fuse}} two sensors that fail in different ways.`,

/* ---------------------------------------------------------------------------
   2026-11-20 · 科技硬件 / 散热：真正的天花板是热，不是晶体管
   --------------------------------------------------------------------------- */
{
  id: '2026-11-20',
  date: '2026-11-20',
  topic: '科技硬件',
  title: 'Heat Is the Real Ceiling',
  subtitle: 'A chip does not fail because it is hot on average. It fails where it is hottest.',
  level: 'CET-6',
  body: [
    { en: `Every generation of chip is announced with a number for performance per watt.`,
      zh: `每一代芯片发布，都会给出一个每瓦性能的数字。` },
    { en: `The number is real, and it is also misleading.`,
      zh: `这个数字是真的，同时也是有误导性的。` },
    { en: `A chip does not fail because it is hot on average.`,
      zh: `芯片不是因为它平均下来很热而失效的。` },
    { en: `It fails because one square millimetre of it is hot.`,
      zh: `它失效，是因为其中某一平方毫米很热。` },
    { en: `As transistors shrink, the same power is squeezed into a smaller area, so the local heat {{flux}} rises even when total power falls.`,
      zh: `随着晶体管变小，同样的功率被挤进更小的面积里，所以即使总功耗下降，局部的热流密度反而上升。` },
    { en: `This is why a laptop can feel cool on the keyboard and still {{throttle}}.`,
      zh: `这就是为什么一台笔记本键盘摸起来凉，却仍然在降频。` },
    { en: `The heat is generated in a layer a few micrometres thick.`,
      zh: `热是在几微米厚的一层里产生的。` },
    { en: `To reach the air it must cross silicon, solder, a lid, a layer of paste and a heatsink.`,
      zh: `要到达空气，它必须穿过硅、焊料、顶盖、一层硅脂和散热器。` },
    { en: `Every {{interface}} along that path is a {{resistance}}.`,
      zh: `这条路径上的每一个界面都是一份热阻。` },
    { en: `The most expensive part is often the cheapest-looking one: the paste.`,
      zh: `代价最高的部分，往往是看起来最便宜的那个：硅脂。` },
    { en: `A layer thinner than a human hair can account for a tenth of the total resistance.`,
      zh: `比头发还薄的一层，可能占到总热阻的十分之一。` },
    { en: `Engineers have spent years on this problem, and the solutions are unglamorous.`,
      zh: `工程师在这个问题上花了很多年，而解法都不光鲜。` },
    { en: `A vapour {{chamber}} spreads heat sideways, so a small hot spot can feed a large fin stack.`,
      zh: `均热板把热横向铺开，让一个小热点去驱动一大片鳍片。` },
    { en: `Direct-die cooling removes the lid entirely, saving a millimetre and a great deal of trouble.`,
      zh: `直触晶片散热干脆去掉顶盖，省下一毫米，也省掉一大堆麻烦。` },
    { en: `Liquid cooling moves the heat somewhere it can be {{reject}}ed quietly.`,
      zh: `液冷把热搬到可以安静排掉的地方去。` },
    { en: `This is also why the thermal number on a specification sheet is close to meaningless.`,
      zh: `这也是为什么规格表上那个散热相关的数字几乎没有意义。` },
    { en: `A power limit is a promise about an average, and the silicon does not experience averages.`,
      zh: `功耗上限是对平均值的一个承诺，而硅片并不体验平均值。` },
    { en: `It experiences a hot spot a few hundred micrometres across, sitting under whichever block happens to be busiest.`,
      zh: `它体验的是几百微米宽的一个热点，位置就在当下最忙的那块电路底下。` },
    { en: `Designers therefore spread the work on purpose, delaying some operations so that no single unit runs continuously.`,
      zh: `所以设计者会刻意把工作摊开，故意推迟某些运算，让任何一块单元都不会持续满负荷。` },
    { en: `The result is a chip that is slower than its own peak and much faster than its own average.`,
      zh: `结果是一块比自己的峰值慢、但比自己的平均值快得多的芯片。` },
    { en: `Every laptop, phone and graphics card you have used was tuned this way, and none of them advertise it.`,
      zh: `你用过的每一台笔记本、手机和显卡都是这么调出来的，而它们没有一个会宣传这一点。` },
    { en: `None of these makes a chip faster in a benchmark that lasts ten seconds.`,
      zh: `这些都不会让芯片在十秒钟的跑分里更快。` },
    { en: `All of them make it faster in the twentieth minute.`,
      zh: `但它们全都让芯片在第二十分钟时更快。` },
    { en: `That gap is where most real products live.`,
      zh: `大多数真实产品就活在这个差距里。` },
    { en: `A phone that is fast for a minute and slow for an hour is a slow phone.`,
      zh: `一台快一分钟、慢一小时的手机，就是一台慢手机。` },
    { en: `This is why thermal design has moved from the end of the process to the beginning.`,
      zh: `这就是为什么热设计从流程的末端挪到了开头。` },
    { en: `The question is no longer how to cool this, but what can we build that is coolable.`,
      zh: `问题不再是「这个怎么散热」，而是「我们能造出什么可散热的东西」。` },
    { en: `It is a less exciting {{constraint}} than transistor {{density}}.`,
      zh: `比起晶体管密度，这是一个不那么激动人心的约束。` },
    { en: `It is also the one that decides what you can actually hold in your hand.`,
      zh: `但它也是那个决定你手里究竟能握住什么的约束。` },
    { en: `The {{ceiling}} is not made of silicon. It is made of air.`,
      zh: `天花板不是硅做的，是空气做的。` },
    { note: {
        en: 'Peak performance is a laboratory number. Sustained performance is a product.',
        zh: '峰值性能是实验室里的数字，持续性能才是产品。'
      } }
  ],
  words: {
    'flux': { ipa: '/flʌks/', cn: 'n. 通量；流动密度', ex: 'Local heat flux rises even when total power falls.', exZh: '即使总功耗下降，局部热流密度也会上升。' },
    'throttle': { ipa: '/ˈθrɒtl/', cn: 'v. 降频；限制性能以降低功耗', ex: 'The chip throttles within two minutes of full load.', exZh: '芯片满负载两分钟内就会降频。' },
    'interface': { ipa: '/ˈɪntəfeɪs/', cn: 'n. 界面；接触面', ex: 'Every interface between two materials adds thermal resistance.', exZh: '两种材料之间的每个接触面都会增加热阻。' },
    'resistance': { ipa: '/rɪˈzɪstəns/', cn: 'n. 阻力；热阻', ex: 'A thin paste layer can account for a tenth of the total resistance.', exZh: '薄薄一层硅脂可能占总热阻的十分之一。' },
    'chamber': { ipa: '/ˈtʃeɪmbə/', cn: 'n. 腔；室', ex: 'A vapour chamber spreads heat from a small hot spot to a wide area.', exZh: '均热板把热从小热点铺展到很大一片区域。' },
    'reject': { ipa: '/rɪˈdʒekt/', cn: 'v. 排出；散出（热量）', ex: 'The radiator rejects heat into the room air.', exZh: '散热器把热量排到室内空气中。' },
    'constraint': { ipa: '/kənˈstreɪnt/', cn: 'n. 约束；限制条件', ex: 'Cooling capacity is now a design constraint, not an afterthought.', exZh: '散热能力如今是一项设计约束，而不是事后才考虑的事。' },
    'density': { ipa: '/ˈdensəti/', cn: 'n. 密度', ex: 'Transistor density keeps rising, but power density rises faster.', exZh: '晶体管密度持续上升，但功率密度升得更快。' },
    'ceiling': { ipa: '/ˈsiːlɪŋ/', cn: 'n. 上限；天花板', ex: 'For thin laptops the ceiling is set by heat, not by the chip.', exZh: '对轻薄本来说，上限是由散热决定的，而不是芯片。' }
  },
  quiz: [
    { q: 'Why can a laptop feel cool on the keyboard and still throttle?',
      options: ['Because the keyboard is insulated from the chip.',
                'Because the heat is concentrated in a very small area, even if the average temperature is low.',
                'Because the fan is broken.'],
      answer: 1,
      why: '原文：芯片不是平均温度高才失效，而是某一平方毫米太热；局部热流密度随晶体管缩小反而上升。' },
    { q: 'Which part of the heat path is described as the most expensive but cheapest-looking?',

      answer: 1,
      why: '原文说代价最高的往往是看起来最便宜的硅脂，比头发还薄的一层可能占总热阻的十分之一。' },
    { q: 'What is the author’s main point about benchmarks?',

                'Benchmarks capture peak performance, while products are judged on sustained performance.',

/* ---------------------------------------------------------------------------
   2026-11-19 · 金融交易与市场 / 强平与流动性：为什么下跌会自己加速

{
  id: '2026-11-19',
  date: '2026-11-19',
  topic: '金融交易与市场',
  title: 'When Everyone Exits at Once',
  subtitle: 'A liquidation cascade is not panic. It is a rule being followed by everyone at the same time.',
  level: 'CET-6',
  body: [
    { en: `A leveraged position is a bet made with someone else's money.`,
      zh: `一笔杠杆头寸，是用别人的钱下的注。` },
    { en: `That is not a complaint; it is the definition.`,
      zh: `这不是抱怨，这就是它的定义。` },
    { en: `The exchange holds {{collateral}}, and when the collateral runs out, the position is closed by force.`,
      zh: `交易所持有保证金，而当保证金耗尽时，头寸会被强制平掉。` },
    { en: `This is called {{liquidation}}, and it is designed to be boring.`,
      zh: `这叫强制平仓，它被设计成一件无聊的事。` },
    { en: `It becomes interesting when thousands of positions are liquidated in the same second.`,
      zh: `当几千个头寸在同一秒被强平时，它就有意思了。` },
    { en: `A liquidation is a market order by nature.`,
      zh: `强平本质上是一张市价单。` },
    { en: `It has to execute, at whatever price is available.`,
      zh: `它必须成交，无论当时是什么价格。` },
    { en: `If the order book is thin, that order moves the price.`,
      zh: `如果盘口很薄，这张单子就会把价格推走。` },
    { fig: 'orderbook' },
    { en: `A lower price triggers more liquidations.`,
      zh: `更低的价格又触发更多强平。` },
    { en: `Those liquidations sell into an even thinner book.`,
      zh: `这些强平又砸进一个更薄的盘口。` },
    { en: `The result is a {{cascade}}, and it can move a market several percent in seconds.`,
      zh: `结果就是级联，它能在几秒内把市场推动好几个百分点。` },
    { en: `Nothing in this loop is {{rational}} in the sense of being chosen.`,
      zh: `这个循环里没有任何一环是「选择」出来的。` },
    { en: `Every participant is following a rule written down in advance.`,
      zh: `每个参与者都在执行一条事先写好的规则。` },
    { en: `That is exactly what makes it hard to prevent.`,
      zh: `而这也正是它难以防范的原因。` },
    { en: `Speed matters as much as size.`,
      zh: `速度与规模同样重要。` },
    { en: `A risk engine that takes one second to notice a breach will let the price travel a long way before it acts, and the loss lands on whoever is still holding the position.`,
      zh: `一个要一秒才发现爆仓的风险引擎，会让价格先跑很远才动手，而损失落在那些还拿着头寸的人头上。` },
    { en: `Modern engines check positions every few milliseconds, which is fast enough to be part of the problem as well as part of the solution.`,
      zh: `现代引擎每几毫秒检查一次仓位，这个速度既让它成为解药，也让它成为问题的一部分。` },
    { en: `There is a structural difference between spot and perpetual markets that makes this worse.`,
      zh: `现货市场与永续合约市场之间有一个结构性差异，让情况更糟。` },
    { en: `A spot position is bought with money that exists somewhere else; a perpetual position is often margined in the very asset being traded.`,
      zh: `现货头寸用的是存在于别处的钱，而永续头寸常常就用被交易的那个资产本身作保证金。` },
    { en: `When that asset falls, the collateral falls with it, and the loop tightens faster than any human can respond.`,
      zh: `当那个资产下跌时，保证金跟着下跌，这个循环收紧的速度超过任何人的反应速度。` },
    { en: `Exchanges have three tools.`,
      zh: `交易所有三件工具。` },
    { en: `The first is partial liquidation: close only as much as is needed to restore the {{margin}}.`,
      zh: `第一件是部分强平：只平掉恢复保证金所需的那一部分。` },
    { en: `The second is an {{insurance}} fund, which absorbs losses when a position cannot be closed at a positive price.`,
      zh: `第二件是保险基金，用来吸收那些无法以正价格平掉的损失。` },
    { en: `The third is auto-deleveraging, which closes profitable positions to balance the book.`,
      zh: `第三件是自动减仓，通过平掉盈利头寸来平衡账目。` },
    { en: `Each of these trades one risk for another.`,
      zh: `这三件工具各自都是拿一种风险换另一种风险。` },
    { en: `Partial liquidation protects the trader but slows the cleanup.`,
      zh: `部分强平保护了交易者，但拖慢了清算速度。` },
    { en: `The insurance fund protects the exchange, but it is {{finite}}.`,
      zh: `保险基金保护交易所，但它是有限的。` },
    { en: `Auto-deleveraging protects the system by punishing people who did nothing wrong.`,
      zh: `自动减仓保护系统的方式，是惩罚那些什么都没做错的人。` },
    { en: `There is no setting that removes all three risks at once.`,
      zh: `不存在能同时消除这三种风险的设置。` },
    { en: `This is why {{funding}} rates and open interest matter more than price charts.`,
      zh: `这就是为什么资金费率和持仓量比价格图更重要。` },
    { en: `They tell you how {{crowded}} a trade is, and crowding is what turns a fall into a cascade.`,
      zh: `它们告诉你一笔交易有多拥挤，而拥挤正是把下跌变成级联的东西。` },
    { en: `The market is not fragile because people are reckless.`,
      zh: `市场脆弱，不是因为人们鲁莽。` },
    { en: `It is fragile because everyone obeys the same rule at the same time.`,
      zh: `它脆弱，是因为所有人在同一时刻遵守同一条规则。` },
    { note: {
        en: 'A stop loss protects one trader and feeds the cascade that hurts all of them.',
        zh: '止损保护了一个交易者，却喂大了那个会伤到所有人的级联。'
      } }
  ],
  words: {
    'collateral': { ipa: '/kəˈlætərəl/', cn: 'n. 抵押品；保证金资产', ex: 'The position is closed when collateral falls below the maintenance level.', exZh: '当保证金低于维持水平时，头寸会被平掉。' },
    'liquidation': { ipa: '/ˌlɪkwɪˈdeɪʃn/', cn: 'n. 强制平仓；清算', ex: 'Liquidations are market orders, so they accept whatever price is offered.', exZh: '强平是市价单，因此只能接受市场上给出的任何价格。' },
    'cascade': { ipa: '/kæˈskeɪd/', cn: 'n. 级联；连锁反应', ex: 'A cascade can take a market down several percent in seconds.', exZh: '一次级联能在几秒内把市场打下去好几个百分点。' },
    'rational': { ipa: '/ˈræʃnəl/', cn: 'adj. 理性的；合乎理性的', ex: 'Nobody in the loop is irrational; they are all obeying rules.', exZh: '这个循环里没有人不理性，他们都在遵守规则。' },
    'margin': { ipa: '/ˈmɑːdʒɪn/', cn: 'n. 保证金；保证金比例', ex: 'Partial liquidation closes only enough to restore the required margin.', exZh: '部分强平只平掉足以恢复所需保证金的那一部分。' },
    'insurance': { ipa: '/ɪnˈʃʊərəns/', cn: 'n. 保险', ex: 'The insurance fund absorbs losses that the order book cannot.', exZh: '保险基金吸收了盘口消化不了的损失。' },
    'finite': { ipa: '/ˈfaɪnaɪt/', cn: 'adj. 有限的', ex: 'The fund is finite, which is why it cannot be the only defence.', exZh: '基金是有限的，所以它不能是唯一的防线。' },
    'funding': { ipa: '/ˈfʌndɪŋ/', cn: 'n. 资金费率；融资', ex: 'A high funding rate means longs are paying to stay in a crowded trade.', exZh: '高资金费率意味着多头在为一个拥挤的交易付费。' },

    { en: `The tools are {{generative}} models trained on hundreds of thousands of known structures.`,
      zh: `工具是在几十万个已知结构上训练出来的生成模型。` },
    { en: `They propose a {{backbone}}, then fill in the {{sequence}} that would fold into it.`,
      zh: `它们先给出一条骨架，再填上能够折叠成这个形状的氨基酸序列。` },
    { en: `The output is a {{candidate}}, not a product.`,
      zh: `输出的只是一个候选物，不是产品。` },
    { en: `Most candidates fail in the lab, because folding inside a computer is easier than folding in water.`,
      zh: `大多数候选物在实验室里失败，因为在电脑里折叠比在水里折叠容易得多。` },
    { en: `Success rates have improved enough to change the economics.`,
      zh: `成功率提升得足够多，已经改变了这门生意的经济账。` },
    { en: `A decade ago, a campaign might order a hundred designs and find nothing that binds.`,
      zh: `十年前，一轮设计可能订一百个样品，却找不到一个能结合的。` },
    { en: `Now a small team can order a few dozen and expect several to work.`,
      zh: `现在一个小团队订几十个，就能指望有好几个能用。` },
    { en: `What makes this powerful is that the target is a shape, not a sequence.`,
      zh: `它之所以强大，在于目标是形状，而不是序列。` },
    { en: `If you know the surface of a viral protein, you can design something that sticks to it.`,
      zh: `如果你知道某个病毒蛋白的表面，你就能设计出粘住它的东西。` },
    { en: `That is a different way of making a drug.`,
      zh: `这是造药的另一种方式。` },
    { en: `The same logic applies to {{enzyme}}s, which are proteins that {{catalyse}} reactions.`,
      zh: `同样的逻辑也适用于酶——催化反应的蛋白质。` },
    { en: `Design one that breaks a specific bond, and you have a chemical plant that runs at room temperature.`,
      zh: `设计出能切断特定化学键的酶，你就等于拥有了一座常温运行的化工厂。` },
    { en: `Binding is also not a yes or no property.`,
      zh: `结合也不是一个「是或否」的性质。` },
    { en: `A design that sticks weakly is often worse than one that does not stick at all, because it occupies the site and does nothing there.`,
      zh: `结合得很弱的设计往往比完全不结合更糟，因为它占住了位点却什么也没做。` },
    { en: `Measuring how tightly something binds takes a purified sample, a laboratory and several days.`,
      zh: `要测出一个东西结合得多紧，需要纯化的样品、一间实验室和好几天时间。` },
    { en: `That measurement is the real currency of the field, and no model can produce it.`,
      zh: `这种测量才是这个领域真正的硬通货，而没有任何模型能生产它。` },
    { en: `Proteins are also not rigid. They breathe, and a shape that looks perfect in a static structure may never actually form.`,
      zh: `蛋白质也不是刚性的。它们会呼吸，一个在静态结构里看起来完美的形状，可能根本不会形成。` },
    { en: `The best generative models are now trained to allow for that motion, which is one reason they beat earlier docking tools so decisively.`,
      zh: `目前最好的生成模型已经把这种运动纳入训练，这也是它们如此干脆地胜过早期分子对接工具的原因之一。` },
    { en: `The limits are real, and they are worth stating.`,
      zh: `边界是真实存在的，值得说清楚。` },
    { en: `A designed protein must be stable, {{specific}} and cheap to manufacture.`,
      zh: `设计出来的蛋白质必须稳定、专一，而且制造成本低。` },
    { en: `Stability is the hardest of the three, because a protein that {{unfold}}s at body temperature is useless.`,
      zh: `三者中最难的是稳定性：一个在体温下就散架的蛋白质毫无用处。` },
    { en: `Still, the direction is clear.`,
      zh: `但方向已经清楚了。` },
    { en: `Biology is becoming a design discipline with a compiler.`,
      zh: `生物学正在变成一门带编译器的设计学科。` },
    { en: `The compiler does not promise that the program will run.`,
      zh: `编译器并不保证程序一定跑得起来。` },
    { en: `It has moved the bottleneck from imagination to {{verification}}.`,
      zh: `它把瓶颈从想象力挪到了验证环节。` },
    { en: `That is progress, even when it looks like more work.`,
      zh: `这是进步，即使它看起来像是更多的工作。` },
    { note: {
        en: 'A compiler makes it cheap to propose. It makes it expensive to prove.',
        zh: '编译器让提出方案变得廉价，却让证明它变得昂贵。'
      } }
  ],
  words: {
    'exist': { ipa: '/ɪɡˈzɪst/', cn: 'v. 存在', ex: 'The goal is a protein that has never existed in nature.', exZh: '目标是造出一个自然界从未存在过的蛋白质。' },
    'generative': { ipa: '/ˈdʒenərətɪv/', cn: 'adj. 生成式的', ex: 'Generative models propose new backbones rather than editing old ones.', exZh: '生成模型提出新的骨架，而不是修改旧的。' },
    'backbone': { ipa: '/ˈbækbəʊn/', cn: 'n. 骨架；主链', ex: 'The model first draws a backbone, then chooses a sequence that folds into it.', exZh: '模型先画出一条骨架，再选出能折叠成它的序列。' },
    'sequence': { ipa: '/ˈsiːkwəns/', cn: 'n. 序列（氨基酸排列顺序）', ex: 'A single wrong residue in the sequence can stop the protein folding.', exZh: '序列里错一个残基，就可能让蛋白质无法折叠。' },
    'candidate': { ipa: '/ˈkændɪdət/', cn: 'n. 候选物；候选者', ex: 'Most candidates fail before they reach an animal study.', exZh: '大多数候选物在进入动物实验之前就失败了。' },
    'enzyme': { ipa: '/ˈenzaɪm/', cn: 'n. 酶', ex: 'A designed enzyme can catalyse a reaction at room temperature.', exZh: '设计出来的酶能在室温下催化反应。' },
    'catalyse': { ipa: '/ˈkætəlaɪz/', cn: 'v. 催化', ex: 'Enzymes catalyse reactions that would otherwise need extreme conditions.', exZh: '酶催化那些否则需要极端条件的反应。' },
    'specific': { ipa: '/spəˈsɪfɪk/', cn: 'adj. 专一的；特异的', ex: 'A drug must be specific enough to hit one target and nothing else.', exZh: '药物必须足够专一，只命中一个靶点而不碰其他。' },
    'unfold': { ipa: '/ʌnˈfəʊld/', cn: 'v. 解折叠；散架', ex: 'A protein that unfolds at body temperature is useless as a drug.', exZh: '在体温下就散架的蛋白质不能当药。' },
    'verification': { ipa: '/ˌverɪfɪˈkeɪʃn/', cn: 'n. 验证；核实', ex: 'The bottleneck has moved from design to experimental verification.', exZh: '瓶颈已经从设计转移到了实验验证。' }
  },
  quiz: [
    { q: 'What is the key difference between editing and de novo design?',
      options: ['De novo design does not use computers.',
                'Editing starts from a protein that already exists; de novo design starts from nothing.',
                'De novo design cannot produce enzymes.'],
      answer: 1,
      why: '文章开头就点明：改造只能从自然界已有的东西出发，从头设计从零开始。' },
    { q: 'What does the author mean by “a compiler for biology”?',
      options: ['A program that writes lab reports.',
                'A tool that turns a target shape into a candidate sequence, cheaply proposing but not proving.',
                'A machine that synthesises proteins automatically.'],
      answer: 1,
      why: '编译器让提出方案变便宜，但不保证程序能跑——瓶颈因此从想象转移到验证。' },
    { q: 'Which of the three requirements is described as hardest?',
      options: ['Specificity.', 'Stability — a protein that unfolds at body temperature is useless.', 'Manufacturing cost.'],
      answer: 1,
      why: '原文明确：三者中最难的是稳定性。' }
  ]
},

/* ---------------------------------------------------------------------------
   2026-11-17 · 前沿科研 / 可控核聚变：等离子体已经不是瓶颈
   --------------------------------------------------------------------------- */
{
  id: '2026-11-17',
  date: '2026-11-17',
  topic: '前沿科研',
  title: 'Fusion’s Problem Is Not the Plasma',
  subtitle: 'The reaction works. The wall it burns through is the hard part.',
  level: 'CET-6',
  body: [
    { en: `Fusion is usually described as the energy source that is always thirty years away.`,
      zh: `核聚变通常被形容为那个永远还差三十年的能源。` },
    { en: `The joke is old, and it hides a misunderstanding.`,
      zh: `这个玩笑很老了，而它掩盖了一个误解。` },
    { en: `The {{plasma}} physics is no longer the hard part.`,
      zh: `等离子体物理已经不是最难的部分了。` },
    { en: `Machines have produced fusion reactions for decades.`,
      zh: `装置产生聚变反应已经有几十年了。` },
    { en: `The recent record holders have shown net energy gain from the plasma itself.`,
      zh: `近期的纪录保持者已经证明，等离子体本身可以实现净能量增益。` },
    { en: `What has not been solved is everything around the plasma.`,
      zh: `没有解决的，是等离子体周围的一切。` },
    { en: `A fusion reactor is a neutron factory.`,
      zh: `聚变反应堆是一座中子工厂。` },
    { en: `Each reaction releases a {{neutron}} carrying fourteen megaelectronvolts, and that neutron has to go somewhere.`,
      zh: `每次反应都会放出一个携带十四兆电子伏能量的中子，而它总得去某个地方。` },
    { en: `It goes into the wall.`,
      zh: `它进入壁面。` },
    { en: `Over a year, the wall receives a dose of {{irradiation}} that would destroy most metals.`,
      zh: `一年下来，壁面承受的辐照剂量足以毁掉大多数金属。` },
    { en: `Atoms are knocked out of their lattice sites, the material {{swell}}s, and it becomes {{brittle}}.`,
      zh: `原子被从晶格位置上撞出来，材料膨胀，并变得易碎。` },
    { en: `Choosing a wall material is therefore a materials problem, not a physics one.`,
      zh: `因此选择壁面材料是一个材料问题，不是物理问题。` },
    { en: `The second problem is tritium.`,
      zh: `第二个问题是氚。` },
    { en: `A reactor burns tritium, and tritium is scarce.`,
      zh: `反应堆要烧氚，而氚很稀少。` },
    { en: `It has to be {{breed}} inside the reactor, from lithium, using those same neutrons.`,
      zh: `它必须在反应堆内部由锂增殖，而所用的正是那些中子。` },
    { en: `That loop has never run at scale.`,
      zh: `这个循环从未在规模化条件下运行过。` },
    { en: `The third problem is heat.`,
      zh: `第三个问题是热。` },
    { en: `The {{exhaust}} carries an enormous power per square metre, and no ordinary component survives it for long.`,
      zh: `排热通道承载着每平方米极高的功率，没有哪种常规部件能长期承受。` },
    { en: `There is a fourth problem that receives less attention: the fuel itself.`,
      zh: `还有第四个问题受到较少关注：燃料本身。` },
    { en: `The easiest reaction to ignite uses deuterium and tritium, and tritium is radioactive with a half-life of about twelve years, so it cannot simply be stockpiled.`,
      zh: `最容易点燃的反应使用氘和氚，而氚具有约十二年的半衰期，因此无法简单囤积。` },
    { en: `Every kilogram has to be manufactured, and the only practical factory is another reactor.`,
      zh: `每一公斤都得造出来，而唯一现实的工厂就是另一座反应堆。` },
    { en: `This is why a first generation of power plants would have to breed its own fuel from day one; there is no version of this where you buy it at the market.`,
      zh: `这就是为什么第一代电厂从第一天起就必须自己增殖燃料；不存在「去市场上买」这种版本。` },
    { en: `Then there is maintenance.`,
      zh: `然后是维护。` },
    { en: `A machine whose structure becomes radioactive cannot be opened by hand, so repairs must be done by robots inside a shielded vessel.`,
      zh: `一台结构本身会被活化的机器无法靠人打开，所以维修必须由机器人在屏蔽容器内完成。` },
    { en: `Designing for maintenance is a discipline that spacecraft engineers know well and plasma physicists do not.`,
      zh: `面向维护的设计是航天工程师熟悉、而等离子体物理学家不熟悉的一门手艺。` },
    { en: `Together these explain the joke at the beginning.`,
      zh: `这些合起来解释了开头那个玩笑。` },
    { en: `The thirty years is not a measure of how far away the plasma is; it is a measure of how long an industry needs to learn to build something that survives its own product.`,
      zh: `那三十年衡量的不是等离子体有多远，而是一个产业要学会造出「能扛住自己产物」的东西需要多久。` },
    { en: `Each of these is an engineering problem with a materials answer.`,
      zh: `这些全都是工程问题，而答案都要在材料里找。` },
    { en: `That is why fusion timelines depend on {{metallurgy}} more than on magnets.`,
      zh: `这就是为什么聚变的时间表更依赖冶金，而不是磁体。` },
    { en: `It is also why the field now hires mechanical engineers and ceramicists, not only physicists.`,
      zh: `这也是为什么这个领域现在招机械工程师和陶瓷专家，而不只是物理学家。` },
    { en: `The plasma is the part we understand.`,
      zh: `等离子体是我们已经理解的那部分。` },
    { en: `The wall is the part we still have to build.`,
      zh: `壁面是我们还得造出来的那部分。` },
    { note: {
        en: 'A fusion plant is not a physics experiment that happens to be large. It is a materials plant that happens to involve plasma.',
        zh: '聚变电厂不是一台恰好很大的物理实验，它是一座恰好涉及等离子体的材料工厂。'
      } }
  ],
  words: {
    'plasma': { ipa: '/ˈplæzmə/', cn: 'n. 等离子体', ex: 'The plasma must be hotter than the core of the sun.', exZh: '等离子体必须比太阳核心还热。' },
    'neutron': { ipa: '/ˈnjuːtrɒn/', cn: 'n. 中子', ex: 'Each fusion reaction releases a fast neutron into the wall.', exZh: '每次聚变反应都会向壁面释放一个快中子。' },
    'irradiation': { ipa: '/ɪˌreɪdiˈeɪʃn/', cn: 'n. 辐照；辐射照射', ex: 'Long-term irradiation makes most steels brittle.', exZh: '长期辐照会让大多数钢材变脆。' },
    'swell': { ipa: '/swel/', cn: 'v. 膨胀；肿胀', ex: 'The material swells as helium bubbles form inside it.', exZh: '随着内部形成氦气泡，材料会膨胀。' },
    'brittle': { ipa: '/ˈbrɪtl/', cn: 'adj. 脆的；易碎的', ex: 'A brittle wall cannot be trusted under thermal stress.', exZh: '在热应力下，脆化的壁面不可信赖。' },
    'breed': { ipa: '/briːd/', cn: 'v. 增殖（核燃料）；繁殖', ex: 'The blanket must breed more tritium than the reactor burns.', exZh: '包层必须增殖出比反应堆消耗更多的氚。' },
    'exhaust': { ipa: '/ɪɡˈzɔːst/', cn: 'n. 排气；排出流', ex: 'The exhaust carries more power per square metre than a rocket nozzle.', exZh: '排出流每平方米承载的功率超过火箭喷管。' },
    'metallurgy': { ipa: '/məˈtælədʒi/', cn: 'n. 冶金；冶金学', ex: 'Fusion progress depends on metallurgy as much as on plasma control.', exZh: '聚变进展对冶金和等离子体控制的依赖一样大。' }
  },
  quiz: [
    { q: 'What has become the hard part of fusion, according to the passage?',
      options: ['Keeping the plasma hot enough.',
                'The materials around the plasma — the wall, the tritium breeding, the heat exhaust.',
                'Finding enough fuel in nature.'],
      answer: 1,
      why: '原文反复强调：等离子体物理已不是难点，没解决的是它周围的一切。' },
    { q: 'Why must tritium be bred inside the reactor?',
      options: ['Because it is radioactive and cannot be transported.',
                'Because it is scarce and must be produced from lithium using the fusion neutrons themselves.',
                'Because it does not occur on Earth at all.'],
      answer: 1,
      why: '氚稀少，必须在堆内由锂增殖，用的正是聚变产生的中子。' },
    { q: 'What does the author mean by “a materials plant that happens to involve plasma”?',
      options: ['Fusion plants will mainly produce materials.',
                'The engineering difficulty lies in materials that survive neutrons and heat, not in the plasma itself.',
                'Plasma is unimportant to fusion.'],
      answer: 1,
      why: '结尾的比喻强调难点在材料：抗辐照的壁面、增殖氚的包层、承受高热负荷的部件。' }
  ]
},

/* ---------------------------------------------------------------------------
   2026-11-16 · 科技硬件 / 硅光与共封装光学：数据从电变成光的地方
   --------------------------------------------------------------------------- */
{
  id: '2026-11-16',
  date: '2026-11-16',
  topic: '科技硬件',
  title: 'Moving Data with Light',
  subtitle: 'The hard part of silicon photonics is not making light. It is making light that survives.',
  level: 'CET-6',
  body: [
    { en: `Inside a computer, data moves as electricity.`,
      zh: `在计算机内部，数据以电的形式流动。` },
    { en: `That has been true since the first electronic computer, and it is still mostly true.`,
      zh: `从第一台电子计算机起就是如此，而且大体上至今仍然如此。` },
    { en: `It stops being true at a certain distance.`,
      zh: `但到了某个距离，它就不再成立。` },
    { en: `Copper is excellent over a few centimetres, acceptable over a metre, and hopeless over a kilometre.`,
      zh: `铜在几厘米内表现优异，一米内尚可接受，一公里外完全没戏。` },
    { en: `The reason is not resistance. It is frequency.`,
      zh: `原因不是电阻，而是频率。` },
    { en: `A signal that switches billions of times a second loses energy into the cable and arrives blurred.`,
      zh: `每秒翻转几十亿次的信号会把能量漏进线缆里，到达时已经糊了。` },
    { en: `The industry's answer for long distances has always been glass.`,
      zh: `业界对长距离的答案一直是玻璃。` },
    { en: `{{fibre}} already carries almost all intercontinental traffic.`,
      zh: `几乎所有洲际流量都由光纤承载。` },
    { en: `What is new is how short the distances have become.`,
      zh: `新鲜之处在于，这个距离已经变得非常短。` },
    { en: `Optical links are now used between racks, then between boards, and soon inside a package.`,
      zh: `光互连如今用在机柜之间，然后用在板与板之间，很快要进到封装内部。` },
    { en: `The last step is called co-packaged optics: the {{transceiver}} moves next to the chip.`,
      zh: `最后一步叫共封装光学：把光模块搬到芯片旁边。` },
    { en: `The gain is not raw speed. It is energy per bit.`,
      zh: `收益不在于绝对速度，而在于每比特能耗。` },
    { en: `Driving a signal out of a chip through copper costs power that grows with distance.`,
      zh: `用铜把信号送出芯片，代价随距离增长。` },
    { en: `Light does not have that problem, but {{convert}}ing between electrons and photons does.`,
      zh: `光没有这个问题，但在电子与光子之间转换有。` },
    { en: `That conversion is where most of the cost sits.`,
      zh: `成本大部分就压在这次转换上。` },
    { en: `The real engineering difficulty is reliability.`,
      zh: `真正的工程难点是可靠性。` },
    { en: `A data centre holds hundreds of thousands of lasers, and a laser is a component that ages.`,
      zh: `一个数据中心里有几十万个激光器，而激光器是会老化的器件。` },
    { en: `Telecom parts are qualified over twenty years; a switch is expected to run for three without being serviced.`,
      zh: `电信器件要按二十年寿命认证，而交换机被期望三年无需维修地运行。` },
    { en: `So the hard part is not making light. It is making light that {{survive}}s.`,
      zh: `所以难的不是造出光，而是造出能活下来的光。` },
    { en: `There is also a manufacturing problem: {{align}}ing a fibre to a chip within a fraction of a micron, at {{volume}}.`,
      zh: `还有制造上的难题：在量产条件下，把光纤与芯片对准到亚微米级别。` },
    { en: `There is a reason silicon photonics took so long, and it is a materials reason.`,
      zh: `硅光所以走了这么久，原因在材料。` },
    { en: `Silicon is a poor light emitter. Its band gap is indirect, so it turns electricity into light very inefficiently, and no amount of clever design fixes that.`,
      zh: `硅是一种很差的光源。它的带隙是间接的，把电变成光的效率极低，再怎么巧妙设计也改不了。` },
    { en: `Every practical system therefore uses a different material for the laser, usually a compound of indium and phosphorus, and attaches it to the silicon afterwards.`,
      zh: `所以所有实用系统都用另一种材料做激光器，通常是铟磷化合物，之后再把它贴到硅上。` },
    { en: `That attachment is the fragile part, both mechanically and commercially.`,
      zh: `这个贴合环节既在机械上脆弱，在商业上也脆弱。` },
    { en: `A laser that must sit within a fraction of a micron of a waveguide is a laser that a delivery truck can ruin.`,
      zh: `一个必须精确坐在波导亚微米范围内的激光器，是一辆货车就能毁掉的东西。` },
    { en: `None of this is {{exotic}} physics.`,
      zh: `这些都不是什么奇特的物理。` },

/* ---------------------------------------------------------------------------
   2026-11-15 · AI 大模型 / 评测污染：模型可能早就见过考题
   --------------------------------------------------------------------------- */
{
  id: '2026-11-15',
  date: '2026-11-15',
  topic: 'AI 大模型',
  title: 'The Test the Model Has Already Seen',
  subtitle: 'A contaminated score measures memory, not ability.',
  level: 'CET-6',
  body: [
    { en: `A test is supposed to answer one question: how good is this model?`,
      zh: `一场测试本该只回答一个问题：这个模型有多好。` },
    { en: `That question is harder than it looks.`,
      zh: `这个问题比看起来难。` },
    { en: `Most tests are published, and published text ends up on the internet.`,
      zh: `大多数测试题是公开的，而公开的文本最终都会出现在互联网上。` },
    { en: `Models are trained on the internet.`,
      zh: `模型又是在互联网上训练的。` },
    { en: `So there is a real chance that the questions were in the training data.`,
      zh: `所以这些题目很可能就在训练数据里。` },
    { en: `This is called {{contamination}}, and it is not a {{technicality}}.`,
      zh: `这被称为评测污染，而它不是什么细枝末节。` },
    { en: `A contaminated score measures memory, not ability.`,
      zh: `被污染的分数衡量的是记忆，而不是能力。` },
    { en: `The effect is easy to demonstrate.`,
      zh: `这个效应很容易演示。` },
    { en: `Take a question, change one number, and watch the accuracy {{collapse}}.`,
      zh: `拿一道题，改掉其中一个数字，然后看着准确率崩塌。` },
    { en: `The model did not learn the method. It learned the answer.`,
      zh: `模型没有学会方法，它记住的是答案。` },
    { en: `Worse, contamination is hard to detect from the outside.`,
      zh: `更糟的是，从外部很难判断有没有污染。` },
    { en: `A {{suspicious}}ly high score proves nothing, because some models really are that good.`,
      zh: `一个高得可疑的分数什么也证明不了，因为有些模型确实有那么好。` },
    { en: `It is also more common than most people assume.`,
      zh: `它也比大多数人以为的更普遍。` },
    { en: `A benchmark is published as a paper, and papers are indexed, quoted and scraped within days.`,
      zh: `基准测试以论文形式发表，而论文在几天之内就会被索引、引用和抓取。` },
    { en: `A model released two years after a benchmark has almost certainly seen it, whether or not anyone intended that.`,
      zh: `在一个基准发布两年之后才出现的模型，几乎肯定见过它，不管有没有人想这样。` },
    { en: `Intention does not matter here. A data pipeline does not distinguish between a textbook and an answer key.`,
      zh: `在这里意图并不重要，数据流水线分不清教科书和标准答案。` },
    { en: `Some contamination is caught only by accident, when a model gives an explanation that is oddly specific about a detail nobody asked for.`,
      zh: `有些污染只能靠意外发现：模型给出的解释对某个没人问过的细节异常具体。` },
    { en: `Most could be caught by asking the same question with the numbers rearranged, a cheap test that more labs should run before publishing.`,
      zh: `大多数污染其实可以用「把数字换掉再问一遍」来发现，这是个便宜的做法，应该有更多实验室在发表前跑一次。` },
    { en: `The uncomfortable conclusion is that most published comparisons are slightly optimistic, and the field quietly knows it.`,
      zh: `令人不舒服的结论是：大多数公开对比都略偏乐观，而这个领域心知肚明。` },
    { en: `None of this is an argument for abandoning benchmarks.`,
      zh: `这一切都不是主张放弃基准测试。` },
    { en: `A rough measurement that everyone understands is more useful than a precise one that nobody can audit.`,
      zh: `一个人人都懂的粗略测量，比一个没人能核查的精确测量更有用。` },
    { en: `That does not make them worthless. It makes them a rough guide rather than a measurement.`,
      zh: `这不等于它们没有价值，只是它们更像粗略的参考，而不是一次测量。` },
    { en: `Researchers now use several {{defence}}s.`,
      zh: `研究者如今用几种防线。` },
    { en: `One is a private test set that has never been published.`,
      zh: `一种是完全没公开过的私有测试集。` },
    { en: `Another is to write new questions after the model finished training.`,
      zh: `另一种是在模型训练完成之后再出题。` },
    { en: `A third is to check whether the model can {{reproduce}} the exact wording of a published solution.`,
      zh: `第三种是检查模型能否一字不差地复述公开解答的原文。` },
    { en: `Each defence costs something.`,
      zh: `每一种防线都有代价。` },
    { en: `Private sets are expensive to build and quickly go {{stale}}.`,
      zh: `私有测试集构建昂贵，而且很快就会过时。` },
    { en: `New questions are hard to make {{comparable}} to the old ones.`,
      zh: `新题很难与旧题保持可比性。` },
    { en: `So the field lives with an uncomfortable compromise.`,
      zh: `于是这个领域只能接受一个不舒服的折中。` },
    { en: `The numbers on a {{leaderboard}} are not exactly wrong.`,
      zh: `排行榜上的数字并不算错。` },
    { en: `They are measuring something slightly different from what the reader assumes.`,
      zh: `它们衡量的东西，和读者以为的略有出入。` },
    { en: `That is worth remembering the next time a model claims a record.`,
      zh: `下次某个模型宣称破纪录时，这一点值得记着。` },
    { en: `Ask what the test was, when it was written, and whether anyone checked.`,
      zh: `问一句：考题是什么，什么时候出的，有没有人核对过。` },
    { note: {
        en: 'A student who has seen the exam paper is not a better student. A model is no different.',
        zh: '看过试卷的学生不是更好的学生，模型也一样。'
      } }
  ],
  words: {
    'contamination': { ipa: '/kənˌtæmɪˈneɪʃn/', cn: 'n. 污染；掺入（评测中指标注数据混入训练集）', ex: 'Contamination turns an ability test into a memory test.', exZh: '污染把能力测试变成了记忆测试。' },
    'technicality': { ipa: '/ˌteknɪˈkæləti/', cn: 'n. 细枝末节；技术性细节', ex: 'This is not a technicality; it changes the meaning of the score.', exZh: '这不是细节问题，它改变了分数的含义。' },
    'collapse': { ipa: '/kəˈlæps/', cn: 'v. 崩塌；骤降', ex: 'Change one number and the accuracy collapses.', exZh: '改掉一个数字，准确率就崩塌了。' },
    'suspicious': { ipa: '/səˈspɪʃəs/', cn: 'adj. 可疑的；令人怀疑的', ex: 'A suspiciously high score proves nothing on its own.', exZh: '高得可疑的分数本身什么也证明不了。' },
    'defence': { ipa: '/dɪˈfens/', cn: 'n. 防御；防线', ex: 'Each defence against contamination costs money or comparability.', exZh: '每一种防污染的手段都要付出金钱或可比性的代价。' },
    'reproduce': { ipa: '/ˌriːprəˈdjuːs/', cn: 'v. 复现；重现', ex: 'If the model reproduces the exact wording, it has probably seen the answer.', exZh: '如果模型能一字不差地复现原文，它多半见过答案。' },
    'stale': { ipa: '/steɪl/', cn: 'adj. 陈旧的；过时的', ex: 'A private test set goes stale once the questions leak.', exZh: '一旦题目泄露，私有测试集就作废了。' },
    'comparable': { ipa: '/ˈkɒmpərəbl/', cn: 'adj. 可比的；可比较的', ex: 'New questions are rarely comparable to the ones they replace.', exZh: '新题很少能与它替换掉的旧题相比。' },
    'leaderboard': { ipa: '/ˈliːdəbɔːd/', cn: 'n. 排行榜', ex: 'The leaderboard measures something slightly different from ability.', exZh: '排行榜衡量的东西与能力略有不同。' }
  },
  quiz: [
    { q: 'What does a contaminated score actually measure?',
      options: ['The model’s reasoning ability.', 'The model’s memory of the test data.', 'The model’s speed.'],
      answer: 1,
      why: '题目若在训练数据里，模型靠的是记住答案，而不是推理能力。' },
    { q: 'Why is a suspiciously high score not proof of contamination?',
      options: ['Because scores are always rounded.',
                'Because some models genuinely are that good, and contamination cannot be seen from outside.',
                'Because the test was written by competitors.'],
      answer: 1,
      why: '原文：高分不能证明污染，因为确实有模型真有那么好；污染从外部难以判断。' },
    { q: 'What is the cost of using a private test set?',
      options: ['It is cheap but inaccurate.',
                'It is expensive to build and goes stale quickly.',
                'It cannot be scored automatically.'],
      answer: 1,
      why: '私有集构建昂贵，而且一旦泄露/过时就失效。' }
  ]
},

/* ---------------------------------------------------------------------------
   2026-11-14 · 机器人自动化 / 遥操作数据：机器人是被人的手教出来的
   --------------------------------------------------------------------------- */
{
  id: '2026-11-14',
  date: '2026-11-14',
  topic: '机器人自动化',
  title: 'Trained by Human Hands',
  subtitle: 'There is no library of a million successful grasps. So companies build one.',
  level: 'CET-6',
  body: [
    { en: `Every impressive robot demonstration has a hidden cost.`,
      zh: `每一段令人惊叹的机器人演示，都有一个隐藏的成本。` },
    { en: `Someone had to show the robot what to do.`,
      zh: `得有人先示范给机器人看。` },
    { en: `Not once, but thousands of times, in slightly different positions, with slightly different objects.`,
      zh: `不是一次，而是几千次，位置略有不同，物体也略有不同。` },
    { en: `This is the least discussed part of modern robotics, and it is where most of the money goes.`,
      zh: `这是现代机器人学里被讨论得最少的部分，也是钱花得最多的地方。` },
    { en: `Learning-based control needs data, and robot data does not exist on the internet.`,
      zh: `基于学习的控制需要数据，而机器人的数据在互联网上并不存在。` },
    { en: `There is no library of a million successful grasps.`,
      zh: `没有哪座图书馆收藏着一百万次成功的抓取。` },
    { en: `So companies build one, by hand.`,
      zh: `所以公司只能手工建一个。` },
    { en: `A worker wears a controller or a motion-{{capture}} rig and performs the task.`,
      zh: `工人戴着控制器或动作捕捉设备，把任务做一遍。` },
    { en: `The robot records what the human did and gradually learns to do it alone.`,
      zh: `机器人记录下人的动作，逐渐学会自己做。` },
    { en: `This is called {{teleoperation}}, and it is slow, expensive and effective.`,
      zh: `这叫遥操作，它慢、贵，但有效。` },
    { en: `One useful trick is to make the {{demonstration}} {{imperfect}} on purpose.`,
      zh: `一个有用的技巧是故意让示范不那么完美。` },
    { en: `A policy trained only on perfect demos fails the moment the object is {{rotate}}d.`,
      zh: `只用完美示范训练出来的策略，物体一转动就会失败。` },
    { en: `Randomising the starting conditions forces the model to learn the part that actually matters.`,
      zh: `随机化初始条件，能逼着模型去学真正重要的那部分。` },
    { fig: 'simreal' },
    { en: `The cost is easy to underestimate.`,
      zh: `成本很容易被低估。` },
    { en: `One hour of usable demonstration data may take several hours of a trained worker's time, plus the rig, the objects and the labelling.`,
      zh: `一小时可用的示范数据，可能要花掉一名熟练工人好几个小时，再加上设备、物体和标注。` },
    { en: `At that rate, ten thousand hours is a small factory rather than a dataset.`,
      zh: `按这个比例算，一万小时已经不是数据集，而是一座小工厂。` },
    { en: `There is a second gap that more data alone will not close.`,
      zh: `还有第二个缺口，光靠增加数据补不上。` },
    { en: `A human hand and a robot gripper are not the same instrument, so a policy that copies the motion exactly is wrong from the first millimetre.`,
      zh: `人手和机器夹爪不是同一种工具，所以一个照抄动作的策略，从第一毫米起就是错的。` },
    { en: `The useful signal is therefore the intent, not the trajectory: where the object should end up, and how firmly it should be held.`,
      zh: `因此有用的信号是意图，而不是轨迹：物体最终该在哪里，以及该被夹多紧。` },
    { en: `Extracting intent from a demonstration is an open research problem, and it explains why the same data produces a good policy in one lab and a useless one in another.`,
      zh: `从示范中提取意图是一个尚未解决的问题，这也解释了为什么同样的数据在一个实验室能训出好策略，在另一个实验室却没用。` },
    { en: `Simulation helps, and it has the same weakness as always.`,
      zh: `仿真有帮助，但它有着一贯的弱点。` },
    { en: `A policy that works in a simulator has learned the simulator along with the task.`,
      zh: `在仿真里能跑通的策略，连同任务一起把仿真器也学进去了。` },
    { en: `The gap between the two worlds is small in a lab and large in a kitchen.`,
      zh: `两个世界之间的差距，在实验室里很小，在厨房里很大。` },
    { en: `So the loop closes in the real world: demonstrate, fail, record the failure, demonstrate again.`,
      zh: `于是闭环只能在真实世界里合上：示范、失败、记录失败、再示范。` },
    { en: `The {{flywheel}} is the product.`,
      zh: `这个飞轮本身就是产品。` },
    { en: `A company with ten thousand hours of real manipulation data owns something that cannot be copied quickly.`,
      zh: `一家手上有上万小时真实操作数据的公司，拥有别人无法快速复制的东西。` },
    { en: `That is a different kind of {{moat}} from a better algorithm.`,
      zh: `这是一种与「算法更好」不同性质的护城河。` },
    { en: `It is also why robotics progress looks slow and then sudden.`,
      zh: `这也是为什么机器人的进步看上去很慢，然后忽然很快。` },
    { en: `The data accumulates quietly, and one day the demos stop needing a human.`,
      zh: `数据在安静地累积，直到某一天，示范不再需要人。` },
    { en: `Until then, the human is the training set.`,
      zh: `在那之前，人就是训练集。` },
    { note: {
        en: 'A robot that learns from humans is not replacing them. It is hiring them, one demonstration at a time.',
        zh: '向人学习的机器人并不是在取代人，它是在一次次示范中雇佣人。'
      } }
  ],
  words: {
    'capture': { ipa: '/ˈkæptʃə/', cn: 'v. 捕捉；采集（动作捕捉 motion capture）', ex: 'A motion-capture rig records the worker’s hand position.', exZh: '动作捕捉设备记录下工人的手部位置。' },
    'teleoperation': { ipa: '/ˌteliˌɒpəˈreɪʃn/', cn: 'n. 遥操作；远程操作', ex: 'Teleoperation is slow, but it produces data no simulator can.', exZh: '遥操作很慢，但它产生的数据是仿真器给不了的。' },
    'demonstration': { ipa: '/ˌdemənˈstreɪʃn/', cn: 'n. 示范；演示', ex: 'Each demonstration is a labelled example of the task.', exZh: '每一次示范都是这项任务的一个带标注样本。' },
    'imperfect': { ipa: '/ɪmˈpɜːfɪkt/', cn: 'adj. 不完美的', ex: 'Slightly imperfect demonstrations make the policy more robust.', exZh: '略有瑕疵的示范会让策略更鲁棒。' },
    'rotate': { ipa: '/rəʊˈteɪt/', cn: 'v. 旋转；转动', ex: 'Rotate the object thirty degrees and a narrow policy fails.', exZh: '把物体转三十度，一个脆弱的策略就失效了。' },
    'flywheel': { ipa: '/ˈflaɪwiːl/', cn: 'n. 飞轮（比喻自我强化的循环）', ex: 'More data improves the policy, which collects better data.', exZh: '更多数据改进策略，更好的策略又采集到更好的数据。' },
    'moat': { ipa: '/məʊt/', cn: 'n. 护城河；竞争壁垒', ex: 'Ten thousand hours of manipulation data is a moat.', exZh: '一万小时的操作数据就是一道护城河。' }
  },
  quiz: [
    { q: 'Why does robot data have to be collected by hand?',
      options: ['Because robots cannot record their own sensors.',
                'Because there is no large public dataset of real manipulation, unlike text or images.',
                'Because the data must be kept secret.'],
      answer: 1,
      why: '原文：互联网上没有一百万次成功抓取的图书馆，所以公司只能手工采集。' },
    { q: 'Why make demonstrations deliberately imperfect?',
      options: ['To save time.',
                'So the policy learns what matters instead of memorising one exact setup.',
                'Because perfection is impossible.'],
      answer: 1,
      why: '只用完美示范训练，物体一转就失败；随机化条件能逼模型学到关键部分。' },
    { q: 'What does the author mean by “the flywheel is the product”?',
      options: ['The robot’s motor is the product.',
                'The self-reinforcing loop of data and policy is the competitive advantage, not the algorithm alone.',
                'Simulation is more important than hardware.'],
      answer: 1,
      why: '上万小时真实数据构成的自我强化循环本身就是壁垒，与“算法更好”不同。' }
  ]
},

/* ---------------------------------------------------------------------------
   2026-11-13 · 机器人自动化 / 工业机器人：重复精度不等于绝对精度
   --------------------------------------------------------------------------- */
{
  id: '2026-11-13',
  date: '2026-11-13',
  topic: '机器人自动化',
  title: 'Precise but Not Accurate',
  subtitle: 'A machine can hit the same point fifty thousand times and still miss the one you asked for.',
  level: 'CET-6',
  body: [
    { en: `A car-line robot returns to the same spot fifty thousand times a day, each time within a twentieth of a millimetre.`,
      zh: `产线上的机械臂一天要回到同一个位置五万次，每次偏差都在二十分之一毫米以内。` },
    { en: `Give it a coordinate from a drawing, and the same arm may miss by two millimetres.`,
      zh: `可要是给它一个图纸上的坐标，同一条臂可能偏出两毫米。` },
    { en: `The first quality, {{repeatability}}, is a promise the machine makes to itself: it can do again whatever it did last time.`,
      zh: `第一种品质叫{{重复精度}}，是机器对自己许的诺言：上次怎么做的，这次照样能做一遍。` },
    { en: `The second, {{accuracy}}, is a promise about the world: the point it reaches is the point you named.`,
      zh: `第二种叫{{绝对精度}}，是对世界许的诺言：它到达的那一点，就是你指定的那一点。` },
    { en: `One is easy to build. The other has to be earned.`,
      zh: `前者好造，后者得一点点挣来。` },
    { en: `The controller never sees the arm; it works from a model of link lengths and joint offsets.`,
      zh: `控制器其实看不见那条臂，它只依着一个模型算——每根连杆多长、每个关节偏多少。` },
    { en: `No real arm matches that model, because every link is machined to a {{tolerance}} and every joint pressed on with error.`,
      zh: `真实的臂没有一条与模型相符：连杆只按某个{{公差}}加工，关节装配时也带着误差。` },
    { en: `So the numbers must be measured. Engineers drive the tool to dozens of poses, watch it with a laser tracker, and {{calibrate}} the model until it agrees with the metal.`,
      zh: `所以这些数字只能靠测量。工程师让刀具走到几十个位姿，用激光跟踪仪盯着它，再{{标定}}模型，直到它与实物对得上。` },
    { note: {
        en: 'The model is not the machine. Calibration is the work of making the two agree.',
        zh: '模型不是机器本身，标定就是让两者达成一致的那份功夫。'
      } },
    { en: `Even then the arm changes within a shift: motors warm up, steel expands, and the tool {{drift}}s a few tenths of a millimetre before lunch.`,
      zh: `就算这样，一条臂在一个班次里也会变：电机发热，钢材膨胀，没到午饭刀具就{{漂移}}了几个十分之一毫米。` },
    { en: `Aluminium grows twenty-three millionths of its length per degree, which over two metres is no rounding error.`,
      zh: `铝每升高一摄氏度就伸长约百万分之二十三；摊在两米长的臂上，这不是能四舍五入掉的小数。` },
    { en: `Weight comes second. Any {{stiffness}} short of infinite brings {{deflection}}, and a heavy tool makes the arm sag.`,
      zh: `第二个问题是重量。只要{{刚度}}不到无穷，就必然有{{形变}}；挂上重刀，臂就往下沉。` },
    { en: `Gearboxes add softness of their own: a {{backlash}} of a few arc minutes is visible at the tip of a long arm.`,
      zh: `减速机又添一层软：关节里几分钟弧的{{背隙}}，到长臂末端就成了看得见的偏差。` },
    { en: `Then there is the part. A {{fixture}} holds it, and no fixture is perfect.`,
      zh: `接着是工件本身。它由{{夹具}}固定，而夹具没有一件是完美的。` },
    { en: `The plate sits half a millimetre from where the drawing says, and the robot faithfully goes to the wrong place.`,
      zh: `这块板停的位置比图纸偏了半毫米，机器人于是忠实地走到了错的地方。` },
    { en: `One answer is to let the robot look: a wrist camera finds the part, and software computes the {{transform}} between eye and tool.`,
      zh: `一种办法是让机器人自己看：腕上的相机找到工件，软件再算出相机与刀具之间的{{变换}}关系。` },
    { en: `Errors grow inside that transform. A tenth of a degree at half a metre throws the aim off by nearly a millimetre.`,
      zh: `误差正是在这个变换里被放大的。角度差十分之一度，在半米处瞄准点就偏出近一毫米。` },
    { note: {
        en: 'A camera does not remove error. It moves the error to a place where you can see it.',
        zh: '相机并不消除误差，只是把误差挪到一个你看得见的地方。'
      } },
    { en: `The stronger answer is to stop trusting one calculation: the arm moves, looks, corrects, and looks again.`,
      zh: `更硬的办法是干脆不信一次算完的结果：臂走一步、看一眼、修正一下，再看一眼。` },
    { en: `That is what a {{servo}} does, with a camera or a force sensor as its guide.`,
      zh: `这就是{{伺服}}在做的事，无论引路的是相机还是力传感器。` },
    { en: `Contact often beats sight: to seat a peg in a hole with a tenth of a millimetre of clearance, the wrist feels and slides until it drops in.`,
      zh: `触觉常常胜过视觉：销子要插进间隙只有十分之一毫米的孔，腕子便去感觉、去滑，直到它自己落进去。` },
    { en: `This is why the old method survives. An operator drags the arm to the right pose and records the angles, so that path is right by construction.`,
      zh: `老办法因此仍然活着：操作员抓住臂拖到正确位姿，记下这组关节角，那条路便天生是对的。` },
    { en: `But it is right only along that path, and only for that part.`,
      zh: `可它只在那条路上对，也只对那一个工件对。` },
    { en: `Modern production wants the opposite: new geometry every week, batches of forty, no time to teach each one.`,
      zh: `现代生产要的恰好相反：每周换几何形状，一批只做四十件，没时间一件件去教。` },
    { en: `So absolute accuracy earns its price, because a robot that knows where it is can be programmed before the part exists.`,
      zh: `绝对精度因此值那个价钱——一条知道自己身在何处的臂，可以在工件还不存在时就编好程序。` },
    { en: `The datasheet number is therefore not a property of the arm alone, but of arm, tool, fixture, temperature and calibration, measured on one day.`,
      zh: `所以样本上那个数字并非臂一家的属性，而是臂、刀具、夹具、温度与标定，在某一天共同量出来的结果。` }
  ],
  words: {

    'stiffness': { ipa: '/ˈstɪfnəs/', cn: 'n. 刚度（抵抗受力变形的能力）', ex: 'Stiffness falls sharply when the arm is fully extended.', exZh: '臂完全伸展时，刚度会明显下降。' },
    'deflection': { ipa: '/dɪˈflekʃn/', cn: 'n. 挠度；形变（受载后的弯曲量）', ex: 'A ten-kilogram tool adds visible deflection at the wrist.', exZh: '挂上十公斤的刀具，腕部会出现肉眼可见的形变。' },
    'backlash': { ipa: '/ˈbæklæʃ/', cn: 'n. 背隙；齿隙（传动件换向时的空程）', ex: 'Backlash shows up as a small dead zone whenever the joint reverses.', exZh: '关节一换向，背隙就表现为一小段空程。' },
    'fixture': { ipa: '/ˈfɪkstʃə(r)/', cn: 'n. 夹具；固定装置', ex: 'The fixture decides where the part really is, whatever the drawing claims.', exZh: '工件究竟在哪里由夹具决定，图纸说什么不算。' },
    'transform': { ipa: '/trænsˈfɔːm/', cn: 'n.（坐标）变换 v. 转变', ex: 'The software applies one transform to turn pixels into millimetres.', exZh: '软件用一个变换把像素换算成毫米。' },
    'servo': { ipa: '/ˈsɜːvəʊ/', cn: 'n. 伺服机构（按反馈不断修正动作的驱动装置）', ex: 'A servo compares where it is with where it should be, thousands of times a second.', exZh: '伺服机构每秒上千次比较自己在哪里与该在哪里。' }
  },
  quiz: [
    { q: 'How does the passage distinguish repeatability from accuracy?',
      options: ['Repeatability is a promise about the machine itself; accuracy is a promise about the outside world.',
                'Repeatability matters for welding, while accuracy matters only for assembly.',
                'Accuracy is built into the hardware, while repeatability must be measured every day.'],
      answer: 0,
      why: '第三、四句给出定义：重复精度是机器对自己许的诺言（再做一遍同一动作），绝对精度是对世界许的诺言（到达的就是你指定的点）。' },
    { q: 'Why does a small angular error in the camera matter so much?',

                'Because the controller rounds every angle to one decimal place.'],
