<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<title>Daily Read · 理工科英语每日一读</title>
<!--
  ============================================================================
  Daily Read · 单文件英语阅读站点
  ----------------------------------------------------------------------------
  纯前端，无后端、无框架、无外部依赖，双击本文件即可运行。
  所有学习记录（已读、生词掌握、主题、字号）都存在浏览器 localStorage，
  换浏览器或清理缓存会丢失，属于预期行为。

  【日常使用】
  1) 每天在下面的 ARTICLES 数组最前面加一篇新文章（复制一份旧的结构改内容）
  2) 正文里用 {{单词}} 标记重点词（会自动加粗+下划线，可点击查词）
  3) 同一个单词必须在 words 里有一条词条，否则点击无内容
  4) 保存刷新即可，历史归档、单词本会自动收录

  【目录】
  §0  CSS 变量与主题
  §1  页面骨架样式
  §2  阅读区样式
  §3  单词本 / 归档 / 设置样式
  §4  底部液态玻璃导航
  §5  数据区（文章 + 词库）
  §6  状态与工具函数
  §7  视图渲染
  §8  事件绑定
  ============================================================================
-->
<style>
/* ==========================================================================
   §0  CSS 变量与主题
   ========================================================================== */
:root{
  --bg:#faf9f6;
  --surface:#ffffff;
  --surface-2:#f5f3ed;
  --ink:#17181a;
  --ink-2:#4b4d52;
  --ink-3:#8b8c90;
  --line:#e7e4db;
  --line-soft:#f0eee7;
  --accent:#0d6e66;
  --accent-ink:#0a5a53;
  --accent-soft:#e2f0ed;
  --hover:rgba(20,20,20,.028);
  --shadow-sm:0 1px 2px rgba(24,20,12,.05);
  --shadow-md:0 10px 30px -12px rgba(24,20,12,.18);
  --fs:19px;                 /* 英文正文字号，由设置页控制 */
  --dock-h:74px;             /* 底部导航高度，正文避让用 */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  /* 插图配色（SVG 里用 class 引用，深浅色各一套） */
  --fig-ink:#3c3e42;
  --fig-line:#ddd8ce;
  --fig-accent:#0d6e66;
  --fig-accent-2:#b0662c;
  --fig-soft:#f1ede4;
  /* 缓动曲线：进场用 ease-out 系，位移用 Apple 的减速曲线 */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.32,.42,1);
}
[data-theme="dark"]{
  --bg:#0e0f11;
  --surface:#17191c;
  --surface-2:#1e2126;
  --ink:#eae8e3;
  --ink-2:#b7b5af;
  --ink-3:#797872;
  --line:#2b2e33;
  --line-soft:#212429;
  --accent:#5ec8ba;
  --accent-ink:#7fd9cd;
  --accent-soft:#153a37;
  --hover:rgba(255,255,255,.038);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 12px 34px -14px rgba(0,0,0,.7);
  --fig-ink:#c9c7c2;
  --fig-line:#33373d;
  --fig-accent:#5ec8ba;
  --fig-accent-2:#d9975a;
  --fig-soft:#1e2126;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:auto;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background .3s ease,color .3s ease;
}
[hidden]{display:none !important;}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;}
::selection{background:var(--accent-soft);color:var(--accent-ink);}

/* ==========================================================================
   §1  页面骨架
   ========================================================================== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);                 /* 老浏览器回退 */
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{
  max-width:820px;margin:0 auto;
  height:58px;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.brand-mark{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:var(--accent);color:#fff;
  display:grid;place-items:center;
  font-family:var(--serif);font-size:15px;font-weight:600;
  box-shadow:var(--shadow-sm);
}
[data-theme="dark"] .brand-mark{color:#08211f;}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;}
.brand-txt b{font-size:14.5px;letter-spacing:.01em;}
.brand-txt i{font-style:normal;font-size:11px;color:var(--ink-3);letter-spacing:.03em;}
.icon-btn{
  width:34px;height:34px;border-radius:10px;
  border:1px solid transparent;background:transparent;
  display:grid;place-items:center;color:var(--ink-2);
  transition:background .18s,color .18s,transform .18s;
}
.icon-btn:hover{background:var(--hover);color:var(--ink);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

/* 环境色层：几乎没有存在感，但玻璃要"透"出点什么才像玻璃 */
.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 420px at 6% 12%, rgba(13,110,102,.06), transparent 68%),
    radial-gradient(560px 420px at 98% 64%, rgba(176,102,44,.05), transparent 68%),
    radial-gradient(760px 480px at 46% 106%, rgba(13,110,102,.07), transparent 66%);
}
[data-theme="dark"] .ambient{
  background:
    radial-gradient(620px 420px at 6% 12%, rgba(94,200,186,.075), transparent 68%),
    radial-gradient(560px 420px at 98% 64%, rgba(217,151,90,.05), transparent 68%),
    radial-gradient(760px 480px at 46% 106%, rgba(94,200,186,.09), transparent 66%);
}

.wrap{
  position:relative;z-index:1;
  max-width:820px;margin:0 auto;
  padding:0 20px;
  /* 自动避开底部导航：dock 高度 + 安全区 */
  padding-bottom:calc(var(--dock-h) + 46px + env(safe-area-inset-bottom,0px));
}
/* 横向页面舞台：四页并排放在一条滑轨上，靠 transform 平移 */
.stage{position:relative;overflow-x:hidden;overflow-x:clip;overflow-y:visible;}
.view{
  position:absolute;top:0;left:0;width:100%;
  /* 这里千万不要加 will-change / backface-visibility：
     四页都是整页高度，会各自生成一张巨大的合成层，手机上直接卡死 */
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}

/* ==========================================================================
   §2  阅读区
   ========================================================================== */
.art-head{padding:34px 0 0;}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.tag{
  font-size:11.5px;letter-spacing:.02em;
  padding:3px 9px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent-ink);
  font-weight:600;
}
.meta time{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;}
.art-title{
  font-family:var(--serif);
  font-size:31px;line-height:1.24;font-weight:600;
  letter-spacing:-.012em;margin:0 0 8px;
}
.art-sub{
  font-family:var(--serif);font-style:italic;
  font-size:15px;color:var(--ink-3);
  margin:0 0 20px;line-height:1.5;
}
.statbar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:11px 0;margin-bottom:4px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3);
  letter-spacing:.02em;
}
.statbar span{display:inline-flex;align-items:center;gap:5px;}
.statbar .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.5;}
.statbar b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums;}

.toolbar{
  position:sticky;top:58px;z-index:30;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 0;
  background:var(--bg);
}
/* 工具条下方做一层淡出，避免正文滚动时出现生硬的切边 */
.toolbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;
  background:linear-gradient(var(--bg),transparent);
  pointer-events:none;
}
.seg{
  display:inline-flex;padding:3px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line-soft);
}
.seg button{
  border:0;background:transparent;border-radius:7px;
  padding:5px 12px;font-size:12.5px;color:var(--ink-3);
  transition:.18s;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:600;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;color:var(--ink-2);
  transition:.18s;
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink);}
.btn:active{transform:scale(.98);}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
[data-theme="dark"] .btn.on{color:#08211f;}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

/* --- 句子行 --- */
.reading{padding:8px 0 0;}
.sent{
  position:relative;
  padding:9px 34px 9px 10px;
  margin:0 -10px 6px;
  border-radius:10px;
  transition:background .18s;
}
.sent:hover{background:var(--hover);}
.sent.now{background:var(--accent-soft);}
.sent .en{
  font-family:var(--serif);
  font-size:var(--fs);
  line-height:1.78;
  color:var(--ink);
  letter-spacing:.002em;
}
.sent .zh{
  font-size:14.5px;
  line-height:1.85;
  color:var(--ink-3);
  margin-top:5px;
  letter-spacing:.01em;
}
.reading.only-en .zh{display:none;}
.reading.only-en .sent{padding-bottom:10px;}

/* 重点词：加粗 + 下划线 */
.w{
  font-weight:700;
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-underline-offset:3.5px;
  text-decoration-color:var(--accent);
  cursor:pointer;
  border-radius:3px;
  transition:background .16s,color .16s,text-decoration-color .16s;
}
.w:hover,.w:focus-visible{
  background:var(--accent-soft);
  color:var(--accent-ink);
  outline:none;
}

/* 单句朗读按钮 */
.spk{
  position:absolute;right:2px;top:12px;
  width:24px;height:24px;padding:0;
  border:0;background:transparent;border-radius:7px;
  color:var(--ink-3);opacity:0;
  display:grid;place-items:center;
  transition:opacity .18s,background .18s,color .18s;
}
.sent:hover .spk,.sent.now .spk{opacity:1;}
.spk:hover{background:var(--surface-2);color:var(--accent-ink);}
.spk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round;}
@media (hover:none){.spk{opacity:.42;}}

/* --- 本篇重点词条带 --- */
.wordstrip{margin:34px 0 6px;padding-top:18px;border-top:1px solid var(--line);}
.strip-label{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin:0 0 12px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  border:1px solid var(--line);background:var(--surface);
  border-radius:7px;padding:4px 10px;
  font-family:var(--serif);font-size:13.5px;color:var(--ink-2);
  transition:.16s;
}
.chip:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}

/* --- 理解题 --- */
.quiz{margin:36px 0 0;padding-top:22px;border-top:1px solid var(--line);}
.quiz-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
.quiz-head h3{
  font-family:var(--serif);font-size:18px;font-weight:600;margin:0;letter-spacing:-.005em;
}
.quiz-head span{font-size:12px;color:var(--ink-3);}
.q{margin:20px 0 0;}
.q p.qtext{margin:0 0 10px;font-size:14.5px;color:var(--ink);line-height:1.6;}
.q p.qtext b{color:var(--accent-ink);margin-right:6px;}
.opts{display:flex;flex-direction:column;gap:6px;}
.opt{
  text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;padding:9px 13px;
  font-size:13.5px;color:var(--ink-2);line-height:1.5;
  transition:.16s;
}
.opt:hover{border-color:var(--ink-3);}
.opt.right{border-color:#1f9d5a;background:rgba(31,157,90,.09);color:#177a45;}
.opt.wrong{border-color:#cf5b4a;background:rgba(207,91,74,.08);color:#a8402f;}
[data-theme="dark"] .opt.right{color:#6fd39a;border-color:#3f8f68;background:rgba(60,150,105,.14);}
[data-theme="dark"] .opt.wrong{color:#e78d7e;border-color:#8f4f45;background:rgba(160,70,58,.16);}
.opt .k{font-weight:700;margin-right:7px;opacity:.6;}
.answer{
  margin:10px 0 0;padding:10px 13px;border-radius:9px;
  background:var(--surface-2);border-left:2px solid var(--accent);
  font-size:13px;color:var(--ink-2);line-height:1.65;
}
.answer b{color:var(--accent-ink);}

/* --- 文章插图 --- */
.fig{
  margin:34px 0 8px;
  padding:20px 22px 16px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.fig-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 16px;}
.fig-head b{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:700;white-space:nowrap;
}
.fig-head span{font-size:11.5px;color:var(--ink-3);}
.fig svg{display:block;width:100%;height:auto;}
/* 窄屏时图里文字会缩到看不清，改成可横向滑动，字号保持不变 */
.fig-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
.fig-scroll::-webkit-scrollbar{height:6px;}
.fig-scroll::-webkit-scrollbar-track{background:transparent;}
.fig-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.fig-cap{
  margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--ink-3);line-height:1.68;
}
.fig-cap b{color:var(--ink-2);font-weight:600;}

/* SVG 内部样式统一走 class，深浅色靠 CSS 变量切换 */
.fig svg text{font-family:var(--sans);fill:var(--fig-ink);}
.fig svg .t{font-size:13px;font-weight:600;}
.fig svg .s{font-size:11.5px;opacity:.72;}
.fig svg .xs{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;}
.fig svg .mono{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:12.5px;}
.fig svg .b{font-size:15px;font-weight:700;font-family:var(--serif);}
.fig svg .pad{fill:none;stroke:var(--fig-accent-2);stroke-width:2;stroke-linecap:round;}
.fig svg .ln{stroke:var(--fig-line);stroke-width:1;fill:none;}
.fig svg .dash{stroke-dasharray:3 4;}
.fig svg .acc{fill:var(--fig-accent);}
.fig svg .acc2{fill:var(--fig-accent-2);}
.fig svg .accs{fill:var(--fig-accent);opacity:.15;}
.fig svg .acc2s{fill:var(--fig-accent-2);opacity:.15;}
.fig svg .box{fill:var(--fig-soft);stroke:var(--fig-line);}
.fig svg .mk{fill:var(--fig-line);}

/* --- WHY IT MATTERS 说明卡 --- */
.callout{
  margin:32px 0;
  padding:16px 18px 17px;
  border-radius:13px;
  background:var(--accent-soft);
  border:1px solid var(--line);
  border-color:color-mix(in srgb, var(--accent) 20%, transparent);
}
.callout p{margin:0;}
.callout .cl{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:700;margin-bottom:8px;
}
.callout .ce{
  font-family:var(--serif);font-size:15px;line-height:1.62;color:var(--ink);
}
.callout .cz{font-size:12.5px;line-height:1.72;color:var(--ink-2);opacity:.88;margin-top:6px;}

/* --- 上下篇 --- */
.pager{
  display:flex;gap:10px;margin:38px 0 0;padding-top:20px;
  border-top:1px solid var(--line);
}
.pager a{
  flex:1;min-width:0;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:11px;
  padding:12px 15px;background:var(--surface);
  transition:.18s;
}
.pager a:hover{border-color:var(--accent);text-decoration:none;}
.pager .lbl{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:3px;}
.pager .tt{display:block;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pager a.next{text-align:right;}
.pager a.dis{opacity:.4;pointer-events:none;}

/* --- 查词弹窗 --- */
.tip{
  position:fixed;left:0;top:0;z-index:120;
  width:min(320px,calc(100vw - 24px));
  padding:14px 16px 15px;
  border-radius:13px;
  background:var(--surface);            /* 老浏览器回退 */
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  backdrop-filter:blur(18px) saturate(180%);
  border:1px solid var(--line);
  box-shadow:0 18px 44px -16px rgba(20,18,12,.32),0 2px 8px rgba(20,18,12,.06);
  animation:tipIn .16s ease both;
}
@keyframes tipIn{from{opacity:0;transform:translateY(5px) scale(.985);}to{opacity:1;transform:none;}}
.tip .tw{
  font-family:var(--serif);font-size:17px;font-weight:700;
  letter-spacing:-.01em;margin-bottom:2px;
}
.tip .ipa{
  font-family:"Segoe UI",var(--sans);font-size:12.5px;
  color:var(--accent-ink);letter-spacing:.02em;margin-bottom:7px;
}
.tip .cn{font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:10px;}
.tip .ex{
  font-family:var(--serif);font-size:13.5px;line-height:1.6;
  color:var(--ink-2);padding-left:10px;border-left:2px solid var(--line);
  margin-bottom:4px;
}
.tip .exzh{font-size:12.5px;color:var(--ink-3);line-height:1.6;padding-left:12px;}

/* ==========================================================================
   §3  单词本 / 归档 / 设置
   ========================================================================== */
.page-head{padding:36px 0 20px;}
.page-head h2{
  font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em;
}
.page-head p{margin:0;font-size:13.5px;color:var(--ink-3);}

.wb-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 0 16px;border-bottom:1px solid var(--line);
}
.sel{
  appearance:none;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;padding:6px 30px 6px 12px;
  font-size:12.5px;color:var(--ink-2);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%238b8c90' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.wb-count{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}

.wb-list{margin-top:4px;}
.wb-row{
  display:flex;align-items:center;gap:14px;
  padding:13px 10px;margin:0 -10px;
  border-bottom:1px solid var(--line-soft);
  border-radius:9px;
  transition:background .16s;
}
.wb-row:hover{background:var(--hover);}
.wb-word{
  flex:0 0 168px;min-width:0;
  display:flex;flex-direction:column;gap:1px;
}
.wb-word i{
  font-style:normal;font-family:var(--serif);font-size:16px;font-weight:700;
  letter-spacing:-.01em;color:var(--ink);word-break:break-word;
}
.wb-word small{font-size:11.5px;color:var(--accent-ink);opacity:.85;letter-spacing:.01em;}
.wb-cn{
  flex:1;min-width:0;font-size:13.5px;color:var(--ink-2);line-height:1.55;
  transition:filter .18s,opacity .18s;
}
.wb-list.hide .wb-cn{filter:blur(5px);opacity:.55;cursor:pointer;user-select:none;}
.wb-list.hide .wb-row.reveal .wb-cn{filter:none;opacity:1;}
.wb-date{flex:0 0 auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.wb-done{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--line);background:transparent;
  display:grid;place-items:center;color:transparent;
  transition:.16s;
}
.wb-done svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.wb-done:hover{border-color:var(--accent);}
.wb-row.done .wb-done{background:var(--accent);border-color:var(--accent);color:#fff;}
[data-theme="dark"] .wb-row.done .wb-done{color:#08211f;}
.wb-row.done .wb-word i{color:var(--ink-3);font-weight:600;}
.empty{
  padding:56px 0;text-align:center;color:var(--ink-3);font-size:13.5px;
}

/* 归档 */
.hist-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.hist-card{
  display:block;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:13px;
  padding:16px 18px;background:var(--surface);
  transition:border-color .18s,transform .18s,box-shadow .18s;
}
.hist-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.hist-top{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.hist-top time{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.hist-card h3{
  font-family:var(--serif);font-size:16.5px;font-weight:600;margin:0 0 4px;
  line-height:1.35;letter-spacing:-.005em;
}
.hist-card p{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.5;}
.badge-read{
  margin-left:auto;font-size:11px;color:var(--accent-ink);
  background:var(--accent-soft);padding:2px 8px;border-radius:5px;font-weight:600;
}

/* 设置 */
.set-group{
  border:1px solid var(--line);border-radius:13px;
  background:var(--surface);overflow:hidden;margin-bottom:14px;
}
.set-row{
  display:flex;align-items:center;gap:16px;
  padding:14px 18px;border-bottom:1px solid var(--line-soft);
}
.set-row:last-child{border-bottom:0;}
.set-label{flex:1;min-width:0;}
.set-label b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:2px;}
.set-label span{font-size:12px;color:var(--ink-3);line-height:1.45;}
.set-ctl{flex:0 0 auto;display:flex;gap:6px;align-items:center;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.stat-cell{padding:18px 16px;text-align:center;border-right:1px solid var(--line-soft);}
.stat-cell:last-child{border-right:0;}
.stat-cell b{
  display:block;font-family:var(--serif);font-size:26px;font-weight:600;
  color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums;
}
.stat-cell span{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;}
.danger{color:#a8402f;border-color:rgba(168,64,47,.35);}
.danger:hover{background:rgba(168,64,47,.07);border-color:#a8402f;color:#a8402f;}
[data-theme="dark"] .danger{color:#e78d7e;border-color:rgba(231,141,126,.3);}
.note{
  font-size:12px;color:var(--ink-3);line-height:1.65;
  padding:0 2px 24px;
}

/* ==========================================================================
   §4  底部液态玻璃导航（iOS 风格 liquid glass dock）
   --------------------------------------------------------------------------
   分层结构（自下而上）：
     .dock          定位容器：圆角、外阴影、拖拽位移
     .dock-glass    磨砂层：backdrop-filter 模糊 + 低透明度染色 + 内高光
     .dock-lens     折射层：SVG feDisplacementMap（Chromium 专有；
                    其他浏览器会丢弃整条声明，该层自动透明，不影响磨砂兜底）
     .dock-sheen    镜面层：跟随指针的柔光
     .dock-rim      边缘渐变描边（遮罩挖空做出 1px 渐变环）
     .dock-ind      选中项滑块
     .dock-item     图标 + 文字
   参考实现：liquid-glass-react 的三通道色散架构；
   rxing365 WebGL 仓库 README 里"固定形状改用预计算法线图 + SVG 滤镜"的建议。
   ========================================================================== */
.dock{
  position:fixed;left:50%;z-index:80;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:2px;
  padding:7px 9px;
  border-radius:999px;
  transform:translateX(-50%);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;         /* 允许页面滚动，只禁掉双击缩放 */
  isolation:isolate;
  /* 外阴影三层：近处实、远处虚，做出"悬着一片玻璃"的层次 */
  box-shadow:
    0 1px 2px rgba(18,20,26,.05),
    0 12px 28px -10px rgba(18,20,26,.28),
    0 34px 64px -30px rgba(18,20,26,.40);
}
/* 拎起玻璃球时：球加重投影，其余图标自动让位 */
.dock.balling .dock-ind{
  transition:none;                      /* 跟手阶段不要缓动 */
  box-shadow:
    0 8px 22px -8px rgba(18,20,26,.45),
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 2px rgba(255,255,255,.40);
}
.dock.balling .dock-item{opacity:.45;}
.dock.balling .dock-item.on{opacity:1;}

/* ---------- 玻璃本体：不做磨砂，靠折射出效果 ---------- */
.dock-glass{
  position:absolute;inset:0;border-radius:inherit;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(255,255,255,.13) 0%,
    rgba(255,255,255,.03) 42%,
    rgba(255,255,255,.09) 100%);                    /* 极淡的上下渐变，交代厚度 */
  -webkit-backdrop-filter:blur(9px) saturate(150%) brightness(1.04);
  backdrop-filter:blur(9px) saturate(150%) brightness(1.04);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.92),             /* 顶部 1px 高光 */
    inset 0 -1px 0 rgba(255,255,255,.26),
    inset 0 0 0 .5px rgba(255,255,255,.42);
}

/* 不支持折射的浏览器（Safari / Firefox）退回一层轻磨砂，否则文字会和图标糊在一起 */
.dock.no-lens .dock-glass{
  background:rgba(252,252,250,.30);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  backdrop-filter:blur(14px) saturate(180%);
}

/* ---------- 折射层：Chromium 才有肉眼可见的边缘透镜 ---------- */
.dock-lens{
  position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;
  backdrop-filter:url(#lgRefract);
  -webkit-backdrop-filter:url(#lgRefract);
}

/* ---------- 镜面高光：跟随指针，拖动时最明显 ---------- */
.dock-sheen{
  position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;
  background:
    radial-gradient(150px 72px at var(--sx,50%) var(--sy,-12%),
      rgba(255,255,255,.42), rgba(255,255,255,0) 72%),
    linear-gradient(152deg, rgba(255,255,255,.18), rgba(255,255,255,0) 44%, rgba(255,255,255,.07) 100%);
  opacity:.8;
}

/* ---------- 边缘渐变描边：中间薄、两头亮，像玻璃被光擦过 ---------- */
.dock-rim{
  position:absolute;inset:0;border-radius:inherit;z-index:3;pointer-events:none;
  padding:1px;
  background:linear-gradient(168deg,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.30) 38%,
    rgba(255,255,255,.14) 62%,
    rgba(255,255,255,.75) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
}

/* ---------- 选中项滑块 ---------- */
.dock-ind{
  position:absolute;top:7px;bottom:7px;left:0;width:0;z-index:4;
  border-radius:999px;
  background:rgba(226,240,237,.55);
  -webkit-backdrop-filter:blur(4px) saturate(160%);
  backdrop-filter:blur(4px) saturate(160%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 2px rgba(255,255,255,.35),
    inset 0 0 12px rgba(255,255,255,.35),
    0 1px 3px rgba(18,20,26,.06);
  transition:width .2s ease;
}

.dock-item{
  position:relative;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:74px;padding:8px 0 6px;
  border:0;background:transparent;border-radius:999px;
  color:var(--ink-3);
  touch-action:pan-y;                /* 竖向交给页面滚动，横向手势留给拖玻璃球 */
  -webkit-touch-callout:none;        /* iOS 长按不要弹菜单 */
  /* 玻璃变薄以后，图标和文字需要一层很淡的光晕才能和下面的正文分开 */
  filter:drop-shadow(0 0 2px rgba(255,255,255,.92)) drop-shadow(0 0 7px rgba(255,255,255,.5));
  transition:color .25s ease,transform .22s var(--ease-spring),opacity .2s ease;
}
.dock-item svg{
  width:20px;height:20px;
  stroke:currentColor;fill:none;
  stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .34s var(--ease-spring),stroke-width .25s ease;
}
.dock-item span{
  font-size:10.5px;letter-spacing:.02em;
  transition:font-weight .2s,opacity .2s;
}
.dock-item.on{color:var(--accent-ink);}
.dock-item.on svg{transform:scale(1.08);stroke-width:1.9;}
.dock-item.on span{font-weight:600;}
/* 按下的反馈必须在 pointerdown 时就出现 */
.dock-item.press{transform:scale(.93);}

/* ---------- 深色模式 ---------- */
[data-theme="dark"] .dock{
  box-shadow:
    0 1px 2px rgba(0,0,0,.45),
    0 14px 34px -12px rgba(0,0,0,.7),
    0 42px 74px -34px rgba(0,0,0,.9);
}
[data-theme="dark"] .dock.no-lens .dock-glass{
  background:rgba(24,26,31,.34);
  -webkit-backdrop-filter:blur(14px) saturate(170%);
  backdrop-filter:blur(14px) saturate(170%);
}
[data-theme="dark"] .dock-item{
  filter:drop-shadow(0 0 2px rgba(0,0,0,.9)) drop-shadow(0 0 7px rgba(0,0,0,.55));
}
[data-theme="dark"] .dock.balling .dock-ind{
  box-shadow:
    0 8px 24px -8px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.2);
}
[data-theme="dark"] .dock-glass{
  background:rgba(20,22,26,.16);
  -webkit-backdrop-filter:saturate(120%) brightness(1.10);
  backdrop-filter:saturate(120%) brightness(1.10);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -1px 0 rgba(255,255,255,.04),
    inset 0 0 0 .5px rgba(255,255,255,.07);
}
[data-theme="dark"] .dock-rim{
  background:linear-gradient(168deg,
    rgba(255,255,255,.34) 0%,
    rgba(255,255,255,.06) 40%,
    rgba(255,255,255,.03) 64%,
    rgba(255,255,255,.16) 100%);
}
[data-theme="dark"] .dock-sheen{
  background:
    radial-gradient(150px 72px at var(--sx,50%) var(--sy,-12%),
      rgba(255,255,255,.16), rgba(255,255,255,0) 72%),
    linear-gradient(152deg, rgba(255,255,255,.05), rgba(255,255,255,0) 46%, rgba(255,255,255,.02) 100%);
}
[data-theme="dark"] .dock-ind{
  background:rgba(94,200,186,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 3px rgba(0,0,0,.3);
}

/* 不支持 backdrop-filter 的老浏览器：退化成不透明面板 */
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .dock-glass{background:var(--surface);}
  [data-theme="dark"] .dock-glass{background:#202328;}
}

/* 系统开启"降低透明度"时，直接给实心面板 */
@media (prefers-reduced-transparency:reduce){
  .dock-glass{
    background:var(--surface);
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  .dock-lens{display:none;}
  .dock-sheen{opacity:.3;}
}

/* 触屏设备：SVG 折射滤镜每帧重算，手机上代价太高，直接关掉换成更厚的磨砂 */
@media (pointer:coarse),(max-width:820px){
  .dock-lens{display:none;}
  .dock-glass{
    background:rgba(252,252,250,.34);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    backdrop-filter:blur(18px) saturate(180%);
  }
  .dock-item,
  [data-theme="dark"] .dock-item{filter:none;}   /* 光环在厚磨砂上不需要，还省一次离屏合成 */
  [data-theme="dark"] .dock-glass{
    background:rgba(24,26,31,.42);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    backdrop-filter:blur(18px) saturate(160%);
  }
}

@media (max-width:380px){
  .dock-item{width:64px;}
}

/* ==========================================================================
   小屏适配
   ========================================================================== */
@media (max-width:640px){
  .wrap{padding-left:16px;padding-right:16px;}
  .art-title{font-size:25px;}
  .art-head{padding-top:24px;}
  .toolbar{top:58px;}
  .sent{padding-right:30px;}
  .sent .en{font-size:calc(var(--fs) - 1px);line-height:1.72;}
  .wb-word{flex:0 0 118px;}
  .wb-word i{font-size:15px;}
  .wb-date{display:none;}
  .pager{flex-direction:column;}
  .pager a.next{text-align:left;}
  .stat-cell b{font-size:22px;}
  .fig{padding:16px 14px 12px;border-radius:13px;}
  .fig-scroll > svg{min-width:520px;}
}
@media (max-width:400px){
  .wb-word{flex:0 0 92px;}
  .wb-cn{font-size:12.5px;}
}
</style>
</head>
<body>

<!-- 极淡的环境色，给玻璃提供"可以透出来的东西" -->
<div class="ambient" aria-hidden="true"></div>

<!-- ============================ 顶部栏 ============================ -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" data-go="read">
      <span class="brand-mark">R</span>
      <span class="brand-txt"><b>Daily Read</b><i>理工科英语 · 每日一篇</i></span>
    </a>
    <div class="set-ctl">
      <button class="icon-btn" id="btnTheme" title="切换深浅色" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ============================ 主体视图 ============================ -->
<main class="wrap">
  <!-- 四个页面并排在同一条滑轨上，由底部玻璃球的位置实时驱动 -->
  <div class="stage" id="stage">
    <section class="view" id="view-read"></section>
    <section class="view" id="view-words"></section>

  </div>
</main>

<!-- ============================ 底部液态玻璃导航 ============================ -->
<nav class="dock" id="dock" aria-label="主导航">
  <!-- 玻璃分四层叠出来：磨砂 → 折射 → 镜面 → 描边 -->
  <span class="dock-glass" aria-hidden="true"></span>
  <span class="dock-lens" id="dockLens" aria-hidden="true"></span>
  <span class="dock-sheen" id="dockSheen" aria-hidden="true"></span>
  <span class="dock-rim" aria-hidden="true"></span>
  <span class="dock-ind" id="dockInd" aria-hidden="true"></span>

  <button class="dock-item on" data-view="read" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M12 6.5C10.6 5.2 8.6 4.6 6 4.6H3.5v13H6c2.6 0 4.6.6 6 1.9 1.4-1.3 3.4-1.9 6-1.9h2.5v-13H18c-2.6 0-4.6.6-6 1.9Z"/><path d="M12 6.5v13"/></svg>
    <span>每日阅读</span>
  </button>

  <button class="dock-item" data-view="words">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.6"/><path d="M7.5 9.2h6.2M7.5 12.6h9M7.5 16h4.4"/></svg>
    <span>单词本</span>
  </button>

  <button class="dock-item" data-view="history">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 1.9"/></svg>
    <span>历史</span>
  </button>

  <button class="dock-item" data-view="settings">
    <svg viewBox="0 0 24 24"><path d="M4 8.2h16M4 15.8h16"/><circle cx="9.2" cy="8.2" r="2.1"/><circle cx="14.8" cy="15.8" r="2.1"/></svg>
    <span>设置</span>
  </button>
</nav>

<!-- ============================ 查词弹窗 ============================ -->
<div class="tip" id="tip" role="dialog" aria-live="polite" hidden></div>

<script>
/* ============================================================================
   §5  数据区 —— 想换文章只改这里
   ----------------------------------------------------------------------------
   字段说明：
   id      唯一标识，建议用日期
   date    发布日 YYYY-MM-DD（历史归档、单词本按天筛选都用它）
   topic   领域标签，显示在标题上方
   title   英文标题
   subtitle 英文副标题（可留空）
   level   难度标注
   body    [{en, zh}] 逐句数组，en 里用 {{word}} 标记重点词
   words   { 重点词: {ipa, cn, ex, exZh} }
   quiz    [{q, options:[...], answer:索引, why:解析}]
   ========================================================================== */

const CONFIG = {
  wordsPerMinute: 52,   // 估算阅读时长的速度（含看中文翻译），觉得偏慢可改成 60
};

/* ----------------------------------------------------------------------------
   FIGURES —— 文章配图库
   ----------------------------------------------------------------------------
   正文里用 { fig: 'xxx' } 引用，会插到对应句子之间。
   所有颜色都走 CSS 变量（--fig-*），深浅色自动切换；
   viewBox 固定为 640 宽，容器宽度变化时等比缩放。
   ---------------------------------------------------------------------------- */
const FIGURES = {


  /* ⑤ 先进封装剖面 */
  package: {
    head: 'Figure 5',
    note: 'a cross section of one AI accelerator',
    svg: `<svg viewBox="0 0 640 260" role="img" aria-label="Cross section of an advanced package">
      <defs>
        <marker id="fea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path class="mk" d="M0 0 L10 5 L0 10 Z"/>
        </marker>
      </defs>

      <rect class="box" x="40" y="196" width="520" height="14" rx="3"/>
      <rect class="accs" x="40" y="178" width="520" height="14" rx="3"/>

      <rect class="acc2s" x="60" y="108" width="76" height="16" rx="2"/>
      <rect class="acc2s" x="60" y="126" width="76" height="16" rx="2"/>
      <rect class="acc2s" x="60" y="144" width="76" height="16" rx="2"/>
      <rect class="acc2s" x="60" y="162" width="76" height="16" rx="2"/>

      <rect class="acc2s" x="504" y="108" width="76" height="16" rx="2"/>
      <rect class="acc2s" x="504" y="126" width="76" height="16" rx="2"/>
      <rect class="acc2s" x="504" y="144" width="76" height="16" rx="2"/>
      <rect class="acc2s" x="504" y="162" width="76" height="16" rx="2"/>

      <rect class="accs" x="230" y="122" width="180" height="56" rx="4"/>
      <text class="s" x="320" y="155" text-anchor="middle">logic die</text>

      <line class="ln" x1="144" y1="140" x2="222" y2="140" marker-end="url(#fea)"/>
      <line class="ln" x1="496" y1="140" x2="418" y2="140" marker-end="url(#fea)"/>

      <rect class="acc2s" x="40" y="226" width="10" height="10" rx="2"/>
      <text class="s" x="58" y="235">HBM stack</text>
      <rect class="accs" x="176" y="226" width="10" height="10" rx="2"/>
      <text class="s" x="194" y="235">interposer</text>
      <rect class="box" x="306" y="226" width="10" height="10" rx="2"/>
      <text class="s" x="324" y="235">substrate</text>
    </svg>`,
    caption: '<b>Everything happens in the middle.</b> The logic die no longer holds the memory; the memory sits beside it, stacked, and the interposer is the road between them. The shorter that road, the less energy each bit costs.'
  },

  /* ⑥ 单碱基编辑 */
  baseedit: {
    head: 'Figure 6',

   2026-11-03 · 金融市场 / 指数再平衡与被动资金
   --------------------------------------------------------------------------- */
{

  title: 'The Trade That Has to Happen',
  subtitle: 'When a stock joins an index, the buyers are not convinced. They are required.',
  level: 'CET-6',
  body: [
    { en: `Several times a year, a stock can jump several percent on a day when the company announces nothing at all.`,

    { en: `No new product, no earnings report, no contract.`,
      zh: `没有新产品，没有财报，也没有新合同。` },
    { en: `What changed was a rule, written by a committee most investors have never heard of.`,
      zh: `变动的是一条规则，而写下这条规则的委员会，大多数投资者从没听说过。` },
    { en: `That committee decides which companies belong to an {{index}}.`,
      zh: `这个委员会决定哪些公司属于某个指数。` },
    { en: `An index is not a judgement about value. It is a list, and a list can be edited.`,
      zh: `指数不是对价值的判断。它只是一份名单，而名单是可以修改的。` },
    { en: `Funds that track an index hold whatever the list holds, in the proportions the list gives.`,
      zh: `跟踪指数的基金，名单上有什么它就持有什么，比例也照名单给的来。` },
    { en: `Their {{mandate}} leaves no room for an opinion.`,
      zh: `它们的受托义务里，没有给“看法”留位置。` },
    { en: `So when a company is added, every fund tracking that index has to buy it, by a deadline published months in advance.`,
      zh: `于是当一家公司被纳入，每一只跟踪该指数的基金都必须买入，而截止日期提前几个月就公布了。` },
    { en: `This is the index {{inclusion}} effect, and it is one of the rare cases in finance where a very large future order is announced to the whole world.`,
      zh: `这就是指数纳入效应。在金融世界里，一笔巨大的未来订单被公开告知全世界，这种情况相当罕见。` },
    { en: `The size is not trivial.`,
      zh: `规模并不小。` },
    { en: `An index with trillions of dollars tracking it will still move billions of dollars for a {{weight}} of a fraction of one percent.`,
      zh: `一个被数万亿美元跟踪的指数，哪怕权重只有零点几个百分点，也照样能带动几十亿美元的资金。` },
    { en: `Almost none of those buyers think the stock is cheap.`,
      zh: `这些买家当中，几乎没有人认为这只股票便宜。` },
    { en: `They buy because the arithmetic requires it.`,
      zh: `他们买，是因为算术要求他们买。` },
    { en: `The market, however, cannot tell a convinced buyer from an obliged one.`,
      zh: `可是市场分不清谁是真心看好，谁是被迫成交。` },
    { en: `Price is set at the {{marginal}} — by whoever has to trade at that moment.`,
      zh: `价格由边际决定，也就是由那一刻不得不成交的人决定。` },
    { en: `That is the uncomfortable part. A small slice of the market, trading for reasons that have nothing to do with value, can move the price that everyone else uses to measure their wealth.`,
      zh: `这正是让人不安的地方。市场上的一小部分人，出于与价值毫无关系的理由交易，却能推动所有人用来衡量自身财富的那个价格。` },
    { fig: 'orderbook' },
    { en: `Traders noticed this long ago.`,
      zh: `交易员早就察觉了这一点。` },
    { en: `Knowing that a large purchase is coming, they can buy first and sell to the funds later — a practice called {{front-running}} the {{rebalance}}.`,
      zh: `既然知道一大笔买盘要来，他们可以先买，之后再卖给那些基金。这种做法叫抢跑再平衡。` },
    { en: `The result is a visible pattern. Volume piles into the closing {{auction}} on the day of the change, prices often drift up before inclusion, and partly back afterwards.`,
      zh: `结果是一种看得见的规律：调整当天的成交量会挤进收盘集合竞价，价格在纳入前往往被推高，之后又回落一部分。` },
    { en: `Why does the pattern survive, if everyone can see it?`,
      zh: `既然人人都看得见，这个规律为什么还能活着？` },
    { en: `Partly because the trade gets crowded and the advantage is competed away, and partly because the funds cannot opt out.`,
      zh: `一部分原因是这笔交易会变得拥挤，优势被竞争磨掉；另一部分原因是基金没法选择不玩。` },
    { en: `A tracking fund that refuses to trade drifts away from its benchmark, and drift is the one thing it is not allowed to produce.`,
      zh: `一只拒绝交易的跟踪基金，会偏离它的基准，而偏离恰恰是它唯一不被允许产生的东西。` },
    { en: `So the cost is paid quietly, recorded as an {{implementation}} cost inside something called tracking error.`,
      zh: `于是这笔成本被悄悄付掉了，记在“跟踪误差”名下，算作一种执行成本。` },
    { en: `The same machinery runs in reverse when a company is deleted: the {{roster}} changes, and the selling happens whether or not anyone wants to sell.`,
      zh: `同一套机械在剔除时反向运转：名册一变，卖盘就会出现，不管有没有人真的想卖。` },
    { en: `For a student, the useful lesson is not that index funds are bad.`,
      zh: `对学生来说，有用的教训并不是“指数基金不好”。` },
    { en: `It is that an index is a rule, and rules make behaviour {{predictable}}.`,
      zh: `而是：指数是一条规则，而规则会让行为变得可预测。` },
    { en: `Once you can see the rule, you can see the {{distortion}} it creates, and you stop mistaking the plumbing for public opinion.`,
      zh: `一旦你看清了规则，你就能看到它造成的扭曲，也不会再把管道当成民意。` },
    { note: {
        en: 'A price is not a vote. Sometimes it is just the sound of someone who has no choice.',
        zh: '价格不是投票。有时候，它只是某个别无选择的人发出的声音。'
      } }
  ],

    'implementation': { ipa: '/ˌɪmplɪmenˈteɪʃn/', cn: 'n. 实施；执行', ex: 'Implementation costs are hidden inside tracking error.', exZh: '执行成本被藏在跟踪误差里面。' },
    'roster': { ipa: '/ˈrɒstə/', cn: 'n. 名册；成员名单', ex: 'When the roster changes, the flows follow automatically.', exZh: '名册一变，资金流就自动跟着动。' },

/* ---------------------------------------------------------------------------
   2026-11-02 · 机器人 / 触觉与柔顺控制
   --------------------------------------------------------------------------- */
{
  id: '2026-11-02',
  date: '2026-11-02',
  topic: '机器人',
  title: 'The Hardest Part of a Robot Is Its Hand',
  subtitle: 'Legs solved balance with physics. Fingers have to solve contact.',
  level: 'CET-6',
  body: [
    { en: `A robot that can walk across a room is now almost ordinary. A robot that can pick up a key from a table is not.`,
      zh: `一台能走过房间的机器人如今几乎算平常，一台能从桌上捡起一把钥匙的机器人却不算。` },
    { en: `The gap is not about strength or speed. It is about contact.`,
      zh: `差距不在力量或速度，而在接触。` },
    { en: `A walking robot deals with a handful of contact points, and it can plan them in advance.`,
      zh: `行走机器人只需处理少数几个接触点，而且可以提前规划。` },
    { en: `A hand deals with dozens of them, appearing and disappearing hundreds of times a second, and most of them are invisible to the robot.`,
      zh: `一只手要处理几十个接触点，它们每秒出现和消失上百次，而其中大部分对机器人来说是不可见的。` },
    { en: `Humans solve this with skin. A fingertip carries thousands of {{mechanoreceptors}} that report pressure, vibration and {{shear}} — the sideways force that tells you an object is about to slip.`,
      zh: `人类靠皮肤解决这个问题。一个指尖上有数千个机械感受器，报告压力、振动和剪切力——正是那种横向的力告诉你物体即将滑脱。` },
    { en: `No robot hand comes anywhere close to that {{density}}.`,
      zh: `没有哪只机器手接近这种密度。` },
    { en: `Building one is hard for a reason that is rarely stated: sensors and {{actuators}} compete for the same space.`,
      zh: `造出这样一只手很难，原因很少被说明：传感器和执行器在争同一块空间。` },
    { en: `Every millimetre given to a tactile array is a millimetre taken from a motor, a tendon, or the structure that holds them.`,
      zh: `给触觉阵列的每一毫米，都是从电机、腱绳或固定它们的结构那里拿走的。` },
    { en: `The usual compromise is to {{underactuate}}: fewer motors than joints, with the fingers coupled mechanically so that one motor drives several.`,
      zh: `常见的折中是"欠驱动"：电机数量少于关节数量，让手指在机械上耦合，用一个电机驱动好几个关节。` },
    { en: `This is how most prosthetic hands work, and it is why they can grip a cup but not turn a key.`,
      zh: `大多数假手就是这么做的，这也是它们能握住杯子、却拧不动钥匙的原因。` },
    { en: `The control problem is equally awkward.`,
      zh: `控制问题同样棘手。` },
    { en: `Grasping is not a {{trajectory}} to be followed; it is a negotiation with an object whose weight, friction and stiffness are unknown.`,
      zh: `抓取不是一条要跟随的轨迹，而是一场与物体的谈判——而物体的重量、摩擦和刚度都是未知的。` },
    { en: `A controller that is too stiff crushes the object. One that is too soft drops it.`,
      zh: `控制得太硬会捏碎物体，太软则会掉。` },
    { en: `The practical answer is {{compliance}}: build the hand so that it yields slightly, and let the mechanics absorb the uncertainty that the software cannot model.`,
      zh: `实用的答案是"柔顺"：把手造得能微微让步，让机械结构去吸收软件无法建模的不确定性。` },
    { fig: 'grasp' },
    { en: `This is a different philosophy from the one that built most industrial robots, which are deliberately {{rigid}} and carefully kept away from anything they might touch.`,
      zh: `这与造出大多数工业机器人的那套理念不同——那些机器人被刻意做得很刚硬，并被小心地与任何可能碰到的东西隔开。` },
    { en: `The new generation is designed to touch things, which means it must be able to be wrong safely.`,
      zh: `新一代机器人被设计成要去接触物体，这意味着它必须能够安全地犯错。` },
    { en: `Learning has helped, but it has not solved it.`,
      zh: `学习帮上了忙，但并没有解决它。` },
    { en: `A policy trained in simulation can master one specific grasp in one specific simulator, and then fail on a real hand whose tendons stretch by half a millimetre.`,
      zh: `在仿真中训练出来的策略，可以在特定仿真器里精通某一种特定抓取，然后在真实的手上失败——只因为那双手的腱绳会伸长半毫米。` },
    { en: `Tactile {{feedback}} closes part of that gap, because it lets the controller react to what is actually happening rather than to what was predicted.`,
      zh: `触觉反馈弥合了其中一部分差距，因为它让控制器对实际发生的事做出反应，而不是对预测做出反应。` },
    { en: `But it also raises the bar: a control loop that reacts to contact must run at hundreds of hertz, which rules out most of the heavy models now in fashion.`,
      zh: `但它也抬高了门槛：要对接触做出反应的控制回路必须以数百赫兹运行，这就排除了当下流行的多数大模型。` },
    { en: `So the field is moving in two directions at once — richer sensing, and much lighter computation.`,
      zh: `于是这个领域同时在往两个方向走：更丰富的感知，和轻得多的计算。` },
    { en: `For anyone building robots, the lesson is that the interesting {{constraints}} are mechanical before they are algorithmic.`,
      zh: `对造机器人的人来说，教训是：有意思的约束在成为算法问题之前，先是机械问题。` },
    { en: `You can always add another layer of software. You cannot add another millimetre.`,
      zh: `你总能再加一层软件，却没法再加一毫米。` },
    { en: `That is why hands are the bottleneck, and why they will stay interesting for a long time.`,

    { note: {
        en: 'A grip that deforms is not a worse grip. It is a grip that can be wrong by a little and still work.',
        zh: '会变形的抓取不是更差的抓取。它是那种"可以错一点点、但依然能用"的抓取。'
      } }
  ],
  words: {

    'shear': { ipa: '/ʃɪə/', cn: 'n. 剪切力；切变', ex: 'Shear tells your fingers that an object is about to slip.', exZh: '剪切力告诉你的手指：物体即将滑脱。' },
    'density': { ipa: '/ˈdensəti/', cn: 'n. 密度', ex: 'No robot hand comes close to the density of human skin.', exZh: '没有哪只机器手接近人类皮肤的密度。' },
    'actuators': { ipa: '/ˈæktʃueɪtəz/', cn: 'n. 执行器；驱动器（actuator 的复数）', ex: 'Sensors and actuators compete for the same volume.', exZh: '传感器和执行器在争夺同样的体积。' },
    'underactuate': { ipa: '/ˌʌndərˈæktʃueɪt/', cn: 'v. 欠驱动（执行器数量少于自由度）', ex: 'Most prosthetic hands underactuate the fingers to save space.', exZh: '大多数假手为了节省空间而对指头采用欠驱动。' },

/* ---------------------------------------------------------------------------
   2026-11-01 · 前沿科研 / 量子纠错
   --------------------------------------------------------------------------- */
{
  id: '2026-11-01',
  date: '2026-11-01',
  topic: '前沿科研',
  title: 'Making Error the Unit of Measurement',
  subtitle: 'A quantum computer is judged not by how many qubits it has, but by how few mistakes it makes.',
  level: 'CET-6',
  body: [
    { en: `When a quantum computer is announced, the number that gets quoted is almost always the same: the number of qubits.`,
      zh: `每当一台量子计算机被发布，被引用的数字几乎总是同一个：量子比特的数量。` },
    { en: `That number is close to meaningless on its own, and the reason is error.`,
      zh: `单独看，这个数字近乎没有意义，原因就是误差。` },
    { en: `A qubit is not a clean two-state switch. It is a small physical system that {{leaks}}, drifts, and interacts with everything around it.`,
      zh: `量子比特不是干净的二态开关，而是一个会泄漏、会漂移、并和周围一切相互作用的微小物理系统。` },
    { en: `Left alone, a good qubit holds its state for perhaps a few hundred microseconds before the information is gone.`,
      zh: `不加干预的话，一个好的量子比特大约只能维持几百微秒，信息就消失了。` },
    { en: `An algorithm that needs thousands of operations will therefore fail long before it finishes.`,
      zh: `因此，一个需要上千次操作的算法，会在完成之前很早就失败。` },
    { en: `The obvious fix is to make better qubits, and that work continues. But there is a limit to how good a single physical qubit can be.`,
      zh: `显而易见的解法是造更好的量子比特，这项研究也一直在推进。但单个物理量子比特能做到多好，是有上限的。` },
    { en: `The more interesting fix is to stop relying on single qubits at all.`,
      zh: `更有意思的解法，是干脆不再依赖单个量子比特。` },
    { en: `Instead, spread one piece of quantum information across many physical qubits and use their {{redundancy}} to detect and correct errors as they happen.`,
      zh: `转而把一份量子信息分散到许多物理量子比特上，用它们的冗余来在误差发生时检测并纠正。` },
    { en: `The bundle then behaves as a single, far more reliable {{logical qubit}}.`,
      zh: `这一束比特随后就表现得像一个单一、可靠得多的"逻辑量子比特"。` },
    { en: `This is quantum error correction, and it rests on a surprisingly forgiving result called the {{threshold theorem}}.`,
      zh: `这就是量子纠错，它建立在一个出人意料地宽容的结论之上，叫做"阈值定理"。` },
    { fig: 'logical' },
    { en: `The theorem says that if the error rate of each physical operation is below some threshold, adding more qubits makes the logical error rate fall {{exponentially}}.`,
      zh: `该定理指出：只要每次物理操作的错误率低于某个阈值，增加量子比特就能让逻辑错误率指数级下降。` },
    { en: `Below the threshold, more hardware buys accuracy. Above it, more hardware buys nothing.`,
      zh: `在阈值以下，更多硬件换来更高精度；在阈值以上，更多硬件什么也换不到。` },
    { en: `That line between the two {{regimes}} is the number that actually matters.`,
      zh: `两种情形之间的这条线，才是真正重要的那个数字。` },
    { en: `Recent experiments have crossed it. Teams have built logical qubits from tens of physical ones and shown that the error rate falls as the code grows.`,
      zh: `近期的实验已经越过了它。一些团队用几十个物理量子比特构建出逻辑量子比特，并证明随着编码规模扩大，错误率确实下降。` },
    { en: `It is a modest result by the standards of headlines — a logical qubit is still worse than the best single physical qubit.`,
      zh: `按新闻标题的标准，这只是个不起眼的成果——一个逻辑量子比特仍不如最好的单个物理量子比特。` },
    { en: `But it is the first evidence that the {{scaling}} direction is the right one.`,
      zh: `但这是第一个证据，说明扩展的方向是对的。` },
    { en: `The engineering that follows is unglamorous and enormous.`,
      zh: `随之而来的工程既不光鲜，也极其庞大。` },
    { en: `Each logical qubit may eventually need thousands of physical ones, plus the control electronics to {{address}} them, all inside a refrigerator that cools the chip to a fraction of a degree above absolute zero.`,
      zh: `每一个逻辑量子比特最终可能需要成千上万个物理量子比特，再加上寻址用的控制电子设备，全部放进一台把芯片冷却到接近绝对零度几分之一的制冷机里。` },
    { en: `Wiring alone becomes a {{bottleneck}}: every qubit needs signals in, and every wire carries heat in.`,
      zh: `单是布线就成了瓶颈：每个量子比特都需要输入信号，而每根导线都会把热量带进来。` },
    { en: `This is why the field is increasingly a hardware {{discipline}} rather than a physics one.`,
      zh: `这就是为什么这个领域正越来越像一门硬件学科，而不只是物理学。` },
    { en: `The useful question to ask about any quantum claim is therefore not “how many qubits”.`,
      zh: `因此，面对任何量子计算的宣称，该问的问题不是"有多少量子比特"。` },
    { en: `It is: what is the logical error rate, how many physical qubits did it cost, and is that number going down as the system grows?`,
      zh: `而是：逻辑错误率是多少？为此花了多少物理量子比特？随着系统变大，这个数字在下降吗？` },
    { en: `A system that cannot answer those three has not yet demonstrated a computer. It has demonstrated a device.`,
      zh: `回答不了这三个问题的系统，还不能说展示了一台计算机，它只展示了一个器件。` },
    { en: `That distinction is worth keeping, because the gap between a device and a computer is exactly where the next ten years will be spent.`,
      zh: `这个区别值得记住，因为从一个器件到一台计算机之间的那段距离，正是未来十年要花掉的地方。` },
    { note: {
        en: 'A device does something impressive once. A computer does something useful a billion times without being watched.',
        zh: '器件是把一件了不起的事做一次；计算机是把一件有用的事做十亿次，而且不需要人盯着。'
      } }
  ],
  words: {
    'leaks': { ipa: '/liːks/', cn: 'v. 泄漏（leak 的第三人称单数）', ex: 'A qubit leaks information to its environment and loses its state.', exZh: '量子比特会向环境泄漏信息，从而失去自己的状态。' },
    'redundancy': { ipa: '/rɪˈdʌndənsi/', cn: 'n. 冗余', ex: 'Error correction works by adding redundancy, not by removing noise.', exZh: '纠错靠增加冗余来工作，而不是靠消除噪声。' },
    'logical qubit': { ipa: '/ˈlɒdʒɪkl ˈkwɪbɪt/', cn: 'n. 逻辑量子比特（由多个物理量子比特编码而成）', ex: 'One logical qubit may require thousands of physical ones.', exZh: '一个逻辑量子比特可能需要上千个物理量子比特。' },
    'threshold theorem': { ipa: '/ˈθreʃhəʊld ˈθɪərəm/', cn: 'n. 阈值定理', ex: 'The threshold theorem is why error correction is possible at all.', exZh: '阈值定理正是纠错得以可能的原因。' },
    'exponentially': { ipa: '/ˌekspəˈnenʃəli/', cn: 'adv. 指数级地', ex: 'Below the threshold, the error rate falls exponentially as the code grows.', exZh: '在阈值以下，随着编码规模扩大，错误率呈指数级下降。' },
    'regimes': { ipa: '/reɪˈʒiːmz/', cn: 'n. 情形；区间（regime 的复数）', ex: 'The two regimes behave completely differently.', exZh: '这两种情形表现得完全不同。' },
    'scaling': { ipa: '/ˈskeɪlɪŋ/', cn: 'n. 扩展；规模化', ex: 'The experiment is the first evidence that the scaling direction is correct.', exZh: '这个实验是第一个证据，说明扩展的方向是对的。' },
    'address': { ipa: '/əˈdres/', cn: 'v. 寻址；访问', ex: 'The control electronics must address thousands of qubits individually.', exZh: '控制电子设备必须逐个寻址成千上万个量子比特。' },
    'bottleneck': { ipa: '/ˈbɒtlnek/', cn: 'n. 瓶颈', ex: 'Wiring becomes the bottleneck long before the qubits do.', exZh: '早在量子比特成为瓶颈之前，布线就已经是瓶颈了。' },
    'discipline': { ipa: '/ˈdɪsəplɪn/', cn: 'n. 学科；领域', ex: 'The field is turning into a hardware discipline.', exZh: '这个领域正在变成一门硬件学科。' }
  },
  quiz: [
    { q: 'Why is the raw number of qubits a poor measure of a quantum computer?',
      options: ['Because qubits are too expensive.',
                'Because single physical qubits keep making errors, so more qubits does not mean more correct computation.',
                'Because quantum computers do not use qubits.'],
      answer: 1,
      why: '物理量子比特会不断出错，几千次操作里错一次就前功尽弃；数量多不等于算得对。' },
    { q: 'What does the threshold theorem say?',
      options: ['If the error rate per physical operation is below a threshold, adding qubits makes the logical error rate fall exponentially.',
                'The more qubits you have, the more errors you get.',
                'The chip must be kept below a certain temperature.'],
      answer: 0,
      why: '定理的核心：低于阈值时，加大编码规模能让逻辑错误率指数级下降；高于阈值则毫无意义。' },
    { q: 'Which three questions does the author recommend asking about any quantum claim?',
      options: ['Price, size and power consumption.',
                'What is the logical error rate, how many physical qubits did it cost, and is that number falling as the system grows?',
                'How many qubits, what clock speed, and which company built it.'],
      answer: 1,
      why: '文章最后给出的三个问题就是这个，回答不了这三个问题的只能叫器件，不能叫计算机。' }
  ]

/* ---------------------------------------------------------------------------
   2026-10-31 · 生物医药 / 碱基编辑
   --------------------------------------------------------------------------- */
{
  id: '2026-10-31',
  date: '2026-10-31',
  topic: '生物医药',
  title: 'Editing One Letter at a Time',
  subtitle: 'The newer gene editors no longer cut the DNA. They rewrite it.',
  level: 'CET-6',
  body: [
    { en: `CRISPR is usually described as molecular scissors, and for the first version of the technology that image is accurate.`,
      zh: `CRISPR 通常被形容为分子剪刀，对这项技术的第一代而言，这个比喻是准确的。` },
    { en: `The Cas9 protein cuts both strands of DNA at a chosen site, and the cell then repairs the break.`,
      zh: `Cas9 蛋白在选定的位置把 DNA 的双链切断，随后由细胞来修复这个断裂。` },
    { en: `The repair is not always neat. Cells often close the gap by deleting or inserting a few letters, which is useful for turning a gene off but useless for correcting a typo.`,
      zh: `修复并不总是整齐的。细胞常常靠删掉或插入几个字母来弥合缺口——这对关掉一个基因有用，对改正一个错字却没用。` },
    { en: `A newer class of tools avoids the cut altogether.`,
      zh: `更新的一类工具干脆避开了"切"这一步。` },
    { en: `These are called base editors, and their target is not a strand of DNA but a single letter within it.`,
      zh: `它们叫碱基编辑器，目标不是一段 DNA 链，而是链中的一个字母。` },
    { en: `The design is a {{hybrid}}: a Cas9 protein modified so that it can only {{nick}} one strand, fused to an enzyme that chemically converts one base into another.`,
      zh: `这套设计是一种杂合体：一个被改造过、只能切开单链的 Cas9 蛋白，与一种能把一种碱基化学转化为另一种的酶融合在一起。` },
    { en: `One common version turns a C into a T. Another turns an A into a G.`,
      zh: `常见的版本之一把 C 变成 T，另一种把 A 变成 G。` },
    { en: `Since C pairs with G and A pairs with T, changing one letter on one strand quietly changes its partner too.`,
      zh: `因为 C 与 G 配对、A 与 T 配对，改变一条链上的一个字母，也就同时改变了它的搭档。` },
    { en: `The cell's own repair machinery then accepts the new pair as if nothing had happened.`,
      zh: `细胞自身的修复机制随后会接受这个新配对，仿佛什么都没发生过。` },
    { fig: 'baseedit' },
    { en: `The advantage is {{precision}}. Because the double strand stays intact, the cell never enters the error-prone repair pathway that produces unwanted insertions and deletions.`,
      zh: `优势在于精确。因为双链始终完整，细胞不会进入那个容易出错的修复通路——正是它带来了不受欢迎的插入和缺失。` },
    { en: `In lab comparisons, base editors produce far fewer of those {{by-products}} than standard Cas9.`,
      zh: `在实验室对比中，碱基编辑器产生的这类副产物远少于标准 Cas9。` },
    { en: `That matters for medicine, where an {{unintended}} edit in the wrong cell can become a cancer decades later.`,
      zh: `这对医学很重要：在错误的细胞里发生一次非预期编辑，可能在几十年后变成癌症。` },
    { en: `One base editor has already been approved for treating a blood disorder, and several others are in trials.`,
      zh: `已有一款碱基编辑器获批用于治疗一种血液疾病，另有多款正在临床试验中。` },
    { en: `But the approach has clear limits, and they are worth stating plainly.`,
      zh: `但这条路有明显的边界，值得说清楚。` },
    { en: `It can change one letter into another; it cannot {{insert}} a missing gene or delete a long stretch of DNA.`,
      zh: `它能把一个字母换成另一个，却无法插入一个缺失的基因，也无法删掉一段长 DNA。` },
    { en: `The editing window is narrow — only a few bases around the target site can be reached, which {{constrains}} where the tool can be aimed.`,
      zh: `编辑窗口很窄——只有靶点周围几个碱基能够被触及，这限制了它能瞄准的位置。` },
    { en: `And the hardest problem is not editing at all. It is {{delivery}}: getting the editor into the right organ, in enough cells, without triggering an immune response.`,
      zh: `而最难的问题根本不是编辑本身，而是递送：把编辑器送进正确的器官、足够多的细胞里，同时不引发免疫反应。` },
    { en: `Most current programmes therefore focus on tissues that are easy to reach, such as blood and the liver.`,
      zh: `因此目前大多数项目都聚焦在容易到达的组织上，比如血液和肝脏。` },
    { en: `The broader lesson is about how a field matures.`,
      zh: `更广义的启示，是关于一个领域如何成熟。` },
    { en: `The first version of a tool is celebrated for what it can do. The second version is judged by what it stops doing wrong.`,
      zh: `工具的第一代因它能做什么而受到称赞，第二代则以它不再做错什么来被评判。` },
    { en: `Base editing is that second version: less dramatic, more useful.`,
      zh: `碱基编辑就是那个第二代：不那么轰动，却更有用。` },
    { en: `It also shows how much of biology is still engineering.`,
      zh: `它也说明，生物学中有多大一部分其实仍是工程问题。` },
    { en: `A protein is a machine with {{tolerances}}. Change its shape slightly and it stops working, or starts working somewhere else.`,
      zh: `蛋白质是一台有公差的机器。稍微改变它的形状，它就会失灵，或者在别的地方开始起作用。` },
    { en: `The people who build these tools spend most of their time on the boring parts: making them smaller, more {{specific}}, easier to deliver.`,
      zh: `制造这些工具的人，大部分时间都花在无聊的部分上：让它们更小、更专一、更容易递送。` },
    { en: `That is where the next decade of progress will come from.`,
      zh: `未来十年的进展正来自这里。` },
    { note: {
        en: 'The first generation of a tool is judged by what it can do. The second is judged by what it no longer gets wrong.',
        zh: '第一代工具因"能做什么"被评价，第二代则因"不再做错什么"被评价。'
      } }
  ],
  words: {
    'hybrid': { ipa: '/ˈhaɪbrɪd/', cn: 'n. 杂合体；混合体', ex: 'The tool is a hybrid of a DNA-binding protein and an enzyme.', exZh: '这个工具是 DNA 结合蛋白与一种酶的杂合体。' },
    'nick': { ipa: '/nɪk/', cn: 'v. 切开单链；造成切口', ex: 'The modified enzyme can only nick one strand, not cut both.', exZh: '改造后的酶只能切开一条链，而不能把两条都切断。' },
    'precision': { ipa: '/prɪˈsɪʒn/', cn: 'n. 精确度', ex: 'The advantage of base editing lies in its precision.', exZh: '碱基编辑的优势在于它的精确度。' },
    'by-products': { ipa: '/ˈbaɪ prɒdʌkts/', cn: 'n. 副产物', ex: 'Unwanted by-products are the main safety concern in gene editing.', exZh: '不需要的副产物是基因编辑中的主要安全隐患。' },
    'unintended': { ipa: '/ˌʌnɪnˈtendɪd/', cn: 'adj. 非预期的；意外的', ex: 'An unintended edit in a healthy cell can be dangerous.', exZh: '在健康细胞中发生非预期编辑可能很危险。' },
    'insert': { ipa: '/ɪnˈsɜːt/', cn: 'v. 插入', ex: 'Base editors cannot insert a whole new gene.', exZh: '碱基编辑器无法插入一个全新的基因。' },
    'constrains': { ipa: '/kənˈstreɪnz/', cn: 'v. 限制；约束（constrain 的第三人称单数）', ex: 'A narrow editing window constrains where the tool can be aimed.', exZh: '狭窄的编辑窗口限制了工具能瞄准的位置。' },
    'delivery': { ipa: '/dɪˈlɪvəri/', cn: 'n. 递送；投递', ex: 'Delivery, not editing, is the hardest problem in gene therapy.', exZh: '基因治疗中最难的问题是递送，而不是编辑。' },
    'tolerances': { ipa: '/ˈtɒlərənsɪz/', cn: 'n. 公差；容差（tolerance 的复数）', ex: 'A protein works only within narrow mechanical tolerances.', exZh: '蛋白质只在很窄的机械公差内才能工作。' },
    'specific': { ipa: '/spəˈsɪfɪk/', cn: 'adj. 专一的；特异的', ex: 'The editor must be specific enough to hit only one site.', exZh: '编辑器必须足够专一，只命中一个位点。' }
  },
  quiz: [
    { q: 'What is the key difference between a base editor and standard Cas9?',
      options: ['A base editor does not use a Cas protein at all.',
                'A base editor nicks only one strand, so there is no double-strand break.',
                'A base editor can insert a whole gene.'],
      answer: 1,
      why: '碱基编辑器用的是被改造过、只能切单链的 Cas9，因此不会产生双链断裂，也就绕开了容易出错的修复通路。' },
    { q: 'According to the passage, what is the hardest remaining problem?',
      options: ['Editing precision.', 'Delivery — getting the editor into the right organ and enough cells.', 'The cost of sequencing.'],
      answer: 1,
      why: '原文明确："the hardest problem is not editing at all. It is delivery"。' },
    { q: 'What does the author mean by “the second version”?',
      options: ['A version judged by what it stops doing wrong rather than by what it can do.',
                'A cheaper version of the same tool.',
                'A version that has been abandoned.'],
      answer: 0,

/* ---------------------------------------------------------------------------
   2026-10-30 · 科技硬件 / 先进封装

{
  id: '2026-10-30',
  date: '2026-10-30',
  topic: '科技硬件',
  title: 'Why a Chip Is Starting to Look Like a Building',
  subtitle: 'The performance race has moved from the transistor to the space between them.',
  level: 'CET-6',
  body: [
    { en: `For fifty years, the promise of computing was simple: shrink the transistor, and everything gets faster.`,
      zh: `五十年来，计算的承诺一直很简单：把晶体管做小，一切就会变快。` },
    { en: `That promise is now harder to keep. Making a transistor smaller still works, but the gains are no longer free.`,
      zh: `这个承诺如今越来越难兑现。把晶体管做小仍然可行，但收益不再是免费的。` },
    { en: `The reason is that a modern chip is limited less by how fast it computes than by how fast it can be {{fed}}.`,
      zh: `原因在于，现代芯片的瓶颈已不在于算得多快，而在于它被"喂"数据的速度。` },
    { en: `A processor can finish an operation in a fraction of a {{nanosecond}}, yet waiting for data from memory may cost a hundred times more.`,
      zh: `一个处理器可以在几分之一纳秒内完成一次运算，但等待内存送来的数据可能要贵上一百倍。` },
    { en: `For decades, engineers solved this by putting more memory on the same piece of silicon.`,
      zh: `几十年来，工程师的解法是把更多内存放到同一块硅片上。` },
    { en: `That has run into a wall: a single large die is expensive to manufacture, and one tiny defect can ruin the whole thing.`,
      zh: `但这条路撞墙了：一整块大芯片制造成本极高，一个微小的缺陷就能毁掉整片。` },
    { en: `So the industry changed the question. Instead of building one big chip, it now builds several smaller ones and connects them.`,
      zh: `于是业界换了个问法。不再造一块大芯片，而是造几块小的，再把它们连起来。` },
    { en: `These pieces are called {{chiplets}}, and the technique is called advanced {{packaging}}.`,
      zh: `这些小块叫"芯粒"，这项技术叫先进封装。` },
    { en: `The word “packaging” sounds humble, like the box a product arrives in.`,
      zh: `"封装"这个词听起来很朴素，像是产品到手时的那个盒子。` },
    { en: `In reality it is now where much of the engineering happens.`,
      zh: `可实际上，如今大量的工程工作就发生在这里。` },
    { fig: 'package' },
    { en: `The chips sit on a thin {{interposer}} — a silicon bridge that carries thousands of tiny wires between them.`,
      zh: `这些芯片坐在一层薄薄的中介层上——一座硅桥，在它们之间承载成千上万根细微导线。` },
    { en: `Beside the processor, memory is stacked in towers called {{HBM}}, each layer joined by vertical connections that pass straight through the silicon.`,
      zh: `处理器旁边，内存被堆成一座座塔，称为 HBM，每一层都通过直接穿过硅片的垂直连接相连。` },
    { en: `A stack of eight layers can move data over a {{bus}} a thousand times wider than a conventional one, at a fraction of the energy per bit.`,
      zh: `一个八层堆栈能通过比传统通道宽上千倍的总线搬运数据，而每比特的能耗只有一小部分。` },
    { en: `This is why the fastest AI accelerators are enormous: not because the logic is huge, but because the memory has to be close.`,
      zh: `这就是为什么最快的 AI 加速器体积极大：不是因为逻辑部分大，而是因为内存必须靠近。` },
    { en: `The cost is that almost nothing about it is easy.`,
      zh: `代价是，这件事几乎没有一处是容易的。` },
    { en: `Every wire must be aligned to within a few micrometres, and any {{warpage}} in the stack can break the connection.`,
      zh: `每一根导线都必须对准到几微米以内，堆栈里任何一点翘曲都可能让连接失效。` },
    { en: `Heat is worse. Eight layers of memory packed together cannot cool themselves the way separate chips could.`,
      zh: `散热更糟。八层内存挤在一起，没法像分开的芯片那样自行散热。` },
    { en: `And {{yield}} becomes a gamble: if one chiplet in a package fails, the whole package may be {{scrap}}.`,
      zh: `良率也成了一场赌博：如果封装里有一颗芯粒失效，整个封装可能就报废了。` },
    { en: `Manufacturers respond by testing each chiplet before assembly, and by designing packages that can lose one piece and still work.`,
      zh: `厂商的应对是：在组装前逐颗测试芯粒，并设计出即使损失一块仍能工作的封装。` },
    { en: `None of this is visible to the person using a phone.`,
      zh: `这一切对使用手机的人来说都不可见。` },
    { en: `What is visible is the consequence: performance now improves in steps, tied to new packaging generations rather than to a steady yearly shrink.`,
      zh: `可见的是后果：性能如今以台阶式提升，绑定在封装的新世代上，而不是每年稳定地缩小。` },
    { en: `That changes what a “generation” means. It is less a number on a transistor and more an architecture of connections.`,
      zh: `这也改变了"一代"的含义。它不再是晶体管上的一个数字，而更像一种连接的结构。` },
    { en: `For students, it is a useful correction to a common assumption.`,
      zh: `对学生来说，这是对一个常见假设的有益纠正。` },
    { en: `The interesting problems in computing are no longer only in the transistor. They are in the wires, the heat, and the mechanical {{tolerance}} between pieces.`,
      zh: `计算中有趣的问题不再只存在于晶体管里。它们在导线里、在热量里、在零件之间的机械公差里。` },
    { en: `That is materials science, mechanical engineering and physics as much as it is electronics.`,
      zh: `这既属于电子学，也同样属于材料科学、机械工程和物理。` },
    { en: `Which means the field is more open than it looks.`,
      zh: `这意味着这个领域比看上去更开放。` },
    { note: {
        en: 'The bottleneck moved from “how small can we draw it” to “how close can we put it” — and closeness is a mechanical problem.',
        zh: '瓶颈从"能画多小"变成了"能放多近"——而"近"是一个机械问题。'
      } }
  ],

    'packaging': { ipa: '/ˈpækɪdʒɪŋ/', cn: 'n. 封装（把多颗芯片组装互连的工艺）', ex: 'Advanced packaging is now as important as the transistor itself.', exZh: '先进封装如今和晶体管本身一样重要。' },
    'interposer': { ipa: '/ˌɪntəˈpəʊzə/', cn: 'n. 中介层（芯片之间的硅转接板）', ex: 'The interposer carries the wires that connect the dies.', exZh: '中介层承载着连接各芯片的导线。' },
    'HBM': { ipa: '/ˌeɪtʃ biː ˈem/', cn: 'n. 高带宽内存（High Bandwidth Memory）', ex: 'Each HBM stack holds eight memory layers.', exZh: '每个 HBM 堆栈包含八层内存。' },
    'bus': { ipa: '/bʌs/', cn: 'n. 总线（数据传输通道）', ex: 'A wider bus moves more data in the same clock cycle.', exZh: '更宽的总线在同一时钟周期内搬运更多数据。' },
    'warpage': { ipa: '/ˈwɔːpɪdʒ/', cn: 'n. 翘曲；变形', ex: 'Even a slight warpage breaks the finest connections.', exZh: '即使轻微的翘曲也会让最细的连接断裂。' },
    'yield': { ipa: '/jiːld/', cn: 'n. 良率；成品率', ex: 'A single bad die can lower the yield of the whole batch.', exZh: '一颗坏芯片就能拉低整批的良率。' },
    'scrap': { ipa: '/skræp/', cn: 'n. 废品；报废', ex: 'If one part fails, the entire package becomes scrap.', exZh: '只要一个部件失效，整个封装就成了废品。' },
    'tolerance': { ipa: '/ˈtɒlərəns/', cn: 'n. 公差；容差', ex: 'The parts must be placed within a tolerance of a few micrometres.', exZh: '这些部件必须放置在几微米的公差之内。' }
  },
  quiz: [

      options: ['Because the logic circuits themselves are enormous.',
                'Because memory has to sit close to the processor, so it is stacked beside it on the same package.',
                'Because they need very large cooling fans.'],

   ① 2026-10-29  AI 大模型（示范推文 · 约 500 词 · 10 分钟）

{
  id: '2026-10-29',
  date: '2026-10-29',
  topic: 'AI 大模型',
  title: 'The Model That Fits in Your Pocket',
  subtitle: 'Why the most interesting race in AI is no longer about size.',
  level: 'CET-6',
  body: [
    { en: `For years, the story of artificial intelligence was a story about {{scale}}: bigger models, bigger {{clusters}}, bigger electricity bills.`,
      zh: `多年来，人工智能的故事一直是一个关于规模的故事：更大的模型、更大的集群、更高的电费。` },
    { en: `That story is now being rewritten — not by the largest labs, but by engineers who are trying to make a model small enough to run on a phone.`,
      zh: `而如今，这个故事正在被改写——改写者不是最大的实验室，而是那些努力让模型小到可以跑在手机上的工程师。` },
    { en: `A large language model is, at its core, a very long list of numbers called {{parameters}}.`,
      zh: `从本质上说，大语言模型就是一长串被称为"参数"的数字。` },
    { en: `A frontier model may hold hundreds of billions of them, and every word it generates requires a small {{fraction}} of that list to be read.`,
      zh: `一个前沿模型可能拥有数千亿个参数，而它每生成一个词，都需要读取其中一小部分。` },
    { en: `This is why {{inference}} — using a trained model, rather than training it — is so expensive.`,
      zh: `这就是为什么"推理"——即使用一个已经训练好的模型，而不是训练它——如此昂贵。` },
    { en: `Training happens once; inference happens billions of times a day, and each time the hardware must move an enormous amount of data from memory to the processor.`,
      zh: `训练只发生一次；推理每天发生数十亿次，而每一次硬件都必须把海量数据从内存搬运到处理器。` },
    { en: `On a server this is merely costly. On a phone it becomes a {{bottleneck}}, because memory {{bandwidth}} and battery life are fixed.`,
      zh: `在服务器上，这仅仅是成本问题。在手机上，它却成了一个瓶颈，因为内存带宽和电池续航都是固定的。` },
    { en: `Engineers have therefore attacked the problem from two directions.`,
      zh: `因此，工程师从两个方向着手解决这个问题。` },
    { en: `The first is {{quantization}}, which stores each parameter in fewer bits — often eight instead of sixteen, sometimes four.`,
      zh: `第一种是"量化"，即用更少的比特来存储每个参数——通常是 8 位而不是 16 位，有时甚至只有 4 位。` },
    { en: `The model shrinks to roughly a quarter of its original size, and on most tasks the loss in accuracy is {{negligible}}.`,
      zh: `模型的体积大约缩减到原来的四分之一，而在大多数任务上，精度的损失微乎其微。` },
    { fig: 'precision' },
    { en: `The second is {{distillation}}, in which a small model is trained to imitate the answers of a much larger one.`,
      zh: `第二种是"蒸馏"，即训练一个小模型去模仿一个大得多的模型的回答。` },
    { en: `The student never sees the teacher's internal machinery; it learns only from the teacher's output.`,
      zh: `学生模型从不接触教师模型的内部机制，它只从教师的输出中学习。` },
    { en: `Neither technique is free.`,
      zh: `这两种技术都不是没有代价的。` },
    { en: `Quantization trades precision for memory, distillation trades capacity for speed, and each involves a {{trade-off}} that has to be measured rather than assumed.`,
      zh: `量化用精度换内存，蒸馏用容量换速度，而每一种都涉及一种必须实测而非假定的取舍。` },
    { en: `The results are already visible to ordinary users.`,
      zh: `这些成果对普通用户来说已经可见。` },
    { en: `Phone keyboards now suggest whole sentences offline, cameras identify plants without a network connection, and translation apps work in airplane mode.`,
      zh: `手机键盘如今可以离线联想整句，相机无需联网就能识别植物，翻译应用在飞行模式下也能工作。` },
    { en: `In each case a model that once needed a data centre now runs in a few hundred megabytes of memory.`,
      zh: `在每一个例子中，曾经需要数据中心才能运行的模型，如今只占用几百兆内存。` },
    { en: `The engineering consequences reach further than convenience.`,
      zh: `这些工程后果的影响，远超"方便"本身。` },
    { en: `On-device models {{preserve}} privacy, because the data never leaves the phone.`,
      zh: `端侧模型保护隐私，因为数据从不离开手机。` },
    { en: `They remove {{latency}}, because no request has to travel to a distant server and back.`,
      zh: `它们消除了延迟，因为请求无需往返于遥远的服务器。` },
    { en: `And they fail gracefully: a small model that runs at all is more useful than a brilliant one that cannot connect.`,
      zh: `而且它们的失效方式很温和：一个至少还能运行的小模型，胜过一个无法联网的卓越模型。` },
    { en: `None of this means that scale has stopped mattering.`,
      zh: `这一切都不意味着规模已经不重要了。` },
    { en: `The hardest problems — long {{reasoning}} chains, reliable code generation, genuinely new mathematics — still belong to the largest systems.`,
      zh: `最困难的问题——长链推理、可靠的代码生成、真正新颖的数学——仍然属于最大的那些系统。` },
    { en: `What has changed is the {{assumption}} that every useful model must live in the cloud.`,
      zh: `真正改变的是那个假设：每一个有用的模型都必须住在云端。` },
    { en: `A more plausible future is a {{division of labour}}.`,
      zh: `一个更可信的未来是分工。` },
    { en: `The small model handles what is routine, private and urgent; the large one is called only when a task exceeds the local {{threshold}}.`,
      zh: `小模型处理常规的、私密的、紧急的任务；只有当任务超出本地的阈值时，才会去调用大模型。` },
    { en: `The phone becomes a filter rather than a {{terminal}}, deciding what deserves to be sent away.`,
      zh: `手机变成了一个过滤器，而不是一个终端，它决定什么才值得被发送出去。` },
    { fig: 'route' },
    { en: `For students learning the technology, this shift is encouraging.`,
      zh: `对学习这门技术的学生来说，这种转变是令人鼓舞的。` },
    { en: `You no longer need a whole cluster of graphics cards to experiment with real models; a single consumer GPU, a laptop, or even a phone is enough to see how the ideas behave.`,
      zh: `你不再需要一整套显卡才能试验真实的模型；一块消费级显卡、一台笔记本，甚至一部手机，就足以让你看到这些想法是如何运作的。` },
    { en: `The centre of gravity of the field is moving from who can afford the biggest model to who can make the smallest one work well.`,
      zh: `这个领域的重心，正在从"谁负担得起最大的模型"转向"谁能让最小的模型好好工作"。` },
    { en: `That is a race a small team can still enter.`,
      zh: `这是一场小团队仍然能够参与的比赛。` },
    { note: {
        en: 'A 4-bit 7B model takes roughly 4 GB of memory — which means an 8 GB laptop GPU is already a legitimate research platform, not a toy.',
        zh: '一个 4-bit 量化的 7B 模型大约只占 4GB 显存——也就是说，一块 8GB 的笔记本显卡已经可以当作正经的实验平台，而不是玩具。'
      } }
  ],

/* ============================================================================
   §6  状态与工具函数
   ========================================================================== */

/* --- localStorage 读写（前缀 dr.，清缓存即清数据） --- */
const DB = {
  get(k, def){
    try{ const v = localStorage.getItem('dr.' + k); return v === null ? def : JSON.parse(v); }
    catch(e){ return def; }
  },
  set(k, v){
    try{ localStorage.setItem('dr.' + k, JSON.stringify(v)); }catch(e){}
  },
  clearAll(){
    Object.keys(localStorage).filter(k => k.indexOf('dr.') === 0).forEach(k => localStorage.removeItem(k));
  }
};

const state = {
  view: 'read',
  current: ARTICLES[0].id,
  mode: DB.get('mode', 'both'),          // both | en
  font: DB.get('font', 19),
  theme: DB.get('theme', 'auto'),        // auto | light | dark
  readIds: DB.get('readIds', []),        // 已读文章 id
  logDays: DB.get('logDays', []),        // 学习过的日期（打卡）
  mastered: DB.get('mastered', []),      // 已掌握单词
  wbDate: 'all',
  wbShuffle: false,
  wbHide: DB.get('wbHide', false),
  order: null,
  quizPicked: {},                        // 当前文章的作答记录
  quizShown: false
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

/* 去掉 {{}} 标记，得到纯文本（统计词数、朗读用） */
const plain = s => s.replace(/\{\{([^}]+)\}\}/g, '$1');
/* 把 {{word}} 转成可点击的加粗下划线标签 */
const mark  = s => s.replace(/\{\{([^}]+)\}\}/g, (m, w) => `<b class="w" data-w="${w}" tabindex="0">${w}</b>`);

const todayStr = () => {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};

const getArticle = id => ARTICLES.find(a => a.id === id) || ARTICLES[0];
const wordCount = a => a.body.filter(s => s.en)
  .reduce((n, s) => n + plain(s.en).split(/\s+/).filter(Boolean).length, 0);
const readMinutes = a => Math.max(1, Math.round(wordCount(a) / CONFIG.wordsPerMinute));

/* 插图 / 说明卡：正文数组里的非句子元素 */
const figHTML = id => {
  const f = FIGURES[id];
  if (!f) return '';
  return `<figure class="fig">
    <div class="fig-head"><b>${f.head}</b><span>${f.note || ''}</span></div>
    <div class="fig-scroll">${f.svg}</div>
    <figcaption class="fig-cap">${f.caption}</figcaption>
  </figure>`;
};
const noteHTML = n => `<aside class="callout">
    <p class="cl">Why it matters</p>
    <p class="ce">${n.en}</p>
    <p class="cz">${n.zh}</p>
  </aside>`;

/* 朗读队列：只取真正的句子，跳过插图与说明卡 */
const speakQueue = a => a.body
  .map((s, i) => s.en ? { text: plain(s.en), el: $('.sent[data-i="' + i + '"]') } : null)
  .filter(Boolean);

/* 全站重点词聚合（同一个词出现在多篇文章里会合并，保留最近一次释义） */
function allWords(){
  const map = new Map();
  ARTICLES.forEach(a => {
    Object.keys(a.words).forEach(w => {
      const k = w.toLowerCase();
      if (!map.has(k)) map.set(k, Object.assign({ word: w, dates: [a.date] }, a.words[w]));
      else { const o = map.get(k); if (!o.dates.includes(a.date)) o.dates.push(a.date); }
    });
  });
  return Array.from(map.values()).sort((x, y) => x.word.localeCompare(y.word));
}

/* 连续学习天数 */
function streak(){
  if (!state.logDays.length) return 0;
  const set = new Set(state.logDays);
  const back = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() - n); 
    const p = v => String(v).padStart(2, '0');
    return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`; };
  let cursor = todayStr();
  if (!set.has(cursor)){
    cursor = back(cursor, 1);
    if (!set.has(cursor)) return 0;
  }
  let n = 0;
  while (set.has(cursor)) { n++; cursor = back(cursor, 1); }
  return n;
}

/* --- 主题 --- */
function applyTheme(){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const real = state.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : state.theme;
  document.documentElement.dataset.theme = real;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', real === 'dark' ? '#0e0f11' : '#faf9f6');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (state.theme === 'auto') applyTheme();
});

/* --- 朗读（Web Speech API） --- */
const TTS = {
  token: 0,
  voice: null,
  ready(){
    if (!('speechSynthesis' in window)) return false;
    const vs = speechSynthesis.getVoices();
    this.voice = vs.find(v => /en-US/i.test(v.lang) && /Google|Samantha|Jenny|Aria|Microsoft/i.test(v.name))
               || vs.find(v => /^en/i.test(v.lang)) || null;
    return true;
  },
  stop(){
    this.token++;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    $$('.sent.now').forEach(e => e.classList.remove('now'));
    const b = $('#btnSpeakAll');
    if (b) { b.classList.remove('on'); b.dataset.on = ''; b.querySelector('.txt').textContent = '朗读全文'; }
  },
  play(list){
    if (!this.ready()) { alert('当前浏览器不支持语音朗读，建议使用 Chrome / Edge。'); return; }
    const token = ++this.token;
    speechSynthesis.cancel();   // 先掐掉上一条，避免排队叠加
    let i = 0;
    const step = () => {
      if (token !== this.token) return;
      if (i >= list.length) { this.stop(); return; }
      const item = list[i];
      $$('.sent.now').forEach(e => e.classList.remove('now'));
      if (item.el) {
        item.el.classList.add('now');
        const r = item.el.getBoundingClientRect();
        if (r.top < 70 || r.bottom > window.innerHeight - 90)
          item.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      const u = new SpeechSynthesisUtterance(item.text);
      u.lang = 'en-US';
      u.rate = 0.93;
      if (this.voice) u.voice = this.voice;
      u.onend = () => { i++; setTimeout(step, 80); };
      u.onerror = () => { if (token === this.token) this.stop(); };
      speechSynthesis.speak(u);
    };
    step();
  }
};
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => TTS.ready();
