{
  id: '2026-11-07',
  date: '2026-11-07',
  topic: '机器人自动化',
  title: 'A Thousand Robots, One Narrow Aisle',
  subtitle: 'Inside a warehouse the hard part is not picking. It is traffic.',
  level: 'CET-6',
  body: [
    { en: `In a modern warehouse, the person who picks your order rarely walks anywhere.`,
      zh: `在现代仓库里，替你拣货的那个人几乎不用走动。` },
    { en: `A low robot slides under a shelf, lifts it, and carries the whole thing to a waiting station.`,
      zh: `一台矮矮的机器人钻到货架底下，把货架顶起来，整个搬到等在那里的工位上。` },
    { en: `This is called goods-to-person, and it removed the largest single waste in the old warehouse: walking.`,
      zh: `这被称作“货到人”，它去掉了旧仓库里最大的一项浪费——走动。` },
    { en: `A single robot is a simple machine.`,
      zh: `单台机器人只是一台简单的机器。` },
    { en: `A {{fleet}} of a thousand of them is a traffic problem.`,
      zh: `上千台的{{车队}}就是一个交通问题了。` },
    { en: `The floor is mapped as a {{grid}} of square cells, each large enough for exactly one robot.`,
      zh: `仓库地面被映射成一张方格的{{网格}}，每一格刚好只够站一台机器人。` },
    { en: `Every robot knows its own cell, and no cell may hold two robots at the same moment.`,
      zh: `每台机器人都知道自己站在哪一格，而任何一格在同一时刻都不能容纳两台。` },
    { en: `That one rule produces everything that follows.`,
      zh: `后面所有麻烦，都由这一条规则生出来。` },
    { en: `If two robots choose the same cell, one of them must stop, or there is a {{collision}}.`,
      zh: `如果两台机器人同时选中同一格，其中一台必须停下，否则就是一次{{碰撞}}。` },
    { en: `Neither event is rare; with hundreds of robots, {{congestion}} appears even though no single robot is slow.`,
      zh: `这两种情况都不罕见：几百台机器人一起跑，即便没有一台是慢的，{{拥堵}}也会自己长出来。` },
    { en: `The obvious fix is one central computer that plans every route at once.`,
      zh: `最直觉的解法是一台中央计算机，一次性把所有路线都规划好。` },
    { en: `It works on a small floor, and then it becomes a {{bottleneck}}: one machine must answer thousands of questions a second, and if it fails, the whole floor stops.`,
      zh: `在小场地上它行得通，再大就变成一个{{瓶颈}}：一台机器每秒要回答几千个问题，而它一旦出问题，整片地面就停摆。` },
    { en: `So almost every real system is {{decentralized}}.`,
      zh: `所以现实中几乎每一个系统都是{{去中心化}}的。` },
    { en: `Each robot plans its own short path, then asks its neighbours for permission to enter the next cell.`,
      zh: `每台机器人只规划自己眼前的一小段路，然后向旁边的机器人申请进入下一格的许可。` },
    { en: `Permission is a {{reservation}} that expires in a fraction of a second, so a robot that stalls cannot block the floor forever.`,
      zh: `这种许可是一个零点几秒就失效的{{预留}}，于是一台卡住的机器人没法永久占住地面。` },
    { en: `Four robots can each wait for the cell held by the next, forming a ring in which nobody ever moves; this is {{deadlock}}.`,
      zh: `四台机器人可以各自等着下一台占着的那一格，围成一个谁都动不了的圈——这就是{{死锁}}。` },
    { en: `The cure is not a smarter robot but a rule: every robot carries a {{priority}}, and the lowest one backs out of the way.`,
      zh: `解法不是造一台更聪明的机器人，而是一条规则：每台机器人带一个{{优先级}}，最低的那台倒车让路。` },
    { note: {
        en: 'A warehouse floor is often drawn as a chessboard. On a diagram two pieces may share a square; in motion they may not share it in time.',
        zh: '仓库地面常被画成一张棋盘。在图里，两枚棋子可以画在同一格上；运动起来，它们却不能在同一时刻占同一格。'
      } },
    { en: `Engineers borrow more from road design than from robotics.`,
      zh: `工程师从这里借来的东西，更多属于道路设计，而不是机器人学。` },
    { en: `Some {{aisle}}s run one way only, turns are taken on a fixed side, and busy junctions are treated like intersections with a light.`,
      zh: `有些{{通道}}只准单向通行，转弯一律走固定的一侧，繁忙的路口则按有信号灯的路口来管。` },
    { en: `A short queue at a junction costs less than two robots arguing over it.`,
      zh: `在路口排一小会儿队，比让两台机器人就地争执要划算。` },
    { en: `What a warehouse really sells is {{throughput}}: shelves delivered per hour, not the top speed of one machine.`,
      zh: `仓库真正卖出去的东西是{{吞吐量}}：每小时送到多少货架，而不是某一台机器的最高时速。` },
    { en: `A fleet tuned for the fastest individual robot will jam, while a fleet tuned for steady flow will keep earning.`,
      zh: `按“单台最快”去调的车队会堵死，按“稳定流动”去调的车队才能一直挣钱。` },
    { en: `There is also the quiet constraint of power.`,
      zh: `还有一个不太起眼的约束：电。` },
    { en: `A robot that runs out of charge in the middle of an {{aisle}} becomes an obstacle, so charging is scheduled like any other trip.`,
      zh: `一台在{{通道}}中间没电的机器人就变成了障碍物，所以去充电也要像出车一样被排进日程。` },
    { en: `Mathematically this is multi-agent path finding, and the general version is hard enough that no exact method survives a thousand agents.`,
      zh: `在数学上，这是多智能体寻路问题；它的一般形式难到没有任何精确算法能撑住一千个智能体。` },
    { en: `So the industry settles for good enough: local rules, a short lookahead, and constant repair.`,
      zh: `于是这个行业退而求其次，只要“够用”：局部规则、很短的预判，加上不停地修补。` },
    { en: `The intelligence of such a warehouse is not located in any robot.`,
      zh: `这样一座仓库的智能，并不住在任何一台机器人身上。` },
    { en: `It lives in the rules they all obey, and that is why adding one more robot is easy while adding one more rule is not.`,
      zh: `它住在所有机器人共同遵守的规则里——这就是为什么再加一台机器人很容易，再加一条规则却很难。` }
  ],
  words: {
    'fleet': { ipa: '/fliːt/', cn: 'n. 车队；船队；（此处）机器人集群', ex: 'The fleet of robots is coordinated by local rules rather than a single controller.', exZh: '这支机器人车队靠局部规则协同，而不是靠一个总控。' },
    'grid': { ipa: '/ɡrɪd/', cn: 'n. 网格；格网', ex: 'The floor is divided into a grid, and each cell holds one robot.', exZh: '地面被划成网格，每一格容纳一台机器人。' },
    'collision': { ipa: '/kəˈlɪʒn/', cn: 'n. 碰撞；相撞', ex: 'A reservation prevents a collision at a junction.', exZh: '一次预留可以避免在路口发生碰撞。' },
    'congestion': { ipa: '/kənˈdʒestʃən/', cn: 'n. 拥堵；堵塞', ex: 'Congestion appears even when every robot runs at full speed.', exZh: '即使每台机器人都全速运行，拥堵依然会出现。' },
    'bottleneck': { ipa: '/ˈbɒtlnek/', cn: 'n. 瓶颈', ex: 'One central planner quickly becomes the bottleneck of the system.', exZh: '一个中央规划器很快就成了系统的瓶颈。' },
    'decentralized': { ipa: '/ˌdiːˈsentrəlaɪzd/', cn: 'adj. 去中心化的；分散式的', ex: 'A decentralized design keeps working when one robot fails.', exZh: '分散式设计在某台机器人故障时仍能运转。' },
    'reservation': { ipa: '/ˌrezəˈveɪʃn/', cn: 'n. 预留；预订', ex: 'The reservation expires quickly, so no cell stays blocked for long.', exZh: '预留很快就会失效，所以没有哪一格会被长期占住。' },
    'deadlock': { ipa: '/ˈdedlɒk/', cn: 'n. 死锁；僵局', ex: 'A ring of waiting robots is the classic form of deadlock.', exZh: '一圈互相等待的机器人是死锁的经典形态。' },
    'priority': { ipa: '/praɪˈɒrəti/', cn: 'n. 优先级；优先权', ex: 'The robot with the lowest priority backs out first.', exZh: '优先级最低的机器人先倒车让路。' },
    'throughput': { ipa: '/ˈθruːpʊt/', cn: 'n. 吞吐量；处理能力', ex: 'Throughput matters more than the speed of any single robot.', exZh: '吞吐量比任何单台机器人的速度都更重要。' },
    'aisle': { ipa: '/aɪl/', cn: 'n. 通道；过道', ex: 'A robot that stops in a narrow aisle blocks everything behind it.', exZh: '一台停在窄通道里的机器人会把后面的全堵住。' }
  },
  quiz: [
    { q: 'Why does the article say that one rule produces everything that follows?',
      options: ['Because a single robot can only carry one shelf at a time.',
                'Because the cell rule forbids two robots in one square, so sharing a floor forces robots to coordinate.',
                'Because the warehouse floor is too small for more than a thousand robots.'],
      answer: 1,
      why: '原文说“那一格只能站一台”这条规则生出后面所有麻烦：一旦要共用同一片地面，机器人就必须协调，才引出碰撞、拥堵、死锁等问题。' },
    { q: 'What is the main weakness of a single central planner?',
      options: ['It cannot plan routes that turn corners.',
                'It makes each robot slower than a local rule would.',
                'It must answer thousands of requests per second, and its failure stops the whole floor.'],
      answer: 2,
      why: '原文指出中央规划器在小场地上可行，但一台机器每秒要回答几千个请求，一旦它失效整片地面停摆，因此成为瓶颈。' },
    { q: 'Why does the article prefer steady flow to maximum individual speed?',
      options: ['Because a fleet tuned for the fastest single robot jams, while throughput is what the warehouse actually sells.',
                'Because fast robots use more electricity than slow ones.',
                'Because customers complain when a single order arrives too early.'],
      answer: 0,
      why: '原文说仓库真正卖的是吞吐量（每小时送达的货架数），按单台最快去调的车队会堵死，按稳定流动去调才能持续产出。' }
  ]
},

/* ---------------------------------------------------------------------------
   2026-11-06 · 科技硬件 / 极紫外光刻的物理约束
   --------------------------------------------------------------------------- */
{
  id: '2026-11-06',
  date: '2026-11-06',
  topic: '科技硬件',
  title: 'The Light That Nothing Can Bend',
  subtitle: 'The machine that prints modern chips uses mirrors, because no lens would survive the light.',
  level: 'CET-6',
  body: [
    { en: `Every chip inside your phone was printed, not assembled.`,
      zh: `你手机里的每一块芯片都是“印”出来的，而不是“装”出来的。` },
    { en: `A machine projects a pattern of light onto a silicon wafer, and wherever it lands, the pattern is fixed into the surface.`,
      zh: `一台机器把一个光的图案投射到硅片上，光落在哪里，图案就在那里固化进表面。` },
    { en: `For fifty years the industry has played a single game: make the light smaller.`,
      zh: `五十年来，这个行业只玩一个游戏：把光做得更小。` },
    { en: `Physics sets the floor, and the name of the floor is {{diffraction}}.`,
      zh: `物理设下了下限，这块下限的名字叫{{衍射}}。` },
    { en: `A pattern of light cannot be much sharper than the {{wavelength}} that carries it, however perfect the lens.`,
      zh: `无论透镜多完美，一个光图案的锐度都不会比承载它的{{波长}}精细太多。` },
    { en: `For two decades the industry worked at 193 nanometres, and then it ran out of room.`,
      zh: `二十多年里，这个行业一直工作在 193 纳米，然后就再没有余量了。` },
    { en: `Engineers stretched that wavelength with water between lens and wafer, and with masks that split one shape into several exposures; each trick worked, and each cost yield and money.`,
      zh: `工程师用透镜与硅片之间的水、用把一个形状拆成多次曝光的掩模，硬把这个波长撑住；每个技巧都奏效，也都吃掉了良率和成本。` },
    { en: `The real solution was a jump to 13.5 nanometres, in a region called extreme ultraviolet.`,
      zh: `真正的解法是一步跳到 13.5 纳米，这一段光谱叫极紫外。` },
    { en: `The first casualty is glass.`,
      zh: `第一个倒下的东西是玻璃。` },
    { en: `At this wavelength almost every material shows strong {{absorption}}, air included, so no lens can carry the light.`,
      zh: `在这个波长上，几乎所有材料都表现出强烈的{{吸收}}，连空气也不例外，于是没有任何透镜能承载这束光。` },
    { en: `What remains is a mirror, and the light needs a {{vacuum}} to survive the trip.`,
      zh: `剩下的只有镜子，而光需要一段{{真空}}才能走完全程。` },
    { note: {
        en: 'A lens bends light by letting it pass through matter. If matter swallows the light, the only tool left is a surface that throws it back.',
        zh: '透镜靠让光穿过物质来弯折它。可如果物质把光吞掉，剩下的唯一工具就是能把光扔回去的表面。'
      } },
    { en: `These mirrors are not polished metal but stacks of about fifty alternating layers, each only a few atoms thick.`,
      zh: `这些镜子不是抛光金属，而是约五十层交替材料叠起来的，每一层只有几个原子厚。` },
    { en: `They {{reflect}} by interference, adding many weak echoes into one strong one.`,
      zh: `它们靠干涉来{{反射}}，把许多微弱的回声叠加成一束强的。` },
    { en: `A good one returns about seventy percent, and a scanner uses ten in a row, so most of the beam is gone before the wafer sees anything.`,
      zh: `好一点的镜子大约能返回七成光，而一台扫描机一路要用十片左右，于是光束还没照到硅片，大半已经没了。` },
    { en: `The mask is a mirror too, its pattern etched into a reflecting surface rather than cut into glass.`,
      zh: `掩模本身也是镜子：图案刻在反射面上，而不是刻在玻璃里。` },
    { en: `Making the light is harder than carrying it.`,
      zh: `造光比运光更难。` },
    { en: `A generator shoots roughly fifty thousand tin {{droplets}} into a chamber each second, flattens each with a weak pulse, then blasts it into {{plasma}} with a strong one.`,
      zh: `一台发生器每秒把大约五万颗锡{{液滴}}射进腔体，用弱脉冲把每颗压扁，再用强脉冲把它打成{{等离子体}}。` },
    { en: `That plasma is hotter than the surface of the sun and glows at exactly the needed wavelength for a few billionths of a second; gathering that flash into a beam is a problem of geometry and heat, not chemistry.`,
      zh: `这团等离子体比太阳表面还热，并在需要的波长上恰好发光，只持续几十亿分之一秒；把这瞬闪光收拢成可用的光束，是几何与散热的问题，不是化学问题。` },
    { en: `Below the light sits the stage, sliding the wafer under the beam at about a metre per second and reversing within milliseconds.`,
      zh: `光束下方是工件台，它以大约每秒一米的速度把硅片送过光斑，并在毫秒之内反向。` },
    { en: `Its {{precision}} is measured in nanometres, and holding that while accelerating takes constant active correction rather than a rigid frame.`,
      zh: `它的{{精度}}以纳米计，而要在加速过程中维持这个精度，靠的是持续的主动校正，而不是一个刚性框架。` },
    { en: `Each layer must also line up with the one beneath it, and the error allowed, called {{overlay}}, is a fraction of the smallest feature.`,
      zh: `每一层还必须与下面那一层对齐，允许的误差叫{{套刻}}，只有最小线宽的一小部分。` },
    { en: `A single stray vibration, from a lorry outside or a pump inside, can spend that {{tolerance}} before the exposure even starts.`,
      zh: `一次多余的振动——外面一辆卡车，或里面一台泵——就能在曝光开始之前把这点{{容差}}花光。` },
    { en: `And because the light is so energetic, each flash carries very few photons, so the printed pattern keeps a {{stochastic}} roughness that no cleaning can remove.`,
      zh: `又因为这光能量太高，每次闪光里携带的光子少得可怜，印出的图案因此带着一种{{随机}}的粗糙，再怎么清洁也去不掉。` },
    { en: `What impresses is not any single part but that every constraint arrived at once: vacuum, ten mirrors, a plasma at several hundred thousand degrees, a stage that races and then settles.`,
      zh: `真正令人震撼的不是某个单独的零件，而是所有约束同时从物理里涌出来：真空、十片镜子、几十万度的等离子体、一个先飞驰再稳住的工件台。` },
    { en: `The strange shape of the machine is therefore not a matter of taste; it is the shortest path left once physics removed the alternatives.`,
      zh: `所以这台机器奇怪的形状不是审美问题，而是物理把其它选项都划掉之后剩下的那条最短路径。` }
  ],
  words: {
    'diffraction': { ipa: '/dɪˈfrækʃn/', cn: 'n. 衍射', ex: 'Diffraction sets the smallest feature a given wavelength can print.', exZh: '衍射决定了一个给定波长所能印出的最小线宽。' },
    'wavelength': { ipa: '/ˈweɪvleŋθ/', cn: 'n. 波长', ex: 'A shorter wavelength allows a sharper pattern.', exZh: '更短的波长可以带来更锐利的图案。' },
    'absorption': { ipa: '/əbˈsɔːpʃn/', cn: 'n. 吸收；吸光', ex: 'Strong absorption in air means the beam must travel in vacuum.', exZh: '空气中的强烈吸收意味着光束必须在真空中传输。' },
    'vacuum': { ipa: '/ˈvækjuəm/', cn: 'n. 真空', ex: 'The optical path is kept in vacuum to avoid absorption.', exZh: '整个光路保持在真空中，以避免吸收。' },
    'reflect': { ipa: '/rɪˈflekt/', cn: 'v. 反射；反光', ex: 'The multilayer coating reflects about seventy percent of the light.', exZh: '这层多层膜能反射大约七成的光。' },
    'droplets': { ipa: '/ˈdrɒpləts/', cn: 'n. 小液滴（droplet 的复数）', ex: 'Tiny tin droplets are fired into the chamber fifty thousand times a second.', exZh: '微小的锡液滴每秒被射入腔体五万次。' },
    'plasma': { ipa: '/ˈplæzmə/', cn: 'n. 等离子体', ex: 'The laser turns each droplet into a plasma that radiates extreme ultraviolet light.', exZh: '激光把每颗液滴变成会辐射极紫外光的等离子体。' },
    'precision': { ipa: '/prɪˈsɪʒn/', cn: 'n. 精度；精密', ex: 'The stage moves with a precision of a few nanometres.', exZh: '工件台以几纳米的精度移动。' },
    'overlay': { ipa: '/ˌəʊvəˈleɪ/', cn: 'n. 套刻；层间对准（光刻术语）', ex: 'Poor overlay makes two layers of a chip misalign.', exZh: '套刻不佳会让芯片的两层对不齐。' },
    'tolerance': { ipa: '/ˈtɒlərəns/', cn: 'n. 公差；容差', ex: 'The tolerance for vibration is smaller than the width of a virus.', exZh: '允许的振动容差比一个病毒的宽度还小。' },
    'stochastic': { ipa: '/stəˈkæstɪk/', cn: 'adj. 随机的；概率性的', ex: 'Stochastic effects limit how small a printed feature can be.', exZh: '随机效应限制了印出的线宽能有多小。' }
  },
  quiz: [
    { q: 'Why does an EUV scanner use mirrors instead of lenses?',
      options: ['Because mirrors are cheaper to manufacture than glass lenses of that size.',
                'Because almost all materials absorb light at 13.5 nanometres, so no lens can transmit the beam.',
                'Because mirrors can focus light more sharply than lenses at any wavelength.'],
      answer: 1,
      why: '原文说这个波长上几乎所有材料（包括空气）都强烈吸收，透射式透镜不可行，只能用反射镜并在真空中传输。' },
    { q: 'Why is most of the light lost on its way to the wafer?',
      options: ['Because each mirror returns only about seventy percent, and about ten mirrors are used in a row, so the losses multiply.',
                'Because the mask is designed to block most of the light on purpose.',
                'Because the tin droplets absorb the beam after it leaves the source.'],
      answer: 0,
      why: '单镜反射率约七成，一路约十片镜子，损耗是相乘的，所以光束到达硅片前大部分已经损失。' },
    { q: 'What does the last paragraph suggest about the machine\'s unusual design?',
      options: ['It is mainly the result of aesthetic choices made by manufacturers.',
                'It will soon be abandoned because the design is too inefficient.',
                'It is the shortest path left once physics has ruled out the alternatives, since all constraints must be met at the same time.'],
      answer: 2,
      why: '原文明确说“物理把其它选项都划掉之后剩下的最短路径”，强调真空、镜子、等离子体、工件台等约束必须同时满足。' }
  ]
},



/* ---------------------------------------------------------------------------
   2026-11-05 · 生物医药 / 多肽药物的半衰期工程
   --------------------------------------------------------------------------- */
{
  id: '2026-11-05',
  date: '2026-11-05',
  topic: '生物医药',
  title: 'Teaching a Hormone to Stay',
  subtitle: 'The body makes this signal for two minutes. A drug makes it last a week.',
  level: 'CET-6',
  body: [
    { en: `Every time you eat, cells in the lining of your gut release a small {{hormone}} into the blood, carrying one message: food has arrived.`,
      zh: `每次进食，肠道内壁的细胞都会向血液中释放一种小分子{{激素}}，只传递一个信息：食物到了。` },
    { en: `That message is read in at least three places.`,
      zh: `这个信息至少会在三个地方被读取。` },
    { en: `In the pancreas, it tells the beta cells to prepare insulin, but only when glucose is actually rising.`,
      zh: `在胰腺，它提示 β 细胞准备分泌胰岛素，但前提是血糖确实在上升。` },
    { en: `In the brainstem, it produces {{satiety}}, the quiet sense that you have had enough.`,
      zh: `在脑干，它带来{{饱足感}}，也就是那种“已经够了”的安静感觉。` },
    { en: `In the stomach, it slows the rate at which food leaves for the intestine.`,
      zh: `在胃里，它让食物排向肠道的速度慢下来。` },
    { en: `The design is elegant because the signal is tied to the event: it appears only when there is food, so the response cannot run ahead of reality.`,
      zh: `这套设计很高明，因为信号与事件绑定：有食物才有信号，反应因此不会跑到现实前面去。` },
    { en: `There is one problem. The molecule is extremely short-lived.`,
      zh: `但有一个问题：这个分子存活的时间极短。` },
    { en: `An {{enzyme}} called DPP-4 cuts it apart within a minute or two, and the kidney clears the fragments.`,
      zh: `一种叫 DPP-4 的{{酶}}会在一两分钟内把它切断，碎片再由肾脏清除。` },
    { en: `Its half-life in blood is about two minutes.`,
      zh: `它在血液中的半衰期只有两分钟左右。` },
    { note: {
        en: 'A short signal is not a weak signal. It is a signal with a time and a place.',
        zh: '短促的信号并不等于微弱的信号，它是一个有明确时间与地点的信号。'
      } },
    { en: `Medicine, however, cannot give an injection every two minutes.`,
      zh: `可是医学做不到每两分钟打一针。` },
    { en: `Turning this hormone into a drug was therefore a problem of time, not of strength.`,
      zh: `因此，把这种激素做成药，要解决的是时间问题，而不是强度问题。` },
    { en: `The first fix is chemical: change one amino acid so that the enzyme no longer recognises its cutting site.`,
      zh: `第一个办法是化学层面的：改掉一个氨基酸，让酶认不出原来的切割位点。` },
    { en: `The {{peptide}} still binds the {{receptor}}, but the scissors can no longer grip it.`,
      zh: `这条{{多肽}}依然能结合{{受体}}，剪刀却再也夹不住它。` },
    { en: `The second fix is a passenger: attach a long fatty acid chain to the molecule.`,
      zh: `第二个办法是给它配一位“乘客”：在分子上挂一条长脂肪酸链。` },
    { en: `In the blood, this tail binds to {{albumin}}, the most abundant protein in {{plasma}}.`,
      zh: `进入血液后，这条尾巴会与{{白蛋白}}结合——{{血浆}}中含量最多的蛋白质。` },
    { en: `Albumin is far too large to pass the kidney's filter, so the drug rides on it and is released slowly.`,
      zh: `白蛋白体积太大，过不了肾脏的滤网，于是药物搭着它慢慢释放。` },
    { en: `Together, these two tricks stretch a two-minute signal into a week, which is why the drug can be injected once weekly.`,
      zh: `两招合用，把两分钟的信号拉长到一周，这就是它能一周只打一次的原因。` },
    { note: {
        en: 'The molecule is not stronger than the natural one. It simply lingers.',
        zh: '这个分子并不比天然的更强，它只是待得更久。'
      } },
    { en: `Duration, however, has a price.`,
      zh: `但“更久”是有代价的。` },
    { en: `The signal is no longer tied to meals, so the stomach stays slow and {{appetite}} stays low even when the body needs energy.`,
      zh: `信号不再跟着进食走，于是胃一直慢吞吞的，{{食欲}}持续低迷，哪怕身体正需要能量。` },
    { en: `The most common side effect is {{nausea}}, and it is not a malfunction: it is the same message arriving too often.`,
      zh: `{{恶心}}是最常见的副作用，而它并不是故障：那只是同一条信息来得太频繁。` },
    { en: `When weight falls quickly, part of what disappears is muscle, which is why doctors now pair the drug with protein and resistance training.`,
      zh: `体重快速下降时，消失的一部分是肌肉，所以医生现在会同时要求补充蛋白质、做力量训练。` },
    { en: `When the {{dose}} stops, hunger returns within weeks, because nothing in the body was repaired; the biology was {{overridden}}, not corrected.`,
      zh: `一旦停{{药}}，饥饿感在几周内就会回来，因为身体里什么也没被修好；生理机制是被{{压过去}}的，而不是被纠正的。` },
    { en: `The same reasoning explains why the drug is injected rather than swallowed: a peptide is a chain of amino acids, and the stomach is built to break exactly those chains.`,
      zh: `同样的道理也解释了它为什么是注射而不是口服：多肽就是一条氨基酸链，而胃本来就是用来拆这种链的。` },
    { en: `For a student, the lesson is a shift of attention.`,
      zh: `对一名学生来说，值得记下的是注意力的转移。` },
    { en: `Most people imagine drug discovery as a search for a molecule that works, but the molecule is often the easy part; the hard part is delivery — the right tissue, the right concentration, the right length of time.`,
      zh: `大多数人以为新药研发就是找一个管用的分子，可分子往往是最容易的部分；难的是“送达”——送到对的组织、维持对的浓度、保持对的时间长度。` },
    { en: `Pharmacologists therefore ask two separate questions: what the drug does to the body, and what the body does to the drug.`,
      zh: `所以药理学家把问题拆成两个：药物对身体做了什么，以及身体对药物做了什么。` }
  ],
  words: {
    'hormone': { ipa: '/ˈhɔːməʊn/', cn: 'n. 激素；荷尔蒙', ex: 'Insulin is a hormone that tells cells to take up glucose.', exZh: '胰岛素是一种激素，它指示细胞摄取葡萄糖。' },
    'satiety': { ipa: '/səˈtaɪəti/', cn: 'n. 饱足感；饱腹感', ex: 'Satiety usually arrives before the plate is empty.', exZh: '饱足感往往在盘子见底之前就到了。' },
    'enzyme': { ipa: '/ˈenzaɪm/', cn: 'n. 酶', ex: 'The enzyme cuts the peptide into pieces within minutes.', exZh: '这种酶在几分钟内就把多肽切成碎片。' },
    'peptide': { ipa: '/ˈpeptaɪd/', cn: 'n. 肽；多肽', ex: 'A peptide is a short chain of amino acids.', exZh: '多肽是一条较短的氨基酸链。' },
    'receptor': { ipa: '/rɪˈseptə(r)/', cn: 'n. 受体', ex: 'The drug binds a receptor on the surface of the cell.', exZh: '药物与细胞表面的受体结合。' },
    'albumin': { ipa: '/ˈælbjʊmɪn/', cn: 'n. 白蛋白', ex: 'Albumin carries many drugs through the bloodstream.', exZh: '白蛋白把许多药物运送到血液各处。' },
    'plasma': { ipa: '/ˈplæzmə/', cn: 'n. 血浆', ex: 'Albumin is the most abundant protein in plasma.', exZh: '白蛋白是血浆中含量最多的蛋白质。' },
    'appetite': { ipa: '/ˈæpɪtaɪt/', cn: 'n. 食欲；胃口', ex: 'The drug lowers appetite even between meals.', exZh: '这种药即使在两餐之间也会降低食欲。' },
    'nausea': { ipa: '/ˈnɔːziə/', cn: 'n. 恶心；反胃', ex: 'Nausea is common in the first weeks of treatment.', exZh: '治疗的头几周里，恶心很常见。' },
    'dose': { ipa: '/dəʊs/', cn: 'n. 剂量；一剂', ex: 'The dose is raised slowly to limit side effects.', exZh: '剂量会缓慢增加，以减轻副作用。' },
    'overridden': { ipa: '/ˌəʊvəˈrɪdn/', cn: 'v. 被推翻；被压过（override 的过去分词）', ex: 'The natural signal was overridden, not repaired.', exZh: '天然信号是被压过去的，而不是被修复的。' }
  },
  quiz: [
    { q: 'Why is the natural hormone\'s short life described as part of an elegant design rather than a defect?',
      options: ['Because a short life keeps the signal tied to the meal, so the body responds to food that has actually arrived.',
                'Because the kidney needs a constant supply of fragments to stay healthy.',
                'Because a long-lasting signal would permanently damage the beta cells.'],
      answer: 0,
      why: '原文说“信号与事件绑定：有食物才有信号，反应不会跑到现实前面”，短半衰期正是保证“按需响应”的机制。' },
    { q: 'What does the attached fatty acid chain actually accomplish?',
      options: ['It makes the peptide taste bitter so that it cannot be taken orally.',
                'It binds albumin, which is too large to be filtered by the kidney, so the drug is released slowly over days.',
                'It blocks the receptor so that the drug works at a lower dose.'],
      answer: 1,
      why: '脂肪酸链在血中与白蛋白结合，白蛋白体积过大无法通过肾滤过，药物借此缓慢释放，半衰期从几分钟延长到一周。' },
    { q: 'What does the phrase "overridden, not corrected" imply about stopping the drug?',
      options: ['The body has learned a new set point, so weight stays stable after treatment ends.',
                'The underlying biology was never changed, so hunger returns within weeks once the drug is gone.',
                'The drug permanently changes the gut bacteria that control appetite.'],
      answer: 1,
      why: '原文明说“身体里什么也没被修好”，停药后饥饿感几周内回归——药只是压过了生理信号，并未修复它。' }
  ]
},


/* ---------------------------------------------------------------------------
   2026-11-04 · AI 大模型 / 投机解码与内存带宽
   --------------------------------------------------------------------------- */
{
  id: '2026-11-04',
  date: '2026-11-04',
  topic: 'AI 大模型',
  title: 'Guess First, Check Later',
  subtitle: 'A model writes one word at a time, yet it can still answer in a hurry.',
  level: 'CET-6',
  body: [
    { en: `When a language model answers you, most of the waiting has nothing to do with thinking.`,
      zh: `语言模型回答你的时候，大部分等待时间其实与“思考”无关。` },
    { en: `Reading a page is easy; writing one word after another is not.`,
      zh: `读一页纸很容易，一个词接一个词地写出来却不容易。` },
    { en: `The model produces text in a strictly {{sequential}} way: every new word needs the whole text so far as its input.`,
      zh: `模型生成文本的方式是严格串行的：每一个新词，都要以此前全部文本作为输入。` },
    { en: `Nothing about the hundredth word can be computed before the ninety-ninth exists.`,
      zh: `第九十九个词还没出现，第一百个词就无从计算。` },
    { en: `That single fact decides how fast a model can talk.`,
      zh: `仅凭这一点，就决定了模型能说多快。` },
    { en: `To emit one word, the machine must pass the entire model over the entire context.`,
      zh: `为了输出一个词，机器必须让整个模型在整段上下文上跑一遍。` },
    { en: `The arithmetic involved is modest; the movement of data is not.`,
      zh: `其中涉及的计算量并不大，数据搬运量却很大。` },
    { en: `Every weight has to travel from memory to the processor, and there is only so much {{bandwidth}} between them.`,
      zh: `每一个权重都要从内存搬到处理器，而两者之间的带宽是有限的。` },
    { en: `So the processor spends most of its time waiting, its thousands of units {{idle}}. Engineers call this being memory-bound, and it is the opposite of what most people imagine.`,
      zh: `于是处理器大部分时间都在等待，成千上万个计算单元闲着。工程师把这种情况叫“受限于内存”，它和大多数人的想象正好相反。` },
    { en: `A chip that can perform a trillion operations per second is standing still, because it cannot be fed.`,
      zh: `一块每秒能运算上万亿次的芯片，就这样停在原地，因为它“喂不饱”。` },
    { note: {
        en: 'A machine that reads in parallel and writes in sequence will always be limited by the writing.',
        zh: '一台能并行读、只能串行写的机器，永远被“写”这一端拖住。'
      } },
    { en: `Once you see this {{bottleneck}}, an odd idea becomes obvious.`,
      zh: `一旦看清这个瓶颈，一个古怪的想法就变得顺理成章。` },
    { en: `If writing is expensive and reading is cheap, then let something cheap do the writing and something expensive do the reading.`,
      zh: `既然写很贵、读很便宜，那就让便宜的那个去写，让昂贵的那个去读。` },
    { en: `A small model, called a {{draft}} model, guesses the next several words quickly and not very well.`,
      zh: `一个被称为“草稿模型”的小模型，会很快地猜出接下来几个词，猜得并不算准。` },
    { en: `The large model then has to {{verify}} all of those guesses in a single pass.`,
      zh: `接着，大模型要在一次前向计算中把这些猜测全部核验一遍。` },
    { en: `This is possible because of a property of the architecture: it can score many positions at once, so checking five guesses costs almost the same as checking one.`,
      zh: `这之所以可行，源于架构本身的性质：它可以同时给许多位置打分，所以核对五个猜测与核对一个猜测的代价几乎一样。` },
    { en: `The large model keeps the longest {{prefix}} it agrees with, throws the rest away, and continues from there.`,
      zh: `大模型保留自己认同的最长前缀，把其余猜测丢掉，然后从这里接着往下写。` },
    { en: `The result is not an approximation.`,
      zh: `这样的结果并不是近似。` },
    { en: `With the correct acceptance rule, the final {{distribution}} of words is exactly the one the large model would have produced alone.`,
      zh: `只要接受规则正确，最终得到的词分布，与大模型独自生成时的分布完全一致。` },
    { en: `Nothing is lost in quality; the only possible loss is wasted work.`,
      zh: `质量上没有任何损失，唯一可能损失的是白做的功。` },
    { en: `That waste is measured by the {{acceptance}} rate, the share of guesses that survive.`,
      zh: `这种浪费用“接受率”来衡量，也就是猜测中最终存活下来的比例。` },
    { en: `If the small model is well matched to the large one, most guesses pass and the answer arrives two or three times sooner.`,
      zh: `如果小模型与大模型脾性相合，大多数猜测都能通过，答案会提前两三倍送到你面前。` },
    { en: `If it is badly matched, the machine does the small model's work for nothing and gains almost nothing.`,
      zh: `如果两者不匹配，机器就白干了小模型的活，收益几乎为零。` },
    { en: `The same pattern appears far outside language models.`,
      zh: `同样的思路，在语言模型之外早就出现过。` },
    { en: `Processors {{speculate}} about which branch a program will take, and throw the guess away if it turns out wrong.`,
      zh: `处理器会推测程序将走哪条分支，一旦猜错就把结果丢弃。` },
    { en: `A database may let two transactions run {{optimistically}} and check for conflicts at the end.`,
      zh: `数据库可能允许两个事务“乐观”地并行执行，最后再检查有没有冲突。` },
    { en: `In each case an expensive check was made cheap, and a cheap guess was allowed to run ahead.`,
      zh: `这几种情形里，昂贵的检查都被变便宜了，便宜的猜测则被允许先跑。` },
    { en: `The lesson for a student is not the trick itself, but the habit behind it: find out what the machine is actually waiting for.`,
      zh: `对学生来说，值得学的不是这个技巧本身，而是它背后的习惯：先搞清楚机器到底在等什么。` },
    { en: `Most clever designs are just someone noticing where the time goes.`,
      zh: `大多数巧妙的设计，不过是有人看清了时间都花在了哪里。` },
    { note: {
        en: 'Speed rarely comes from doing the same work faster. It comes from finding a cheaper way to be sure.',
        zh: '速度很少来自“把同样的活干得更快”，它通常来自找到一种更便宜的确认方式。'
      } }
  ],
  words: {
    'sequential': { ipa: '/sɪˈkwenʃl/', cn: 'adj. 顺序的；串行的', ex: 'Text is generated in a sequential way, one token at a time.', exZh: '文本是串行生成的，一次一个词元。' },
    'bandwidth': { ipa: '/ˈbændwɪdθ/', cn: 'n. 带宽', ex: 'The chip is fast, but bandwidth between memory and processor is the limit.', exZh: '芯片很快，但内存与处理器之间的带宽才是限制所在。' },
    'idle': { ipa: '/ˈaɪdl/', cn: 'adj. 空闲的；闲置的', ex: 'Most of the units sit idle while the data arrives.', exZh: '数据送达的过程中，大部分计算单元都闲着。' },
    'bottleneck': { ipa: '/ˈbɒtlnek/', cn: 'n. 瓶颈', ex: 'Find the bottleneck before you optimise anything.', exZh: '先去找到瓶颈，再谈优化任何东西。' },
    'draft': { ipa: '/drɑːft/', cn: 'n. 草稿；初稿（v. 起草）', ex: 'A draft model writes a rough guess that a larger model will check.', exZh: '草稿模型先写出一个粗略的猜测，再由更大的模型核对。' },
    'verify': { ipa: '/ˈverɪfaɪ/', cn: 'v. 核实；验证', ex: 'It is cheaper to verify five guesses than to make five.', exZh: '核对五个猜测，比做出五个猜测更便宜。' },
    'prefix': { ipa: '/ˈpriːfɪks/', cn: 'n. 前缀', ex: 'Only the longest agreed prefix is kept.', exZh: '只有双方一致的最长前缀被保留下来。' },
    'distribution': { ipa: '/ˌdɪstrɪˈbjuːʃn/', cn: 'n. 分布；分配', ex: 'The output distribution stays exactly the same.', exZh: '输出的分布保持完全一致。' },
    'acceptance': { ipa: '/əkˈseptəns/', cn: 'n. 接受；接受率', ex: 'A higher acceptance rate means a larger speedup.', exZh: '接受率越高，加速幅度就越大。' },
    'speculate': { ipa: '/ˈspekjuːleɪt/', cn: 'v. 推测；猜测', ex: 'The processor speculates, and pays only when it is wrong.', exZh: '处理器先行推测，只有猜错时才付出代价。' },
    'optimistically': { ipa: '/ˌɒptɪˈmɪstɪkli/', cn: 'adv. 乐观地', ex: 'The two transactions run optimistically and are checked at the end.', exZh: '这两个事务乐观地执行，最后再统一检查。' }
  },
  quiz: [
    { q: 'According to the passage, why is generating text slow even on a very fast chip?',
      options: ['Because the model performs an enormous number of calculations for every single word.',
                'Because every weight must be moved from memory for each word, so the chip spends most of its time waiting for data.',
                'Because the network connection limits how fast words can be delivered.'],
      answer: 1,
      why: '原文强调“计算量不大，数据搬运量却很大”，处理器因为“喂不饱”而空转，属于受限于内存（memory-bound），不是算力不够。' },
    { q: 'Why can the large model check five guessed words almost as cheaply as one?',
      options: ['Because it only looks at the last word of the guess.',
                'Because the architecture can score many positions in a single pass, so verification is parallel even though generation is not.',
                'Because the draft model has already checked them before sending.'],
      answer: 1,
      why: '关键句：架构可以同时给许多位置打分，所以核对五个猜测与核对一个的代价几乎相同——生成是串行的，核验却是并行的。' },
    { q: 'What happens if the draft model fits the large model poorly?',
      options: ['The answers become less accurate than the large model would give alone.',
                'The work is largely wasted and the speedup is small, but the quality of the output is unchanged.',
                'The large model stops and asks for a different draft model.'],
      answer: 1,
      why: '文章明确说结果“不是近似”，接受规则正确时词分布完全一致，质量无损；匹配不好只是接受率低、白做功、加速有限。' }
  ]
},



/* ---------------------------------------------------------------------------
   2026-11-03 · 金融市场 / 指数再平衡与被动资金
   --------------------------------------------------------------------------- */
{
  id: '2026-11-03',
  date: '2026-11-03',
  topic: '金融市场',
  title: 'The Trade That Has to Happen',
  subtitle: 'When a stock joins an index, the buyers are not convinced. They are required.',
  level: 'CET-6',
  body: [
    { en: `Several times a year, a stock can jump several percent on a day when the company announces nothing at all.`,
      zh: `一家公司在什么都没宣布的一天里，股价有时会跳涨几个百分点，而这样的日子一年有好几次。` },
    { en: `No new product, no earnings report, no contract.`,
      zh: `没有新产品，没有财报，也没有新合同。` },
    { en: `What changed was a rule, written by a committee most investors have never heard of.`,
      zh: `变动的是一条规则，而写下这条规则的委员会，大多数投资者从没听说过。` },
    { en: `That committee decides which companies belong to an {{index}}.`,
      zh: `这个委员会决定哪些公司属于某个指数。` },
    { en: `An index is not a judgement about value. It is a list, and a list can be edited.`,
      zh: `指数不是对价值的判断。它只是一份名单，而名单是可以修改的。` },
    { en: `Funds that track an index hold whatever the list holds, in the proportions the list gives.`,
      zh: `跟踪指数的基金，名单上有什么它就持有什么，比例也照名单给的来。` },
    { en: `Their {{mandate}} leaves no room for an opinion.`,
      zh: `它们的受托义务里，没有给“看法”留位置。` },
    { en: `So when a company is added, every fund tracking that index has to buy it, by a deadline published months in advance.`,
      zh: `于是当一家公司被纳入，每一只跟踪该指数的基金都必须买入，而截止日期提前几个月就公布了。` },
    { en: `This is the index {{inclusion}} effect, and it is one of the rare cases in finance where a very large future order is announced to the whole world.`,
      zh: `这就是指数纳入效应。在金融世界里，一笔巨大的未来订单被公开告知全世界，这种情况相当罕见。` },
    { en: `The size is not trivial.`,
      zh: `规模并不小。` },
    { en: `An index with trillions of dollars tracking it will still move billions of dollars for a {{weight}} of a fraction of one percent.`,
      zh: `一个被数万亿美元跟踪的指数，哪怕权重只有零点几个百分点，也照样能带动几十亿美元的资金。` },
    { en: `Almost none of those buyers think the stock is cheap.`,
      zh: `这些买家当中，几乎没有人认为这只股票便宜。` },
    { en: `They buy because the arithmetic requires it.`,
      zh: `他们买，是因为算术要求他们买。` },
    { en: `The market, however, cannot tell a convinced buyer from an obliged one.`,
      zh: `可是市场分不清谁是真心看好，谁是被迫成交。` },
    { en: `Price is set at the {{marginal}} — by whoever has to trade at that moment.`,
      zh: `价格由边际决定，也就是由那一刻不得不成交的人决定。` },
    { en: `That is the uncomfortable part. A small slice of the market, trading for reasons that have nothing to do with value, can move the price that everyone else uses to measure their wealth.`,
      zh: `这正是让人不安的地方。市场上的一小部分人，出于与价值毫无关系的理由交易，却能推动所有人用来衡量自身财富的那个价格。` },
    { fig: 'orderbook' },
    { en: `Traders noticed this long ago.`,
      zh: `交易员早就察觉了这一点。` },
    { en: `Knowing that a large purchase is coming, they can buy first and sell to the funds later — a practice called {{front-running}} the {{rebalance}}.`,
      zh: `既然知道一大笔买盘要来，他们可以先买，之后再卖给那些基金。这种做法叫抢跑再平衡。` },
    { en: `The result is a visible pattern. Volume piles into the closing {{auction}} on the day of the change, prices often drift up before inclusion, and partly back afterwards.`,
      zh: `结果是一种看得见的规律：调整当天的成交量会挤进收盘集合竞价，价格在纳入前往往被推高，之后又回落一部分。` },
    { en: `Why does the pattern survive, if everyone can see it?`,
      zh: `既然人人都看得见，这个规律为什么还能活着？` },
    { en: `Partly because the trade gets crowded and the advantage is competed away, and partly because the funds cannot opt out.`,
      zh: `一部分原因是这笔交易会变得拥挤，优势被竞争磨掉；另一部分原因是基金没法选择不玩。` },
    { en: `A tracking fund that refuses to trade drifts away from its benchmark, and drift is the one thing it is not allowed to produce.`,
      zh: `一只拒绝交易的跟踪基金，会偏离它的基准，而偏离恰恰是它唯一不被允许产生的东西。` },
    { en: `So the cost is paid quietly, recorded as an {{implementation}} cost inside something called tracking error.`,
      zh: `于是这笔成本被悄悄付掉了，记在“跟踪误差”名下，算作一种执行成本。` },
    { en: `The same machinery runs in reverse when a company is deleted: the {{roster}} changes, and the selling happens whether or not anyone wants to sell.`,
      zh: `同一套机械在剔除时反向运转：名册一变，卖盘就会出现，不管有没有人真的想卖。` },
    { en: `For a student, the useful lesson is not that index funds are bad.`,
      zh: `对学生来说，有用的教训并不是“指数基金不好”。` },
    { en: `It is that an index is a rule, and rules make behaviour {{predictable}}.`,
      zh: `而是：指数是一条规则，而规则会让行为变得可预测。` },
    { en: `Once you can see the rule, you can see the {{distortion}} it creates, and you stop mistaking the plumbing for public opinion.`,
      zh: `一旦你看清了规则，你就能看到它造成的扭曲，也不会再把管道当成民意。` },
    { note: {
        en: 'A price is not a vote. Sometimes it is just the sound of someone who has no choice.',
        zh: '价格不是投票。有时候，它只是某个别无选择的人发出的声音。'
      } }
  ],
  words: {
    'index': { ipa: '/ˈɪndeks/', cn: 'n. 指数；索引', ex: 'The fund simply copies the index it tracks.', exZh: '这只基金只是照抄它所跟踪的指数。' },
    'mandate': { ipa: '/ˈmændeɪt/', cn: 'n. 授权；受托职责', ex: 'Its mandate forbids it from picking favourites.', exZh: '它的受托职责不允许它挑自己喜欢的股票。' },
    'inclusion': { ipa: '/ɪnˈkluːʒn/', cn: 'n. 纳入；包含', ex: 'Index inclusion can move a price without any news.', exZh: '指数纳入能在没有任何消息的情况下推动价格。' },
    'weight': { ipa: '/weɪt/', cn: 'n. 权重；比重', ex: 'A small weight in a huge index still means real money.', exZh: '在一个巨型指数里，很小的权重也意味着真金白银。' },
    'marginal': { ipa: '/ˈmɑːdʒɪnl/', cn: 'n. 边际（adj. 边际的，边缘的）', ex: 'The price is set at the marginal, not at the average.', exZh: '价格由边际决定，而不是由平均值决定。' },
    'front-running': { ipa: '/ˌfrʌnt ˈrʌnɪŋ/', cn: 'n. 抢跑（在已知大单成交之前先行交易）', ex: 'Front-running a known order is legal in many markets.', exZh: '在许多市场里，抢跑一笔已知的订单是合法的。' },
    'rebalance': { ipa: '/ˌriːˈbæləns/', cn: 'n./v. 再平衡；调整权重', ex: 'The rebalance happens on a single closing auction.', exZh: '这次再平衡集中在一次收盘集合竞价里完成。' },
    'auction': { ipa: '/ˈɔːkʃn/', cn: 'n. 拍卖；集合竞价', ex: 'Most of the volume traded in the closing auction.', exZh: '大部分成交量发生在收盘集合竞价中。' },
    'implementation': { ipa: '/ˌɪmplɪmenˈteɪʃn/', cn: 'n. 实施；执行', ex: 'Implementation costs are hidden inside tracking error.', exZh: '执行成本被藏在跟踪误差里面。' },
    'roster': { ipa: '/ˈrɒstə/', cn: 'n. 名册；成员名单', ex: 'When the roster changes, the flows follow automatically.', exZh: '名册一变，资金流就自动跟着动。' },
    'predictable': { ipa: '/prɪˈdɪktəbl/', cn: 'adj. 可预测的', ex: 'Rules make behaviour predictable, and predictability has a price.', exZh: '规则让行为变得可预测，而可预测性是有代价的。' },
    'distortion': { ipa: '/dɪˈstɔːʃn/', cn: 'n. 扭曲；失真', ex: 'Forced buying creates a distortion that others can trade against.', exZh: '被动买入制造出一种扭曲，别人可以反过来利用它交易。' }
  },
  quiz: [
    { q: 'Why must an index fund buy a stock as soon as it is added to the index?',
      options: ['Because the fund manager believes the stock is undervalued.',
                'Because the fund is required to hold whatever the index holds, so the purchase is compulsory.',
                'Because the exchange orders every fund to buy it.'],
      answer: 1,
      why: '文章强调基金是“照抄名单”，受托义务不允许它有看法，所以买入是被规则强制的，与是否看好无关。' },
    { q: 'What does “price is set at the marginal” mean in this passage?',
      options: ['The price is decided by those who are forced to trade at that moment, not by the average opinion.',
                'The price equals the average cost of all holders.',
                'The price is fixed by the index committee.'],
      answer: 0,
      why: '原文："Price is set at the marginal — by whoever has to trade at that moment." 即由边际上不得不成交的人定价。' },
    { q: 'Why does the predictable pattern around inclusion still survive?',
      options: ['Because index committees keep their decisions secret.',
                'Because funds cannot choose to skip the trade without deviating from their benchmark, so the flow stays compulsory.',
                'Because regulators forbid anyone from trading before the change.'],
      answer: 1,
      why: '文章说优势被竞争磨掉一部分，但基金不能选择不交易——偏离基准是它唯一不被允许产生的东西，所以强制买盘依旧存在。' }
  ]
},



/* ---------------------------------------------------------------------------
   2026-11-02 · 机器人 / 触觉与柔顺控制
   --------------------------------------------------------------------------- */
{
  id: '2026-11-02',
  date: '2026-11-02',
  topic: '机器人',
  title: 'The Hardest Part of a Robot Is Its Hand',
  subtitle: 'Legs solved balance with physics. Fingers have to solve contact.',
  level: 'CET-6',
  body: [
    { en: `A robot that can walk across a room is now almost ordinary. A robot that can pick up a key from a table is not.`,
      zh: `一台能走过房间的机器人如今几乎算平常，一台能从桌上捡起一把钥匙的机器人却不算。` },
    { en: `The gap is not about strength or speed. It is about contact.`,
      zh: `差距不在力量或速度，而在接触。` },
    { en: `A walking robot deals with a handful of contact points, and it can plan them in advance.`,
      zh: `行走机器人只需处理少数几个接触点，而且可以提前规划。` },
    { en: `A hand deals with dozens of them, appearing and disappearing hundreds of times a second, and most of them are invisible to the robot.`,
      zh: `一只手要处理几十个接触点，它们每秒出现和消失上百次，而其中大部分对机器人来说是不可见的。` },
    { en: `Humans solve this with skin. A fingertip carries thousands of {{mechanoreceptors}} that report pressure, vibration and {{shear}} — the sideways force that tells you an object is about to slip.`,
      zh: `人类靠皮肤解决这个问题。一个指尖上有数千个机械感受器，报告压力、振动和剪切力——正是那种横向的力告诉你物体即将滑脱。` },
    { en: `No robot hand comes anywhere close to that {{density}}.`,
      zh: `没有哪只机器手接近这种密度。` },
    { en: `Building one is hard for a reason that is rarely stated: sensors and {{actuators}} compete for the same space.`,
      zh: `造出这样一只手很难，原因很少被说明：传感器和执行器在争同一块空间。` },
    { en: `Every millimetre given to a tactile array is a millimetre taken from a motor, a tendon, or the structure that holds them.`,
      zh: `给触觉阵列的每一毫米，都是从电机、腱绳或固定它们的结构那里拿走的。` },
    { en: `The usual compromise is to {{underactuate}}: fewer motors than joints, with the fingers coupled mechanically so that one motor drives several.`,
      zh: `常见的折中是"欠驱动"：电机数量少于关节数量，让手指在机械上耦合，用一个电机驱动好几个关节。` },
    { en: `This is how most prosthetic hands work, and it is why they can grip a cup but not turn a key.`,
      zh: `大多数假手就是这么做的，这也是它们能握住杯子、却拧不动钥匙的原因。` },
    { en: `The control problem is equally awkward.`,
      zh: `控制问题同样棘手。` },
    { en: `Grasping is not a {{trajectory}} to be followed; it is a negotiation with an object whose weight, friction and stiffness are unknown.`,
      zh: `抓取不是一条要跟随的轨迹，而是一场与物体的谈判——而物体的重量、摩擦和刚度都是未知的。` },
    { en: `A controller that is too stiff crushes the object. One that is too soft drops it.`,
      zh: `控制得太硬会捏碎物体，太软则会掉。` },
    { en: `The practical answer is {{compliance}}: build the hand so that it yields slightly, and let the mechanics absorb the uncertainty that the software cannot model.`,
      zh: `实用的答案是"柔顺"：把手造得能微微让步，让机械结构去吸收软件无法建模的不确定性。` },
    { fig: 'grasp' },
    { en: `This is a different philosophy from the one that built most industrial robots, which are deliberately {{rigid}} and carefully kept away from anything they might touch.`,
      zh: `这与造出大多数工业机器人的那套理念不同——那些机器人被刻意做得很刚硬，并被小心地与任何可能碰到的东西隔开。` },
    { en: `The new generation is designed to touch things, which means it must be able to be wrong safely.`,
      zh: `新一代机器人被设计成要去接触物体，这意味着它必须能够安全地犯错。` },
    { en: `Learning has helped, but it has not solved it.`,
      zh: `学习帮上了忙，但并没有解决它。` },
    { en: `A policy trained in simulation can master one specific grasp in one specific simulator, and then fail on a real hand whose tendons stretch by half a millimetre.`,
      zh: `在仿真中训练出来的策略，可以在特定仿真器里精通某一种特定抓取，然后在真实的手上失败——只因为那双手的腱绳会伸长半毫米。` },
    { en: `Tactile {{feedback}} closes part of that gap, because it lets the controller react to what is actually happening rather than to what was predicted.`,
      zh: `触觉反馈弥合了其中一部分差距，因为它让控制器对实际发生的事做出反应，而不是对预测做出反应。` },
    { en: `But it also raises the bar: a control loop that reacts to contact must run at hundreds of hertz, which rules out most of the heavy models now in fashion.`,
      zh: `但它也抬高了门槛：要对接触做出反应的控制回路必须以数百赫兹运行，这就排除了当下流行的多数大模型。` },
    { en: `So the field is moving in two directions at once — richer sensing, and much lighter computation.`,
      zh: `于是这个领域同时在往两个方向走：更丰富的感知，和轻得多的计算。` },
    { en: `For anyone building robots, the lesson is that the interesting {{constraints}} are mechanical before they are algorithmic.`,
      zh: `对造机器人的人来说，教训是：有意思的约束在成为算法问题之前，先是机械问题。` },
    { en: `You can always add another layer of software. You cannot add another millimetre.`,
      zh: `你总能再加一层软件，却没法再加一毫米。` },
    { en: `That is why hands are the bottleneck, and why they will stay interesting for a long time.`,
      zh: `这就是为什么手是瓶颈，也是为什么它会长期是个有意思的问题。` },
    { note: {
        en: 'A grip that deforms is not a worse grip. It is a grip that can be wrong by a little and still work.',
        zh: '会变形的抓取不是更差的抓取。它是那种"可以错一点点、但依然能用"的抓取。'
      } }
  ],
  words: {
    'mechanoreceptors': { ipa: '/ˌmekənəʊrɪˈseptəz/', cn: 'n. 机械感受器', ex: 'Mechanoreceptors in the skin report pressure and vibration.', exZh: '皮肤里的机械感受器负责报告压力和振动。' },
    'shear': { ipa: '/ʃɪə/', cn: 'n. 剪切力；切变', ex: 'Shear tells your fingers that an object is about to slip.', exZh: '剪切力告诉你的手指：物体即将滑脱。' },
    'density': { ipa: '/ˈdensəti/', cn: 'n. 密度', ex: 'No robot hand comes close to the density of human skin.', exZh: '没有哪只机器手接近人类皮肤的密度。' },
    'actuators': { ipa: '/ˈæktʃueɪtəz/', cn: 'n. 执行器；驱动器（actuator 的复数）', ex: 'Sensors and actuators compete for the same volume.', exZh: '传感器和执行器在争夺同样的体积。' },
    'underactuate': { ipa: '/ˌʌndərˈæktʃueɪt/', cn: 'v. 欠驱动（执行器数量少于自由度）', ex: 'Most prosthetic hands underactuate the fingers to save space.', exZh: '大多数假手为了节省空间而对指头采用欠驱动。' },
    'trajectory': { ipa: '/trəˈdʒektəri/', cn: 'n. 轨迹', ex: 'A grasp is not a trajectory to be followed.', exZh: '抓取不是一条要跟随的轨迹。' },
    'compliance': { ipa: '/kəmˈplaɪəns/', cn: 'n. 柔顺性；顺应性', ex: 'Compliance lets the hand absorb what the controller cannot model.', exZh: '柔顺性让手去吸收控制器无法建模的那部分。' },
    'rigid': { ipa: '/ˈrɪdʒɪd/', cn: 'adj. 刚性的；僵硬的', ex: 'Industrial robots are deliberately rigid and kept away from people.', exZh: '工业机器人被刻意做得很刚硬，并与人员保持距离。' },
    'feedback': { ipa: '/ˈfiːdbæk/', cn: 'n. 反馈', ex: 'Tactile feedback lets the controller react to what is actually happening.', exZh: '触觉反馈让控制器对实际发生的情况做出反应。' },
    'constraints': { ipa: '/kənˈstreɪnts/', cn: 'n. 约束；限制（constraint 的复数）', ex: 'The interesting constraints are mechanical before they are algorithmic.', exZh: '有意思的约束在成为算法问题之前，先是机械问题。' }
  },
  quiz: [
    { q: 'Why is a hand harder to build than a leg, according to the passage?',
      options: ['Because a hand must be much stronger.',
                'Because a hand handles many contact points that change hundreds of times a second, most of them unobserved.',
                'Because hands require more expensive materials.'],
      answer: 1,
      why: '文中说腿只要处理少数几个可以提前规划的接触点，而手要处理几十个每秒变化上百次、且大多不可见的接触点。' },
    { q: 'What does “underactuate” mean here?',
      options: ['Using fewer motors than joints, with fingers coupled mechanically.',
                'Using more motors than joints.',
                'Using no motors at all.'],
      answer: 0,
      why: '原文："fewer motors than joints, with the fingers coupled mechanically so that one motor drives several."' },
    { q: 'The author’s point about constraints is that:',
      options: ['Software is more important than hardware.',
                'You can always add another layer of software, but you cannot add another millimetre.',
                'Mechanical engineers are more talented than software engineers.'],
      answer: 1,
      why: '文章结尾原话："You can always add another layer of software. You cannot add another millimetre."' }
  ]
},

/* ---------------------------------------------------------------------------
   2026-11-01 · 前沿科研 / 量子纠错
   --------------------------------------------------------------------------- */
{
  id: '2026-11-01',
  date: '2026-11-01',
  topic: '前沿科研',
  title: 'Making Error the Unit of Measurement',
  subtitle: 'A quantum computer is judged not by how many qubits it has, but by how few mistakes it makes.',
  level: 'CET-6',
  body: [
    { en: `When a quantum computer is announced, the number that gets quoted is almost always the same: the number of qubits.`,
      zh: `每当一台量子计算机被发布，被引用的数字几乎总是同一个：量子比特的数量。` },
    { en: `That number is close to meaningless on its own, and the reason is error.`,
      zh: `单独看，这个数字近乎没有意义，原因就是误差。` },
    { en: `A qubit is not a clean two-state switch. It is a small physical system that {{leaks}}, drifts, and interacts with everything around it.`,
      zh: `量子比特不是干净的二态开关，而是一个会泄漏、会漂移、并和周围一切相互作用的微小物理系统。` },
    { en: `Left alone, a good qubit holds its state for perhaps a few hundred microseconds before the information is gone.`,
      zh: `不加干预的话，一个好的量子比特大约只能维持几百微秒，信息就消失了。` },
    { en: `An algorithm that needs thousands of operations will therefore fail long before it finishes.`,
      zh: `因此，一个需要上千次操作的算法，会在完成之前很早就失败。` },
    { en: `The obvious fix is to make better qubits, and that work continues. But there is a limit to how good a single physical qubit can be.`,
      zh: `显而易见的解法是造更好的量子比特，这项研究也一直在推进。但单个物理量子比特能做到多好，是有上限的。` },
    { en: `The more interesting fix is to stop relying on single qubits at all.`,
      zh: `更有意思的解法，是干脆不再依赖单个量子比特。` },
    { en: `Instead, spread one piece of quantum information across many physical qubits and use their {{redundancy}} to detect and correct errors as they happen.`,
      zh: `转而把一份量子信息分散到许多物理量子比特上，用它们的冗余来在误差发生时检测并纠正。` },
    { en: `The bundle then behaves as a single, far more reliable {{logical qubit}}.`,
      zh: `这一束比特随后就表现得像一个单一、可靠得多的"逻辑量子比特"。` },
    { en: `This is quantum error correction, and it rests on a surprisingly forgiving result called the {{threshold theorem}}.`,
      zh: `这就是量子纠错，它建立在一个出人意料地宽容的结论之上，叫做"阈值定理"。` },
    { fig: 'logical' },
    { en: `The theorem says that if the error rate of each physical operation is below some threshold, adding more qubits makes the logical error rate fall {{exponentially}}.`,
      zh: `该定理指出：只要每次物理操作的错误率低于某个阈值，增加量子比特就能让逻辑错误率指数级下降。` },
    { en: `Below the threshold, more hardware buys accuracy. Above it, more hardware buys nothing.`,
      zh: `在阈值以下，更多硬件换来更高精度；在阈值以上，更多硬件什么也换不到。` },
    { en: `That line between the two {{regimes}} is the number that actually matters.`,
      zh: `两种情形之间的这条线，才是真正重要的那个数字。` },
    { en: `Recent experiments have crossed it. Teams have built logical qubits from tens of physical ones and shown that the error rate falls as the code grows.`,
      zh: `近期的实验已经越过了它。一些团队用几十个物理量子比特构建出逻辑量子比特，并证明随着编码规模扩大，错误率确实下降。` },
    { en: `It is a modest result by the standards of headlines — a logical qubit is still worse than the best single physical qubit.`,
      zh: `按新闻标题的标准，这只是个不起眼的成果——一个逻辑量子比特仍不如最好的单个物理量子比特。` },
    { en: `But it is the first evidence that the {{scaling}} direction is the right one.`,
      zh: `但这是第一个证据，说明扩展的方向是对的。` },
    { en: `The engineering that follows is unglamorous and enormous.`,
      zh: `随之而来的工程既不光鲜，也极其庞大。` },
    { en: `Each logical qubit may eventually need thousands of physical ones, plus the control electronics to {{address}} them, all inside a refrigerator that cools the chip to a fraction of a degree above absolute zero.`,
      zh: `每一个逻辑量子比特最终可能需要成千上万个物理量子比特，再加上寻址用的控制电子设备，全部放进一台把芯片冷却到接近绝对零度几分之一的制冷机里。` },
    { en: `Wiring alone becomes a {{bottleneck}}: every qubit needs signals in, and every wire carries heat in.`,
      zh: `单是布线就成了瓶颈：每个量子比特都需要输入信号，而每根导线都会把热量带进来。` },
    { en: `This is why the field is increasingly a hardware {{discipline}} rather than a physics one.`,
      zh: `这就是为什么这个领域正越来越像一门硬件学科，而不只是物理学。` },
    { en: `The useful question to ask about any quantum claim is therefore not “how many qubits”.`,
      zh: `因此，面对任何量子计算的宣称，该问的问题不是"有多少量子比特"。` },
    { en: `It is: what is the logical error rate, how many physical qubits did it cost, and is that number going down as the system grows?`,
      zh: `而是：逻辑错误率是多少？为此花了多少物理量子比特？随着系统变大，这个数字在下降吗？` },
    { en: `A system that cannot answer those three has not yet demonstrated a computer. It has demonstrated a device.`,
      zh: `回答不了这三个问题的系统，还不能说展示了一台计算机，它只展示了一个器件。` },
    { en: `That distinction is worth keeping, because the gap between a device and a computer is exactly where the next ten years will be spent.`,
      zh: `这个区别值得记住，因为从一个器件到一台计算机之间的那段距离，正是未来十年要花掉的地方。` },
    { note: {
        en: 'A device does something impressive once. A computer does something useful a billion times without being watched.',
        zh: '器件是把一件了不起的事做一次；计算机是把一件有用的事做十亿次，而且不需要人盯着。'
      } }
  ],
  words: {
    'leaks': { ipa: '/liːks/', cn: 'v. 泄漏（leak 的第三人称单数）', ex: 'A qubit leaks information to its environment and loses its state.', exZh: '量子比特会向环境泄漏信息，从而失去自己的状态。' },
    'redundancy': { ipa: '/rɪˈdʌndənsi/', cn: 'n. 冗余', ex: 'Error correction works by adding redundancy, not by removing noise.', exZh: '纠错靠增加冗余来工作，而不是靠消除噪声。' },
    'logical qubit': { ipa: '/ˈlɒdʒɪkl ˈkwɪbɪt/', cn: 'n. 逻辑量子比特（由多个物理量子比特编码而成）', ex: 'One logical qubit may require thousands of physical ones.', exZh: '一个逻辑量子比特可能需要上千个物理量子比特。' },
    'threshold theorem': { ipa: '/ˈθreʃhəʊld ˈθɪərəm/', cn: 'n. 阈值定理', ex: 'The threshold theorem is why error correction is possible at all.', exZh: '阈值定理正是纠错得以可能的原因。' },
    'exponentially': { ipa: '/ˌekspəˈnenʃəli/', cn: 'adv. 指数级地', ex: 'Below the threshold, the error rate falls exponentially as the code grows.', exZh: '在阈值以下，随着编码规模扩大，错误率呈指数级下降。' },
    'regimes': { ipa: '/reɪˈʒiːmz/', cn: 'n. 情形；区间（regime 的复数）', ex: 'The two regimes behave completely differently.', exZh: '这两种情形表现得完全不同。' },
    'scaling': { ipa: '/ˈskeɪlɪŋ/', cn: 'n. 扩展；规模化', ex: 'The experiment is the first evidence that the scaling direction is correct.', exZh: '这个实验是第一个证据，说明扩展的方向是对的。' },
    'address': { ipa: '/əˈdres/', cn: 'v. 寻址；访问', ex: 'The control electronics must address thousands of qubits individually.', exZh: '控制电子设备必须逐个寻址成千上万个量子比特。' },
    'bottleneck': { ipa: '/ˈbɒtlnek/', cn: 'n. 瓶颈', ex: 'Wiring becomes the bottleneck long before the qubits do.', exZh: '早在量子比特成为瓶颈之前，布线就已经是瓶颈了。' },
    'discipline': { ipa: '/ˈdɪsəplɪn/', cn: 'n. 学科；领域', ex: 'The field is turning into a hardware discipline.', exZh: '这个领域正在变成一门硬件学科。' }
  },
  quiz: [
    { q: 'Why is the raw number of qubits a poor measure of a quantum computer?',
      options: ['Because qubits are too expensive.',
                'Because single physical qubits keep making errors, so more qubits does not mean more correct computation.',
                'Because quantum computers do not use qubits.'],
      answer: 1,
      why: '物理量子比特会不断出错，几千次操作里错一次就前功尽弃；数量多不等于算得对。' },
    { q: 'What does the threshold theorem say?',
      options: ['If the error rate per physical operation is below a threshold, adding qubits makes the logical error rate fall exponentially.',
                'The more qubits you have, the more errors you get.',
                'The chip must be kept below a certain temperature.'],
      answer: 0,
      why: '定理的核心：低于阈值时，加大编码规模能让逻辑错误率指数级下降；高于阈值则毫无意义。' },
    { q: 'Which three questions does the author recommend asking about any quantum claim?',
      options: ['Price, size and power consumption.',
                'What is the logical error rate, how many physical qubits did it cost, and is that number falling as the system grows?',
                'How many qubits, what clock speed, and which company built it.'],
      answer: 1,
      why: '文章最后给出的三个问题就是这个，回答不了这三个问题的只能叫器件，不能叫计算机。' }
  ]
},

/* ---------------------------------------------------------------------------
   2026-10-31 · 生物医药 / 碱基编辑
   --------------------------------------------------------------------------- */
{
  id: '2026-10-31',
  date: '2026-10-31',
  topic: '生物医药',
  title: 'Editing One Letter at a Time',
  subtitle: 'The newer gene editors no longer cut the DNA. They rewrite it.',
  level: 'CET-6',
  body: [
    { en: `CRISPR is usually described as molecular scissors, and for the first version of the technology that image is accurate.`,
      zh: `CRISPR 通常被形容为分子剪刀，对这项技术的第一代而言，这个比喻是准确的。` },
    { en: `The Cas9 protein cuts both strands of DNA at a chosen site, and the cell then repairs the break.`,
      zh: `Cas9 蛋白在选定的位置把 DNA 的双链切断，随后由细胞来修复这个断裂。` },
    { en: `The repair is not always neat. Cells often close the gap by deleting or inserting a few letters, which is useful for turning a gene off but useless for correcting a typo.`,
      zh: `修复并不总是整齐的。细胞常常靠删掉或插入几个字母来弥合缺口——这对关掉一个基因有用，对改正一个错字却没用。` },
    { en: `A newer class of tools avoids the cut altogether.`,
      zh: `更新的一类工具干脆避开了"切"这一步。` },
    { en: `These are called base editors, and their target is not a strand of DNA but a single letter within it.`,
      zh: `它们叫碱基编辑器，目标不是一段 DNA 链，而是链中的一个字母。` },
    { en: `The design is a {{hybrid}}: a Cas9 protein modified so that it can only {{nick}} one strand, fused to an enzyme that chemically converts one base into another.`,
      zh: `这套设计是一种杂合体：一个被改造过、只能切开单链的 Cas9 蛋白，与一种能把一种碱基化学转化为另一种的酶融合在一起。` },
    { en: `One common version turns a C into a T. Another turns an A into a G.`,
      zh: `常见的版本之一把 C 变成 T，另一种把 A 变成 G。` },
    { en: `Since C pairs with G and A pairs with T, changing one letter on one strand quietly changes its partner too.`,
      zh: `因为 C 与 G 配对、A 与 T 配对，改变一条链上的一个字母，也就同时改变了它的搭档。` },
    { en: `The cell's own repair machinery then accepts the new pair as if nothing had happened.`,
      zh: `细胞自身的修复机制随后会接受这个新配对，仿佛什么都没发生过。` },
    { fig: 'baseedit' },
    { en: `The advantage is {{precision}}. Because the double strand stays intact, the cell never enters the error-prone repair pathway that produces unwanted insertions and deletions.`,
      zh: `优势在于精确。因为双链始终完整，细胞不会进入那个容易出错的修复通路——正是它带来了不受欢迎的插入和缺失。` },
    { en: `In lab comparisons, base editors produce far fewer of those {{by-products}} than standard Cas9.`,
      zh: `在实验室对比中，碱基编辑器产生的这类副产物远少于标准 Cas9。` },
    { en: `That matters for medicine, where an {{unintended}} edit in the wrong cell can become a cancer decades later.`,
      zh: `这对医学很重要：在错误的细胞里发生一次非预期编辑，可能在几十年后变成癌症。` },
    { en: `One base editor has already been approved for treating a blood disorder, and several others are in trials.`,
      zh: `已有一款碱基编辑器获批用于治疗一种血液疾病，另有多款正在临床试验中。` },
    { en: `But the approach has clear limits, and they are worth stating plainly.`,
      zh: `但这条路有明显的边界，值得说清楚。` },
    { en: `It can change one letter into another; it cannot {{insert}} a missing gene or delete a long stretch of DNA.`,
      zh: `它能把一个字母换成另一个，却无法插入一个缺失的基因，也无法删掉一段长 DNA。` },
    { en: `The editing window is narrow — only a few bases around the target site can be reached, which {{constrains}} where the tool can be aimed.`,
      zh: `编辑窗口很窄——只有靶点周围几个碱基能够被触及，这限制了它能瞄准的位置。` },
    { en: `And the hardest problem is not editing at all. It is {{delivery}}: getting the editor into the right organ, in enough cells, without triggering an immune response.`,
      zh: `而最难的问题根本不是编辑本身，而是递送：把编辑器送进正确的器官、足够多的细胞里，同时不引发免疫反应。` },
    { en: `Most current programmes therefore focus on tissues that are easy to reach, such as blood and the liver.`,
      zh: `因此目前大多数项目都聚焦在容易到达的组织上，比如血液和肝脏。` },
    { en: `The broader lesson is about how a field matures.`,
      zh: `更广义的启示，是关于一个领域如何成熟。` },
    { en: `The first version of a tool is celebrated for what it can do. The second version is judged by what it stops doing wrong.`,
      zh: `工具的第一代因它能做什么而受到称赞，第二代则以它不再做错什么来被评判。` },
    { en: `Base editing is that second version: less dramatic, more useful.`,
      zh: `碱基编辑就是那个第二代：不那么轰动，却更有用。` },
    { en: `It also shows how much of biology is still engineering.`,
      zh: `它也说明，生物学中有多大一部分其实仍是工程问题。` },
    { en: `A protein is a machine with {{tolerances}}. Change its shape slightly and it stops working, or starts working somewhere else.`,
      zh: `蛋白质是一台有公差的机器。稍微改变它的形状，它就会失灵，或者在别的地方开始起作用。` },
    { en: `The people who build these tools spend most of their time on the boring parts: making them smaller, more {{specific}}, easier to deliver.`,
      zh: `制造这些工具的人，大部分时间都花在无聊的部分上：让它们更小、更专一、更容易递送。` },
    { en: `That is where the next decade of progress will come from.`,
      zh: `未来十年的进展正来自这里。` },
    { note: {
        en: 'The first generation of a tool is judged by what it can do. The second is judged by what it no longer gets wrong.',
        zh: '第一代工具因"能做什么"被评价，第二代则因"不再做错什么"被评价。'
      } }
  ],
  words: {
    'hybrid': { ipa: '/ˈhaɪbrɪd/', cn: 'n. 杂合体；混合体', ex: 'The tool is a hybrid of a DNA-binding protein and an enzyme.', exZh: '这个工具是 DNA 结合蛋白与一种酶的杂合体。' },
    'nick': { ipa: '/nɪk/', cn: 'v. 切开单链；造成切口', ex: 'The modified enzyme can only nick one strand, not cut both.', exZh: '改造后的酶只能切开一条链，而不能把两条都切断。' },
    'precision': { ipa: '/prɪˈsɪʒn/', cn: 'n. 精确度', ex: 'The advantage of base editing lies in its precision.', exZh: '碱基编辑的优势在于它的精确度。' },
    'by-products': { ipa: '/ˈbaɪ prɒdʌkts/', cn: 'n. 副产物', ex: 'Unwanted by-products are the main safety concern in gene editing.', exZh: '不需要的副产物是基因编辑中的主要安全隐患。' },
    'unintended': { ipa: '/ˌʌnɪnˈtendɪd/', cn: 'adj. 非预期的；意外的', ex: 'An unintended edit in a healthy cell can be dangerous.', exZh: '在健康细胞中发生非预期编辑可能很危险。' },
    'insert': { ipa: '/ɪnˈsɜːt/', cn: 'v. 插入', ex: 'Base editors cannot insert a whole new gene.', exZh: '碱基编辑器无法插入一个全新的基因。' },
    'constrains': { ipa: '/kənˈstreɪnz/', cn: 'v. 限制；约束（constrain 的第三人称单数）', ex: 'A narrow editing window constrains where the tool can be aimed.', exZh: '狭窄的编辑窗口限制了工具能瞄准的位置。' },
    'delivery': { ipa: '/dɪˈlɪvəri/', cn: 'n. 递送；投递', ex: 'Delivery, not editing, is the hardest problem in gene therapy.', exZh: '基因治疗中最难的问题是递送，而不是编辑。' },
    'tolerances': { ipa: '/ˈtɒlərənsɪz/', cn: 'n. 公差；容差（tolerance 的复数）', ex: 'A protein works only within narrow mechanical tolerances.', exZh: '蛋白质只在很窄的机械公差内才能工作。' },
    'specific': { ipa: '/spəˈsɪfɪk/', cn: 'adj. 专一的；特异的', ex: 'The editor must be specific enough to hit only one site.', exZh: '编辑器必须足够专一，只命中一个位点。' }
  },
  quiz: [
    { q: 'What is the key difference between a base editor and standard Cas9?',
      options: ['A base editor does not use a Cas protein at all.',
                'A base editor nicks only one strand, so there is no double-strand break.',
                'A base editor can insert a whole gene.'],
      answer: 1,
      why: '碱基编辑器用的是被改造过、只能切单链的 Cas9，因此不会产生双链断裂，也就绕开了容易出错的修复通路。' },
    { q: 'According to the passage, what is the hardest remaining problem?',

/* ---------------------------------------------------------------------------
   2026-10-30 · 科技硬件 / 先进封装
   --------------------------------------------------------------------------- */
{
  id: '2026-10-30',
  date: '2026-10-30',
  topic: '科技硬件',
  title: 'Why a Chip Is Starting to Look Like a Building',
  subtitle: 'The performance race has moved from the transistor to the space between them.',
  level: 'CET-6',
  body: [
    { en: `For fifty years, the promise of computing was simple: shrink the transistor, and everything gets faster.`,
      zh: `五十年来，计算的承诺一直很简单：把晶体管做小，一切就会变快。` },
    { en: `That promise is now harder to keep. Making a transistor smaller still works, but the gains are no longer free.`,
      zh: `这个承诺如今越来越难兑现。把晶体管做小仍然可行，但收益不再是免费的。` },
    { en: `The reason is that a modern chip is limited less by how fast it computes than by how fast it can be {{fed}}.`,
      zh: `原因在于，现代芯片的瓶颈已不在于算得多快，而在于它被"喂"数据的速度。` },
    { en: `A processor can finish an operation in a fraction of a {{nanosecond}}, yet waiting for data from memory may cost a hundred times more.`,
      zh: `一个处理器可以在几分之一纳秒内完成一次运算，但等待内存送来的数据可能要贵上一百倍。` },
    { en: `For decades, engineers solved this by putting more memory on the same piece of silicon.`,
      zh: `几十年来，工程师的解法是把更多内存放到同一块硅片上。` },
    { en: `That has run into a wall: a single large die is expensive to manufacture, and one tiny defect can ruin the whole thing.`,
      zh: `但这条路撞墙了：一整块大芯片制造成本极高，一个微小的缺陷就能毁掉整片。` },
    { en: `So the industry changed the question. Instead of building one big chip, it now builds several smaller ones and connects them.`,
      zh: `于是业界换了个问法。不再造一块大芯片，而是造几块小的，再把它们连起来。` },
    { en: `These pieces are called {{chiplets}}, and the technique is called advanced {{packaging}}.`,
      zh: `这些小块叫"芯粒"，这项技术叫先进封装。` },
    { en: `The word “packaging” sounds humble, like the box a product arrives in.`,
      zh: `"封装"这个词听起来很朴素，像是产品到手时的那个盒子。` },
    { en: `In reality it is now where much of the engineering happens.`,
      zh: `可实际上，如今大量的工程工作就发生在这里。` },
    { fig: 'package' },
    { en: `The chips sit on a thin {{interposer}} — a silicon bridge that carries thousands of tiny wires between them.`,
      zh: `这些芯片坐在一层薄薄的中介层上——一座硅桥，在它们之间承载成千上万根细微导线。` },
    { en: `Beside the processor, memory is stacked in towers called {{HBM}}, each layer joined by vertical connections that pass straight through the silicon.`,
      zh: `处理器旁边，内存被堆成一座座塔，称为 HBM，每一层都通过直接穿过硅片的垂直连接相连。` },
    { en: `A stack of eight layers can move data over a {{bus}} a thousand times wider than a conventional one, at a fraction of the energy per bit.`,
      zh: `一个八层堆栈能通过比传统通道宽上千倍的总线搬运数据，而每比特的能耗只有一小部分。` },
    { en: `This is why the fastest AI accelerators are enormous: not because the logic is huge, but because the memory has to be close.`,
      zh: `这就是为什么最快的 AI 加速器体积极大：不是因为逻辑部分大，而是因为内存必须靠近。` },
    { en: `The cost is that almost nothing about it is easy.`,
      zh: `代价是，这件事几乎没有一处是容易的。` },
    { en: `Every wire must be aligned to within a few micrometres, and any {{warpage}} in the stack can break the connection.`,
      zh: `每一根导线都必须对准到几微米以内，堆栈里任何一点翘曲都可能让连接失效。` },
    { en: `Heat is worse. Eight layers of memory packed together cannot cool themselves the way separate chips could.`,
      zh: `散热更糟。八层内存挤在一起，没法像分开的芯片那样自行散热。` },
    { en: `And {{yield}} becomes a gamble: if one chiplet in a package fails, the whole package may be {{scrap}}.`,
      zh: `良率也成了一场赌博：如果封装里有一颗芯粒失效，整个封装可能就报废了。` },
    { en: `Manufacturers respond by testing each chiplet before assembly, and by designing packages that can lose one piece and still work.`,
      zh: `厂商的应对是：在组装前逐颗测试芯粒，并设计出即使损失一块仍能工作的封装。` },
    { en: `None of this is visible to the person using a phone.`,
      zh: `这一切对使用手机的人来说都不可见。` },
    { en: `What is visible is the consequence: performance now improves in steps, tied to new packaging generations rather than to a steady yearly shrink.`,
      zh: `可见的是后果：性能如今以台阶式提升，绑定在封装的新世代上，而不是每年稳定地缩小。` },
    { en: `That changes what a “generation” means. It is less a number on a transistor and more an architecture of connections.`,
      zh: `这也改变了"一代"的含义。它不再是晶体管上的一个数字，而更像一种连接的结构。` },
    { en: `For students, it is a useful correction to a common assumption.`,
      zh: `对学生来说，这是对一个常见假设的有益纠正。` },
    { en: `The interesting problems in computing are no longer only in the transistor. They are in the wires, the heat, and the mechanical {{tolerance}} between pieces.`,
      zh: `计算中有趣的问题不再只存在于晶体管里。它们在导线里、在热量里、在零件之间的机械公差里。` },
    { en: `That is materials science, mechanical engineering and physics as much as it is electronics.`,

/* ---------------------------------------------------------------------------
   ① 2026-10-29  AI 大模型（示范推文 · 约 500 词 · 10 分钟）
   --------------------------------------------------------------------------- */
{
  id: '2026-10-29',
  date: '2026-10-29',
  topic: 'AI 大模型',
  title: 'The Model That Fits in Your Pocket',
  subtitle: 'Why the most interesting race in AI is no longer about size.',
  level: 'CET-6',
  body: [
    { en: `For years, the story of artificial intelligence was a story about {{scale}}: bigger models, bigger {{clusters}}, bigger electricity bills.`,
      zh: `多年来，人工智能的故事一直是一个关于规模的故事：更大的模型、更大的集群、更高的电费。` },
    { en: `That story is now being rewritten — not by the largest labs, but by engineers who are trying to make a model small enough to run on a phone.`,
      zh: `而如今，这个故事正在被改写——改写者不是最大的实验室，而是那些努力让模型小到可以跑在手机上的工程师。` },
    { en: `A large language model is, at its core, a very long list of numbers called {{parameters}}.`,
      zh: `从本质上说，大语言模型就是一长串被称为"参数"的数字。` },
    { en: `A frontier model may hold hundreds of billions of them, and every word it generates requires a small {{fraction}} of that list to be read.`,
      zh: `一个前沿模型可能拥有数千亿个参数，而它每生成一个词，都需要读取其中一小部分。` },
    { en: `This is why {{inference}} — using a trained model, rather than training it — is so expensive.`,
      zh: `这就是为什么"推理"——即使用一个已经训练好的模型，而不是训练它——如此昂贵。` },
    { en: `Training happens once; inference happens billions of times a day, and each time the hardware must move an enormous amount of data from memory to the processor.`,
      zh: `训练只发生一次；推理每天发生数十亿次，而每一次硬件都必须把海量数据从内存搬运到处理器。` },
    { en: `On a server this is merely costly. On a phone it becomes a {{bottleneck}}, because memory {{bandwidth}} and battery life are fixed.`,
      zh: `在服务器上，这仅仅是成本问题。在手机上，它却成了一个瓶颈，因为内存带宽和电池续航都是固定的。` },
    { en: `Engineers have therefore attacked the problem from two directions.`,
      zh: `因此，工程师从两个方向着手解决这个问题。` },
    { en: `The first is {{quantization}}, which stores each parameter in fewer bits — often eight instead of sixteen, sometimes four.`,

    { fig: 'precision' },
    { en: `The second is {{distillation}}, in which a small model is trained to imitate the answers of a much larger one.`,
      zh: `第二种是"蒸馏"，即训练一个小模型去模仿一个大得多的模型的回答。` },
    { en: `The student never sees the teacher's internal machinery; it learns only from the teacher's output.`,
      zh: `学生模型从不接触教师模型的内部机制，它只从教师的输出中学习。` },
    { en: `Neither technique is free.`,
      zh: `这两种技术都不是没有代价的。` },
    { en: `Quantization trades precision for memory, distillation trades capacity for speed, and each involves a {{trade-off}} that has to be measured rather than assumed.`,
      zh: `量化用精度换内存，蒸馏用容量换速度，而每一种都涉及一种必须实测而非假定的取舍。` },
    { en: `The results are already visible to ordinary users.`,
      zh: `这些成果对普通用户来说已经可见。` },
    { en: `Phone keyboards now suggest whole sentences offline, cameras identify plants without a network connection, and translation apps work in airplane mode.`,
      zh: `手机键盘如今可以离线联想整句，相机无需联网就能识别植物，翻译应用在飞行模式下也能工作。` },
    { en: `In each case a model that once needed a data centre now runs in a few hundred megabytes of memory.`,
      zh: `在每一个例子中，曾经需要数据中心才能运行的模型，如今只占用几百兆内存。` },
    { en: `The engineering consequences reach further than convenience.`,
      zh: `这些工程后果的影响，远超"方便"本身。` },
    { en: `On-device models {{preserve}} privacy, because the data never leaves the phone.`,

/* ---------------------------------------------------------------------------
   ② 2026-10-28  金融交易 / 市场微观结构（约 330 词）
   --------------------------------------------------------------------------- */
{
  id: '2026-10-28',
  date: '2026-10-28',
  topic: '量化金融',
  title: 'The Market That Lives in Milliseconds',
  subtitle: 'What actually happens in the microseconds after you press “buy”.',
  level: 'CET-6',
  body: [
    { en: `When you press “buy” in a trading app, nothing seems to happen.`,
      zh: `当你在交易软件里按下"买入"，似乎什么都没发生。` },
    { en: `In reality your order enters a queue, is matched against another order, and is confirmed — all within a few hundred {{microseconds}}, a thousand times faster than a blink.`,
      zh: `实际上，你的订单进入一个队列，与另一笔订单撮合，然后被确认——全部在几百微秒内完成，比眨一次眼快一千倍。` },
    { en: `The place where this happens is called the {{order book}}.`,
      zh: `这一切发生的地方，叫做订单簿。` },
    { en: `It is simply two lists: everyone willing to buy at each price, and everyone willing to sell.`,
      zh: `它就是两份清单：每个价位上所有愿意买入的人，以及所有愿意卖出的人。` },
    { en: `The gap between the best buy and the best sell is the {{spread}}, and it is where market makers earn their living.`,
      zh: `最优买价与最优卖价之间的差额就是价差，做市商正是靠它谋生。` },
    { en: `A market maker quotes both sides at once and profits from that gap, but takes on {{inventory}} risk, because the price may move before the position is closed.`,
      zh: `做市商同时报出买卖两边价格，从价差中获利，但要承担库存风险：在头寸平掉之前，价格可能已经变化。` },
    { fig: 'orderbook' },
    { en: `Speed matters because information arrives unevenly.`,
      zh: `速度之所以重要，是因为信息的到达并不均匀。` },
    { en: `If a large buyer\u2019s order becomes visible in one market a millisecond before it appears in another, whoever sees it first can trade ahead of the price move.`,
      zh: `如果一个大买家的订单在一个市场比在另一个市场早一毫秒可见，那么先看到的人就能在价格变动之前抢先交易。` },
    { en: `This is {{arbitrage}} in its purest form, and it explains why firms pay to put their servers inside the exchange\u2019s own building.`,
      zh: `这是最纯粹形式的套利，也解释了为什么公司愿意花钱把服务器放进交易所自己的大楼里。` },
    { en: `The practice is called {{colocation}}, and the advantage it buys is measured in microseconds.`,
      zh: `这种做法叫托管共置，它换来的优势以微秒计。` },
    { en: `A firm that is one microsecond faster can take an opportunity that a slower firm never even sees.`,
      zh: `快一微秒的公司，能抓住一个更慢的公司根本看不到的机会。` },
    { en: `Critics argue that this is a {{zero-sum}} game, consuming serious engineering talent for no social gain.`,
      zh: `批评者认为这是一场零和博弈，消耗了大量工程人才，却没有带来社会收益。` },
    { en: `Defenders reply that speed competition has made markets cheaper: spreads on {{liquid}} stocks have narrowed sharply over two decades, and that saving is paid to ordinary investors.`,
      zh: `支持者则回应说，速度竞争让市场变得更便宜：流动性好的股票，其价差在过去二十年里大幅收窄，而这份节省最终由普通投资者受益。` },
    { en: `Both sides are partly right, and the interesting question is where the boundary lies.`,
      zh: `双方都有部分道理，而真正有趣的问题是边界在哪里。` },
    { en: `For a student, the lesson is not that speed is good or bad.`,
      zh: `对一名学生来说，收获不在于速度是好还是坏。` },
    { en: `It is that every price you see is the {{outcome}} of a physical process — cables, switches, clocks — rather than an abstract number.`,
      zh: `而在于：你所看到的每一个价格，都是一个物理过程的产物——线缆、交换机、时钟——而不是一个抽象的数字。` },
    { en: `The same logic explains why exchanges sell faster connections at higher prices, and why a new cable across an ocean can shift the balance between two cities.`,
      zh: `同样的逻辑可以解释：为什么交易所能以更高的价格出售更快的连接，以及为什么一条新的海底光缆能改变两座城市之间的力量平衡。` },
    { en: `None of this makes price movements predictable; it only makes the machinery visible.`,
