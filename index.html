   2026-11-10 · AI 大模型 / 长上下文：KV 缓存、二次复杂度与"中间遗忘"
   --------------------------------------------------------------------------- */
{
  id: '2026-11-10',
  date: '2026-11-10',
  topic: 'AI 大模型',
  title: 'The Cost of Remembering',
  subtitle: 'A chat model carries nothing from one word to the next. Everything it seems to remember, it pays for again.',
  level: 'CET-6',
  body: [
    { en: `A chat model looks as if it remembers the conversation, yet it keeps no memory the way a person does.`,
      zh: `聊天模型看起来记得这段对话，但它并不像人那样存着一份记忆。` },
    { en: `Every time it writes a new word, it reads the whole {{transcript}} again, from the first line to the last.`,
      zh: `每当它写出一个新词，它就把整段{{对话记录}}从头到尾再读一遍。` },
    { en: `The text is cut into tokens, and each token is turned into a long list of numbers called an {{embedding}}.`,
      zh: `文本先被切成词元，每个词元再被转换成一长串数字，称为{{嵌入向量}}。` },
    { en: `Numbers can be compared, so the {{attention}} mechanism compares every pair of tokens in the passage.`,
      zh: `数字可以相互比较，于是{{注意力}}机制会把文中每一对词元都比一遍。` },
    { en: `The work therefore grows with the square of the length: double the text and you do four times as much arithmetic.`,
      zh: `计算量因此随长度的平方增长：文本翻倍，运算量就变成四倍。` },
    { en: `This {{quadratic}} growth is why a very long {{prompt}} costs far more than a short one, even before the model answers.`,
      zh: `这种{{二次}}增长正是超长{{提示词}}远比短提示词昂贵的原因，而且这笔账在模型开口之前就已经算上了。` },
    { en: `Repeating all that work for every new word would be unbearable, so engineers store the intermediate results.`,
      zh: `每写一个新词就把全部工作重做一遍，是谁也受不了的，所以工程师把中间结果存了下来。` },
    { en: `This store is called the KV {{cache}}, and it is closer to a working desk than to a library.`,
      zh: `这个存储叫作 KV {{缓存}}，它更像一张摊满草稿的工作台，而不是一座图书馆。` },
    { en: `It holds, for each token already seen, two {{vector}} lists that later tokens will need to consult.`,
      zh: `对每一个已经见过的词元，它保存两份{{向量}}表，供后面的词元查阅。` },
    { en: `The size is easy to estimate: layers times width times two, times the number of tokens, times the bytes per number.`,
      zh: `它的大小不难估算：层数乘宽度再乘二，再乘词元数量，再乘每个数字占的字节数。` },
    { en: `For a mid-sized model this comes to roughly half a megabyte per token, which sounds small until you multiply it.`,
      zh: `对中等规模的模型，这大约是每个词元半个兆字节——听上去不多，直到你乘上去。` },
    { en: `A hundred thousand tokens then need about fifty gigabytes, more than the card that is doing the thinking.`,
      zh: `十万个词元就需要约五十吉字节，比正在"思考"的那张显卡还要大。` },
    { note: {
        en: 'The model does not remember you. It re-reads you, and the cache is the desk it re-reads you on.',
        zh: '模型并不"记得"你，它只是把你重读一遍；而缓存，就是它重读你的那张桌子。'
      } },
    { en: `Memory is the real limit, because whatever space the cache takes cannot serve another user at the same time.`,
      zh: `真正的瓶颈是显存：缓存占掉的那部分空间，同一时间没法再拿去服务另一个用户。` },
    { en: `Serving systems therefore pack many conversations into one card, and a single long chat can push the rest out.`,
      zh: `所以服务系统会把许多对话塞进同一张卡，而一个特别长的对话就可能把其余的挤出去。` },
    { en: `Early systems reserved a fixed block for every request and wasted most of it, so newer ones copied an idea from operating systems.`,
      zh: `早期系统为每个请求预留固定的一块空间，大半都浪费了；新系统于是从操作系统那里借了一招。` },
    { en: `They cut the cache into small pages and hand them out only when they are actually filled.`,
      zh: `它们把缓存切成小页，只在真正写满时才分配出去。` },
    { en: `The second problem is not space but quality: a model trained on short passages does not automatically read long ones well.`,
      zh: `第二个问题不在空间，而在质量：一个只在短段落上训练的模型，并不会自动读好长文。` },
    { en: `The facts in the middle of a long input are harder to {{recall}} than the ones at either end.`,
      zh: `长输入中段的事实，比两端的事实更难被{{回忆}}起来。` },
    { en: `Position numbers beyond anything seen in training also behave badly, so stretching the window is never free.`,
      zh: `超出训练时见过的位置编号同样表现失常，所以把窗口拉长从来不是白拿的。` },
    { en: `One common {{compromise}} is a sliding window, in which the model keeps only the most recent tokens in full detail.`,
      zh: `一种常见的{{折中}}是滑动窗口：模型只完整保留最近的一批词元。` },
    { en: `Another is a {{sparse}} pattern, where each token looks at a few chosen neighbours instead of all of them.`,
      zh: `另一种是{{稀疏}}模式：每个词元只看少数挑出来的邻居，而不是全部。` },
    { en: `Both save memory, and both give up some exactness, which is the honest price of a longer conversation.`,
      zh: `两种办法都省显存，也都放弃了一部分精确性——这就是更长对话要付的诚实价格。` },
    { en: `So when a service advertises a million tokens of context, the interesting question is not the number.`,
      zh: `所以当某项服务宣传"百万词元上下文"时，真正有意思的问题并不是那个数字。` },
    { en: `It is how much of that window the model can still use, and what the provider gave up to {{allocate}} it.`,
      zh: `而是那扇窗口里模型还能真正用上多少，以及服务商为了{{分配}}出这些空间，究竟让掉了什么。` }
  ],
  words: {

    'quadratic': { ipa: '/kwɒˈdrætɪk/', cn: 'adj. 二次的；平方的', ex: 'The cost grows in a quadratic way, not a linear one.', exZh: '这种成本按二次方式增长，而不是线性增长。' },
    'prompt': { ipa: '/prɒmpt/', cn: 'n. 提示词（adj. 迅速的；v. 促使）', ex: 'A long prompt is paid for even before the first answer token.', exZh: '长提示词在第一个回答词元出现之前就已经在计费了。' },

    'recall': { ipa: '/rɪˈkɔːl/', cn: 'v. 回忆起；召回（n. 召回）', ex: 'The model recalls the start of a document better than its middle.', exZh: '模型对文档开头的回忆要好于中段。' },
    'compromise': { ipa: '/ˈkɒmprəmaɪz/', cn: 'n. 折中；妥协（v. 让步；危及）', ex: 'A sliding window is a compromise between cost and reach.', exZh: '滑动窗口是成本与覆盖范围之间的折中。' },
    'sparse': { ipa: '/spɑːs/', cn: 'adj. 稀疏的；稀少的', ex: 'A sparse pattern skips most pairs and keeps only a few.', exZh: '稀疏模式跳过大多数配对，只保留少数几对。' },

  id: '2026-11-09',
  date: '2026-11-09',
  topic: '前沿科研',
  title: 'The Star That Will Not Sit Still',
  subtitle: 'Fusion is easy to start and hard to hold: the real obstacle is not heat, but a boiling fluid that keeps moving.',
  level: 'CET-6',
  body: [
    { en: `The Sun has no magnets and no engineers; it holds its burning {{fusion}} core together with gravity.`,
      zh: `太阳既没有磁体，也没有工程师，它靠引力把正在{{聚变}}的核心拢在一起。` },
    { en: `On Earth gravity is far too weak for that trick, so the only force left strong enough is magnetism.`,
      zh: `在地球上，引力弱得根本玩不了这一手，剩下唯一够强的力量就只有磁性。` },
    { en: `A fusion reactor therefore looks like a doughnut: a ring-shaped chamber in which hot gas is held clear of every wall.`,
      zh: `所以聚变装置看起来像个甜甜圈：一个环形真空室，炽热的气体被悬空托住，不碰任何一面器壁。` },
    { en: `The gas is not ordinary air but {{plasma}}, the fourth state of matter, in which electrons have been torn from their nuclei.`,
      zh: `这团气体不是普通空气，而是{{等离子体}}——物质的第四态，电子已经被从原子核上剥离。` },
    { en: `Because it is charged, it can be steered by magnetic fields the way a river is steered by its banks.`,
      zh: `因为带电，它能被磁场引导，就像河水被河岸引导一样。` },
    { en: `In a {{tokamak}} the field is twisted into a helix, so no particle can run straight out along a single line.`,
      zh: `在{{托卡马克}}里，磁场被拧成螺旋，没有哪个粒子能沿一条直线直接跑出去。` },
    { en: `Heating is the easy part: strong currents, microwaves and beams of fast atoms all push the temperature past one hundred million degrees.`,
      zh: `加热反而是容易的部分：强大电流、微波和高速原子束，都能把温度推过一亿度。` },
    { en: `The hard part is that a hot, charged fluid refuses to sit still.`,
      zh: `难的地方在于，一团炽热带电的流体根本不肯老实待着。` },
    { en: `Engineers sum up the goal in a product of three numbers: density, temperature, and how long the energy stays {{confined}}.`,
      zh: `工程师把目标浓缩成三个数字的乘积：密度、温度，以及能量被{{约束}}住的时间。` },
    { en: `Push any one of them up and the other two tend to fall, which is why progress has been slow and expensive.`,
      zh: `把其中任何一个抬上去，另外两个往往就往下掉——这就是进展既慢又贵的原因。` },
    { en: `Worse, the plasma generates its own fields, and those fields can grow into {{instability}}.`,
      zh: `更麻烦的是，等离子体自己会生磁场，而那些磁场会长成{{不稳定性}}。` },
    { en: `A tear in the magnetic surfaces lets heat escape in a narrow tongue, while {{turbulence}} stirs the rest out far faster than the first theories predicted.`,
      zh: `磁面上的一道撕裂，会让热量顺着一条窄舌漏出去；而{{湍流}}把剩下的热搅得更快泄走，比最早的理论预言快得多。` },
    { en: `A sudden collapse at the edge can drop a tenth of the stored energy onto one small tile in a millisecond.`,
      zh: `边缘的突然崩塌，能在毫秒之间把十分之一的储能砸到一小块瓦片上。` },
    { note: {
        en: 'A fusion reactor is not a furnace. It is a magnetic bottle that has to stay sealed while it boils.',
        zh: '聚变装置不是炉子，而是一只必须在沸腾时保持密封的磁瓶。'
      } },
    { en: `Even a perfect bottle faces a second problem: the {{neutron}}s released by fusion carry most of the energy and ignore every magnetic field.`,
      zh: `即使瓶子完美，还有第二个难题：聚变放出的{{中子}}带走了大部分能量，而它们对任何磁场都不理不睬。` },
    { en: `They fly into the wall, knock atoms out of their places in the metal, and slowly make it {{brittle}}.`,
      zh: `它们撞进壁面，把金属里的原子从原位撞开，慢慢让材料变{{脆}}。` },
    { en: `The same stream must also breed the fuel, because {{tritium}} barely exists in nature.`,
      zh: `同一批中子还得用来“造”燃料，因为{{氚}}在自然界几乎不存在。` },
    { en: `The plan is a {{blanket}} of lithium around the chamber: one neutron splits one lithium nucleus into helium and tritium, and the plant feeds itself.`,
      zh: `方案是在腔体外围包一层锂做的{{包层}}：一个中子把一个锂核劈成氦和氚，电站就能自己供燃料。` },
    { en: `That loop has never run continuously, and until it does, fusion stays a triumph of physics and an open question in engineering.`,
      zh: `这个循环从未连续跑通过；在它跑通之前，聚变始终是物理上的胜利、工程上的问号。` },
    { en: `ITER, the international machine now being assembled in France, is not a power station but a test of whether these parts can live together.`,
      zh: `正在法国组装的那台国际装置 ITER 并不是电站，而是在检验这些部件能否共存。` },
    { en: `Its giant coils are {{superconducting}}, cooled to a few degrees above absolute zero so that current can circle for years without fading.`,
      zh: `它的巨型线圈是{{超导}}的，被冷到只比绝对零度高几度，电流能在里面绕上好几年而不衰减。` },
    { en: `Newer private designs use high-temperature superconductors to squeeze the same field into a much smaller ring, betting that smaller will be cheaper.`,
      zh: `一些更新的私营方案改用高温超导，把同样的磁场压进小得多的环里，赌的是“小即便宜”。` },
    { en: `Both roads share one honest measure of progress: not a press release, but the number of seconds a plasma stays hot.`,
      zh: `两条路线共用同一把诚实的进度尺：不是新闻稿，而是等离子体维持高温的秒数。` },
    { en: `So the question worth asking is not when fusion arrives, but which of three barriers falls first: turbulence, materials, or the fuel cycle.`,
      zh: `所以真正值得追问的不是“聚变何时到来”，而是三道关口——湍流、材料、燃料循环——哪一个先被攻破。` }
  ],
  words: {
    'fusion': { ipa: '/ˈfjuːʒn/', cn: 'n. 核聚变；融合', ex: 'Fusion releases energy when light nuclei join together.', exZh: '轻原子核结合时，聚变会释放能量。' },
    'plasma': { ipa: '/ˈplæzmə/', cn: 'n. 等离子体；血浆', ex: 'A plasma conducts electricity because its charges are free to move.', exZh: '等离子体能导电，因为其中的电荷可以自由移动。' },
    'tokamak': { ipa: '/ˈtəʊkəmæk/', cn: 'n. 托卡马克（环形磁约束聚变装置）', ex: 'A tokamak bends its field into a closed loop.', exZh: '托卡马克把磁场弯成一个闭合的环。' },
    'confined': { ipa: '/kənˈfaɪnd/', cn: 'adj. 被约束的；受限的（confine v. 把…限制在）', ex: 'Energy that stays confined longer makes ignition easier.', exZh: '能量被约束得越久，点火就越容易。' },
    'instability': { ipa: '/ˌɪnstəˈbɪləti/', cn: 'n. 不稳定性；失衡', ex: 'The instability grew until the plasma touched the wall.', exZh: '不稳定性不断增长，直到等离子体碰到器壁。' },
    'turbulence': { ipa: '/ˈtɜːbjələns/', cn: 'n. 湍流；紊流；混乱', ex: 'Turbulence carries heat out much faster than smooth flow would.', exZh: '湍流带走热量的速度远快于平顺的流动。' },
    'neutron': { ipa: '/ˈnjuːtrɒn/', cn: 'n. 中子', ex: 'A neutron has no charge, so a magnetic field cannot hold it.', exZh: '中子不带电，所以磁场抓不住它。' },
    'brittle': { ipa: '/ˈbrɪtl/', cn: 'adj. 脆的；易碎的', ex: 'Years of bombardment leave the steel brittle.', exZh: '多年的轰击会让钢材变脆。' },
    'tritium': { ipa: '/ˈtrɪtiəm/', cn: 'n. 氚（氢的同位素）', ex: 'Tritium is radioactive and rare outside a reactor.', exZh: '氚具有放射性，在反应堆之外十分稀少。' },
    'blanket': { ipa: '/ˈblæŋkɪt/', cn: 'n. 包层；毯子（v. 覆盖）', ex: 'The blanket turns neutrons into heat and new fuel.', exZh: '包层把中子转化成热量和新燃料。' },
    'superconducting': { ipa: '/ˌsuːpəkənˈdʌktɪŋ/', cn: 'adj. 超导的（superconduct v. 超导）', ex: 'Superconducting coils carry current with no resistance at all.', exZh: '超导线圈输电时完全没有电阻。' }
  },
  quiz: [
    { q: 'Why can a fusion reactor not simply be a very hot sealed box?',
      options: ['Because no material survives contact with a plasma at one hundred million degrees, so magnetic fields must hold the gas away from every wall.',
                'Because the plasma would leak out through the gaps between the reactor tiles.',
                'Because fusion can only occur in a vacuum with no gas present at all.'],
      answer: 0,
      why: '原文的核心是“器壁不能碰”：亿度量级的等离子体一接触实体材料就会损毁，所以真正的容器是磁场，金属壁只是最后的备份。' },
    { q: 'What does the "product of three numbers" tell engineers?',
      options: ['That density, temperature and confinement time can each be raised independently without cost.',
                'That the three factors trade against one another, so raising one usually costs another, which is why progress is slow and expensive.',
                'That temperature alone decides success, since the other two follow automatically.'],
      answer: 1,
      why: '三重积是三者相乘，抬高一个往往压掉另一个，所以每一步都要在密度、温度和约束时间之间权衡，这正是进展缓慢又昂贵的原因。' },
    { q: 'Why is tritium treated as a problem rather than as fuel that can simply be bought?',
      options: ['Because tritium is radioactive and therefore impossible to transport.',
                'Because it barely exists in nature and has to be bred from lithium by the very neutrons that fusion produces.',
                'Because it can only be manufactured inside the Sun.'],
      answer: 1,
      why: '氚在自然界存量极微，必须靠聚变放出的中子轰击锂来增殖，于是“燃料循环”本身成了必须先跑通的技术关口。' }
  ]
},

/* ---------------------------------------------------------------------------
   2026-11-08 · 金融交易与市场 / 做市商的价差、库存与逆向选择
   --------------------------------------------------------------------------- */
{
  id: '2026-11-08',
  date: '2026-11-08',
  topic: '金融交易与市场',
  title: 'The Price of Not Waiting',
  subtitle: 'A market maker earns the gap between two prices, and pays for it with the risk of being wrong.',
  level: 'CET-6',
  body: [
    { en: `When you press buy on a screen, someone has to be selling at that exact instant.`,
      zh: `当你在屏幕上按下买入时，必须有某个人恰好在那一刻卖出。` },
    { en: `Most of the time that someone is not a person watching a chart, but a firm that has agreed to stand there all day.`,
      zh: `多数时候，那个人并不是盯着K线的散户，而是一家答应整天守在那里的机构。` },
    { en: `Such a firm is a market maker, and its {{quote}} is not a promise to trade later but a standing offer to trade now.`,
      zh: `这种机构就是做市商；它给出的{{报价}}不是“稍后再成交”的承诺，而是“现在就能成交”的常设出价。` },
    { en: `It shows two prices at once: the {{bid}}, where it will buy, and the ask, where it will sell.`,
      zh: `它同时挂出两个价格：愿意买入的{{买价}}，和愿意卖出的卖价。` },
    { en: `The distance between them is the {{spread}}, and on a round trip the spread is almost all the firm earns.`,
      zh: `两者之间的距离就是{{价差}}；一次买入再卖出，做市商赚的几乎全是这个价差。` },
    { en: `The job therefore looks less like forecasting and more like the currency counter at an airport.`,
      zh: `所以这门生意看起来不像预测，更像机场里的外币兑换柜台。` },
    { en: `The counter buys dollars cheaply, sells them dearly, and stays indifferent to where the exchange rate ends the week.`,
      zh: `柜台低价收进美元、高价卖出，至于一周后汇率走到哪儿，它并不关心。` },
    { en: `Two prices, thousands of small trades, and a thin margin on each one — that is the whole business.`,
      zh: `两个价格、成千上万笔小单、每笔只赚一点点——生意的全部内容就是这些。` },
    { en: `It survives only because most of the people trading with it are not experts.`,
      zh: `它能活下来，只因为和它交易的多数人并不是内行。` },
    { en: `A tourist selling leftover cash is easy to trade with; a fund that has read next week's data is not.`,
      zh: `游客来卖剩下的现金，很好对付；而一家已经读完下周数据的基金，就不好对付了。` },
    { en: `When a {{counterparty}} keeps buying just before prices rise, the firm's loss has a name: {{adverse}} selection.`,
      zh: `当某个{{交易对手}}总在价格上涨前一刻买入，做市商的亏损就有了名字：{{逆向}}选择。` },
    { en: `No one can label an order informed or lucky in advance, so the firm defends itself with statistics, not intuition.`,
      zh: `没人能提前给一笔单子贴上“知道内情”或“只是运气”的标签，所以它只能靠统计而不是直觉来自保。` },
    { en: `The first defence is {{inventory}}.`,
      zh: `第一道防线是{{库存}}。` },
    { en: `Every fill leaves it holding a position it did not choose, and an unwanted position is pure risk.`,
      zh: `每一笔成交都会让它手里多出一个并非自己挑中的仓位，而不想要的仓位就是纯粹的风险。` },
    { en: `If it has bought too much, it lowers both prices a little; cheaper offers attract sellers and pull the position back toward zero.`,
      zh: `如果买多了，它就把两个价格一起压低一点；更便宜的卖价会招来卖家，把仓位推回零附近。` },
    { en: `This quiet adjustment is called skewing the quote, and it is one engine behind very short-term price movement.`,
      zh: `这个不声不响的调整叫报价倾斜，它是极短期价格波动背后的引擎之一。` },
    { note: {
        en: 'A spread is not a fee charged by a middleman. It is the price of not having to wait.',
        zh: '价差不是中间人收的手续费，它是“不必等待”的价格。'
      } },
    { en: `The second defence is to {{hedge}}: a stock position can be offset with index futures, so the firm keeps the spread and gives away the direction.`,
      zh: `第二道防线是{{对冲}}：一只股票的仓位可以用股指期货抵掉，这样价差留下，方向让出去。` },
    { en: `The third is to widen the spread when {{volatility}} jumps, and the fourth is to quote a smaller size.`,
      zh: `第三道是{{波动率}}跳升时把价差拉宽，第四道是把挂单量调小。` },
    { en: `Exchanges know that firms can always walk away, so they buy the right to be quoted back with a contract.`,
      zh: `交易所清楚机构随时可以走人，于是用一份合约把“被报价”的权利买了回来。` },
    { en: `A designated market maker signs an {{obligation}} to display a minimum size for a minimum share of the trading day.`,
      zh: `指定的做市商签下一项{{义务}}：在一天中至少多大比例的时间里，挂出不低于某个数量的单子。` },
    { en: `In return it receives {{rebate}}s and lower fees, which is how a firm profits from a spread of a single tick.`,
      zh: `作为回报，它拿到{{返佣}}和更低的费率——这就是为什么一家机构能靠一个最小价位的价差赚钱。` },
    { en: `That same contract explains an uncomfortable fact: {{liquidity}} disappears exactly when it is most needed.`,
      zh: `同一份合约也解释了一个让人不舒服的事实：{{流动性}}恰恰在最需要的时候消失。` },
    { en: `In a fast decline, standing ready becomes a licence to lose money, and many firms step back.`,
      zh: `在急跌行情里，“随时报价”就变成了亏损许可，于是许多机构退到一边。` },
    { en: `Regulators answer with obligations that survive a crash, with halts when prices fall too fast, and with rules that force every trade to be reported.`,
      zh: `监管的回应是：让报价义务在崩盘时依然有效，在价格跌得太快时暂停交易，并要求每一笔成交都被上报。` },
    { en: `None of this is a technical footnote; it decides what it costs you to sell in a hurry.`,
      zh: `这些都不是技术细节，它决定了你急着卖出时要付多少钱。` },
    { en: `The spread is not a tax invented by villains, but the rent paid to whoever holds the risk while everyone else makes up their mind.`,
      zh: `价差不是坏人发明的税，而是付给那个愿意替所有人扛住风险、等大家想清楚的人的租金。` }
  ],
  words: {
    'quote': { ipa: '/kwəʊt/', cn: 'n. 报价；行情（v. 报价）', ex: 'A quote is a standing offer, not a promise about the future.', exZh: '报价是一个常设的出价，而不是对未来的承诺。' },
    'bid': { ipa: '/bɪd/', cn: 'n. 买价；出价（v. 出价）', ex: 'The bid is the highest price a buyer is willing to pay right now.', exZh: '买价是此刻买方愿意支付的最高价。' },
    'spread': { ipa: '/spred/', cn: 'n. 价差；利差（v. 展开）', ex: 'The spread widens when uncertainty rises.', exZh: '不确定性上升时，价差会变宽。' },
    'counterparty': { ipa: '/ˈkaʊntəpɑːti/', cn: 'n. 交易对手；对手方', ex: 'A market maker must judge whether each counterparty knows more than it does.', exZh: '做市商必须判断每个交易对手是否比自己知道得更多。' },
    'adverse': { ipa: '/ˈædvɜːs/', cn: 'adj. 不利的；相反的（adverse selection 逆向选择）', ex: 'Adverse selection means the orders you win are the ones you should not want.', exZh: '逆向选择意味着你抢到的单子恰恰是你不该要的。' },
    'inventory': { ipa: '/ˈɪnvəntri/', cn: 'n. 库存；存货', ex: 'The firm cuts its inventory before the announcement.', exZh: '机构在数据公布前削减自己的库存。' },
    'hedge': { ipa: '/hedʒ/', cn: 'v. 对冲；规避风险（n. 对冲手段）', ex: 'It hedges a single stock with index futures.', exZh: '它用股指期货为单只股票做对冲。' },
    'volatility': { ipa: '/ˌvɒləˈtɪləti/', cn: 'n. 波动率；波动性', ex: 'When volatility jumps, quoting becomes expensive.', exZh: '波动率跳升时，报价就变得昂贵。' },
    'obligation': { ipa: '/ˌɒblɪˈɡeɪʃn/', cn: 'n. 义务；责任', ex: 'The contract imposes an obligation to quote a minimum size.', exZh: '这份合约规定了一项挂出最小数量的义务。' },
    'rebate': { ipa: '/ˈriːbeɪt/', cn: 'n. 返佣；退款（v. 退还部分款项）', ex: 'Exchanges pay rebates to the firms that supply liquidity.', exZh: '交易所向提供流动性的机构支付返佣。' },
    'liquidity': { ipa: '/lɪˈkwɪdəti/', cn: 'n. 流动性；变现能力', ex: 'Liquidity is a promise that is easy to make in calm markets.', exZh: '流动性是一种在平静市场里很容易许下的承诺。' }
  },
  quiz: [
    { q: 'Why does the article compare a market maker to a currency counter at an airport?',
      options: ['Because both deal only with foreign money.',
                'Because both earn a small margin between two posted prices while staying neutral about direction.',
                'Because both stop trading when the market becomes busy.'],
      answer: 1,
      why: '原文用兑换柜台作类比：低价买入、高价卖出，靠两个报价之间的薄利赚钱，而对方向（汇率最终走到哪儿）并不在意。' },
    { q: 'What does adverse selection mean for a market maker?',
      options: ['The orders it manages to fill are disproportionately the ones placed by better-informed traders.',
                'It is forced by regulation to trade with retail investors only.',
                'It loses money whenever the spread is narrower than one tick.'],
      answer: 0,
      why: '逆向选择指它抢到的单子大多来自信息更充分的一方：对方正好在价格要变动前成交，做市商因此系统性吃亏。' },
    { q: 'Why does liquidity often vanish exactly when it is needed most?',
      options: ['Because exchanges close their order books during a decline.',
                'Because quoting freely in a fast decline turns into a licence to lose money, so firms step back.',
                'Because regulators forbid trading in a falling market.'],
      answer: 1,
      why: '原文说急跌时“随时报价”等于允许自己不断亏损，于是许多机构撤单退出，流动性因此在最需要的时候消失；监管的回应正是让报价义务在崩盘时仍然有效。' }
  ]
},
